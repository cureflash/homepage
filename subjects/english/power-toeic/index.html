<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14191f">
  <title>Power TOEIC</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button type="button" class="brand-button" data-action="home" aria-label="ホームへ戻る"><span class="eyebrow">POWER TOEIC</span><span class="brand-title">集中トレーニング</span></button>
      <div class="progress-pill" data-role="progress" aria-label="問題進捗">HOME</div>
    </header>
    <p class="bank-status" data-role="bank-status" aria-live="polite">β問題DBを読み込み中...</p>

    <section data-view="home" aria-label="ホーム"></section>
    <section data-view="workout-editor" aria-label="ワークアウト編集" hidden></section>

    <section class="quiz-view" data-view="quiz" hidden>
      <div class="character-row"><div class="character-placeholder sergeant" data-role="sergeant-character" aria-live="polite"></div><div class="speech" data-role="feedback">軍曹「この一問を仕上げろ！」</div></div>
      <section class="question-card" aria-live="polite">
        <div class="question-meta-row"><p class="question-label" data-role="question-context">Choose the best answer.</p><button type="button" class="text-button" data-action="report-question">問題を報告</button></div>
        <p class="sentence" data-role="sentence"></p><div class="choices" data-role="choices"></div><div class="explanation" data-role="explanation" hidden></div><button type="button" class="primary-button next-button" data-action="next" hidden>次の問題</button>
      </section>
      <section class="report-panel" data-role="question-report" aria-label="問題報告" hidden></section>
      <div class="trainee-strip"><div class="character-placeholder trainee" data-role="trainee-character" aria-live="polite"></div><p data-role="trainee-status">訓練生スタンバイ</p></div>
    </section>
    <section data-view="result" hidden></section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
