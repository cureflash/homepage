<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14191f">
  <title>Power TOEIC</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">POWER TOEIC</p>
        <h1>集中トレーニング</h1>
      </div>
      <div class="progress-pill" data-role="progress" aria-label="問題進捗">設定</div>
    </header>

    <section data-view="workout-editor" aria-label="ワークアウト編集"></section>

    <section class="quiz-view" data-view="quiz" hidden>
      <div class="character-row">
        <div class="character-placeholder sergeant" data-role="sergeant-character" aria-live="polite"></div>
        <div class="speech" data-role="feedback">軍曹「この一問を仕上げろ！」</div>
      </div>

      <section class="question-card" aria-live="polite">
        <p class="question-label" data-role="question-context">Choose the best answer.</p>
        <p class="sentence" data-role="sentence"></p>
        <div class="choices" data-role="choices"></div>
        <div class="explanation" data-role="explanation" hidden></div>
        <button type="button" class="primary-button next-button" data-action="next" hidden>次の問題</button>
      </section>

      <div class="trainee-strip">
        <div class="character-placeholder trainee" data-role="trainee-character" aria-live="polite"></div>
        <p data-role="trainee-status">synthetic fixtureでUI動作確認中</p>
      </div>
    </section>

    <section data-view="result" hidden></section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
