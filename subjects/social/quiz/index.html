<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="地図や選択肢を使って社会を反復練習するクイズゲームです。">
  <title>社会クイズ｜都道府県当て</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">SOCIAL STUDIES QUIZ</p>
      <h1 id="game-title">都道府県当て</h1>
      <p id="game-description" class="game-description"></p>
    </header>

    <section class="status-bar" aria-label="進行状況">
      <div><span class="status-label">問題</span><strong id="progress">0 / 0</strong></div>
      <div><span class="status-label">正解</span><strong id="score">0</strong></div>
      <div><span class="status-label">正答率</span><strong id="accuracy">0%</strong></div>
    </section>

    <section class="question-panel" aria-labelledby="question-label">
      <p id="question-label" class="question-label">この都道府県はどこ？</p>
      <p id="question-text" class="question-text">読み込み中…</p>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <section class="answer-panel">
      <div id="answer-root" class="answer-root" aria-live="off"></div>
    </section>

    <section id="result-panel" class="result-panel" hidden>
      <h2>結果</h2>
      <p id="result-score" class="result-score"></p>
      <button id="restart-button" class="primary-button" type="button">もう一度</button>
    </section>

    <footer class="game-footer">
      <p>日本地図素材: lalamalink「ディフォルメ都道府県日本地図」(CC0 1.0)</p>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
