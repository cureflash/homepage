<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="地図や選択肢を使って社会を反復練習するクイズゲームです。">
  <title>社会クイズ｜都道府県当て</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">SOCIAL STUDIES QUIZ</p>
      <h1 id="game-title">都道府県当て</h1>
      <p id="game-description" class="game-description"></p>
    </header>

    <section id="world-controls" class="world-controls" aria-label="世界の国当て設定" hidden>
      <label>地域
        <select id="world-region-select"></select>
      </label>
      <label>モード
        <select id="world-mode-select"></select>
      </label>
    </section>

    <section class="status-bar" aria-label="進行状況">
      <div><span class="status-label">問題</span><strong id="progress">0 / 0</strong></div>
      <div><span class="status-label">正解</span><strong id="score">0</strong></div>
      <div><span class="status-label">正答率</span><strong id="accuracy">0%</strong></div>
      <div><span class="status-label">残り時間</span><strong id="time-remaining">180秒</strong></div>
    </section>

    <section id="start-panel" class="start-panel">
      <h2>制限時間クイズ</h2>
      <p>180秒以内に全問へ回答してください。不正解になると残り時間が20秒減ります。</p>
      <button id="start-button" class="primary-button" type="button">ゲーム開始</button>
    </section>

    <section id="question-panel" class="question-panel" aria-labelledby="question-label" hidden>
      <p id="question-label" class="question-label">問題</p>
      <p id="question-text" class="question-text">読み込み中…</p>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <section class="answer-panel" hidden>
      <div id="answer-root" class="answer-root" aria-live="off"></div>
    </section>

    <section id="result-panel" class="result-panel" hidden>
      <h2 id="result-title">結果</h2>
      <p id="result-score" class="result-score"></p>
      <button id="restart-button" class="primary-button" type="button">もう一度</button>
    </section>

    <footer class="game-footer">
      <p id="map-credit">日本地図素材: PA4KEV/japan-vector-map v1.0（MIT License）</p>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"54c05627bfcb4754ae2cf2c56591f809"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
