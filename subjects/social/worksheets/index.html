<meta name="description" content="中学社会プリントの無料学習教材です。ブラウザで利用できる教材・学習ツールを掲載しています。">
  <title>中学社会プリント</title>

<body>
  <header class="toolbar" aria-label="プリント操作">
    <div class="toolbar__group">
      <label>単元
        <select id="unit"></select>
      </label>
      <label>表示
        <select id="mode">
          <option value="study">解説プリント</option>
          <option value="worksheet">穴埋めプリント</option>
          <option value="answer">解答</option>
        </select>
      </label>
      <label>穴埋め率
        <select id="blankRate">
          <option value="0.35">少なめ</option>
          <option value="0.55" selected>標準</option>
          <option value="0.75">多め</option>
        </select>
      </label>
      <label>seed
        <input id="seed" type="number" value="1" min="1" step="1">
      </label>
      <button id="regenerate" type="button">作り直す</button>
      <button id="print" type="button">印刷</button>
    </div>
    <p class="toolbar__note">解説プリントの赤字だけを穴埋め候補にします。</p>
  </header>

  <main id="sheet" class="sheet" aria-live="polite"></main>
