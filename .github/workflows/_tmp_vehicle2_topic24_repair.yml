name: Temporary vehicle2 Topic 24 canonical PPTX repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_vehicle2_topic24_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate canonical PPTX and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          status='denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'
          dir='denken-shinkansen/05_shinkansen_vehicle_2/topics/24_n700s_main_motor_design_comparison'
          p="$dir/24_n700s_main_motor_design_comparison_images.pptx"
          gen='/tmp/topic24_build.js'
          nodeprefix='/tmp/topic24_node'
          wf='.github/workflows/_tmp_vehicle2_topic24_repair.yml'

          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'

          cleanup_only() {
            git rm -f "$wf"
            git commit -m 'Remove obsolete temporary Topic 24 repair workflow'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          }

          if ! grep -Eq 'current_status: `topic_24_powerpoint_blocked_(artifact_identity|canonical_zip_integrity)`' "$status"; then
            cleanup_only
          fi

          git show efd7f365571e59d240576d35fe44deac3b4ae18f:denken-shinkansen/05_shinkansen_vehicle_2/topics/24_n700s_main_motor_design_comparison/_tmp_build_topic24.js > "$gen"
          mkdir -p "$nodeprefix"
          npm install --prefix "$nodeprefix" --no-save pptxgenjs@4.0.0 >/dev/null 2>&1
          NODE_PATH="$nodeprefix/node_modules" TOPIC24_OUT="$p" node "$gen"

          unzip -t "$p" >/dev/null
          python -m pip install -q python-pptx
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/05_shinkansen_vehicle_2/topics/24_n700s_main_motor_design_comparison/24_n700s_main_motor_design_comparison_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==6
          sw, sh = prs.slide_width, prs.slide_height
          texts=[]
          for slide in prs.slides:
              for shape in slide.shapes:
                  assert shape.left >= 0 and shape.top >= 0
                  assert shape.left + shape.width <= sw + 1
                  assert shape.top + shape.height <= sh + 1
                  if hasattr(shape, 'text'):
                      texts.append(shape.text)
          all_text='\n'.join(texts)
          for token in ['N700S','6極','同期速度','すべり','トルク','電気角','小型軽量化','固定品質ゲート']:
              assert token in all_text, token
          print('package/open/geometry/content PASS, slides=6')
          PY

          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils >/dev/null
          fi
          mkdir -p /tmp/topic24_render
          libreoffice --headless --convert-to pdf --outdir /tmp/topic24_render "$p" >/tmp/topic24_lo.txt 2>&1
          pdf='/tmp/topic24_render/24_n700s_main_motor_design_comparison_images.pdf'
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = '6'
          echo "LibreOffice render PASS, pages=$pages"

          git add "$p"
          git rm -f "$wf"
          git commit -m 'Repair Topic 24 PowerPoint canonical artifact'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
