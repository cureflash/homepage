name: Materialize Topic 33 practice PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_topic33_practice_pdf.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode exact practice PDF
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance'
          TMP="$BASE/.tmp_practice_pdf_parts"
          cat "$TMP/part0" "$TMP/part1" "$TMP/part2" | base64 -d > "$BASE/33_hvac_thermal_balance_practice.pdf"
          test "$(stat -c%s "$BASE/33_hvac_thermal_balance_practice.pdf")" = '19106'
          echo '392e31a90e41f15d401214ffbada1d379305247cad1eed96d0421052163d0705  denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance/33_hvac_thermal_balance_practice.pdf' | sha256sum -c -
      - name: Commit canonical PDF and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r "$BASE/.tmp_practice_pdf_parts"
          git rm '.github/workflows/tmp_topic33_practice_pdf.yml'
          git add "$BASE/33_hvac_thermal_balance_practice.pdf"
          git commit -m 'Add Topic 33 practice PDF'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
