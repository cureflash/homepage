name: Build Topic 34 practice PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_topic34_practice_pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest main
        run: git pull --rebase origin main

      - name: Install PDF QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet reportlab pypdfium2 pillow
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Build and validate
        run: python denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics/_tmp_build_practice_pdf.py

      - name: Commit canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics'
          PDF="$BASE/34_compressor_pump_fan_load_characteristics_practice.pdf"
          QA="$BASE/34_compressor_pump_fan_load_characteristics_practice_pdf_qa.md"
          BUILDER="$BASE/_tmp_build_practice_pdf.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git cat-file -e "origin/main:$PDF" 2>/dev/null || git cat-file -e "origin/main:$QA" 2>/dev/null; then
            echo 'Another worker already created Topic 34 practice PDF/QA; refusing duplicate write.'
            exit 23
          fi
          git rm '.github/workflows/tmp_topic34_practice_pdf.yml' "$BUILDER"
          git add "$PDF" "$QA"
          git commit -m 'Add Topic 34 practice PDF and QA'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
