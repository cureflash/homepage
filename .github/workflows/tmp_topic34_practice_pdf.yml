name: Build Topic 34 practice PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_topic34_practice_pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest main and install PDF QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python -m pip install --quiet reportlab pypdfium2 pillow
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Build canonical practice PDF from frozen source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import re, subprocess
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, HRFlowable

          base=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics')
          src=base/'34_compressor_pump_fan_load_characteristics_practice_source.md'
          out=base/'34_compressor_pump_fan_load_characteristics_practice.pdf'
          qa=base/'34_compressor_pump_fan_load_characteristics_practice_pdf_qa.md'
          expected_source_blob='2b2ba22fc66ede164abafb853e13d3e199a8b12e'
          actual_source_blob=subprocess.check_output(['git','hash-object',str(src)], text=True).strip()
          assert actual_source_blob==expected_source_blob, (actual_source_blob, expected_source_blob)
          assert not out.exists(), f'canonical PDF already exists: {out}'
          assert not qa.exists(), f'canonical PDF QA already exists: {qa}'

          text=src.read_text(encoding='utf-8')
          assert len(re.findall(r'^## 一次[1-8]\b', text, re.M))==8
          assert len(re.findall(r'^## 二次[1-4]\b', text, re.M))==4
          assert text.count('### 正答')==8
          assert text.count('### 完全解説')==12
          assert '48.1 N·m / 48.0 N·m' in text
          assert '一般式 `P=Tω`、`ω=2πN/60` は変更しない' in text

          pdfmetrics.registerFont(UnicodeCIDFont('HeiseiMin-W3'))
          pdfmetrics.registerFont(UnicodeCIDFont('HeiseiKakuGo-W5'))
          body=ParagraphStyle('Body', fontName='HeiseiMin-W3', fontSize=8.15, leading=10.5,
                              textColor=colors.black, spaceAfter=1.9*mm, wordWrap='CJK')
          small=ParagraphStyle('Small', parent=body, fontSize=7.1, leading=9.0, spaceAfter=1.0*mm)
          h1=ParagraphStyle('H1', parent=body, fontName='HeiseiKakuGo-W5', fontSize=15.0, leading=18.0,
                            spaceBefore=1.5*mm, spaceAfter=3.2*mm, keepWithNext=True)
          h2=ParagraphStyle('H2', parent=body, fontName='HeiseiKakuGo-W5', fontSize=11.0, leading=14.0,
                            spaceBefore=2.5*mm, spaceAfter=1.8*mm, keepWithNext=True)
          h3=ParagraphStyle('H3', parent=body, fontName='HeiseiKakuGo-W5', fontSize=9.3, leading=12.0,
                            spaceBefore=1.8*mm, spaceAfter=1.0*mm, keepWithNext=True)

          def clean_inline(s):
              return escape(s.replace('`','').replace('**',''), quote=False)

          story=[]
          para=[]
          def flush():
              nonlocal para
              if para:
                  s=' '.join(x.strip() for x in para if x.strip())
                  if s:
                      story.append(Paragraph(clean_inline(s), body))
                  para=[]

          for raw in text.splitlines():
              line=raw.rstrip()
              if not line.strip():
                  flush(); continue
              if line.strip()=='---':
                  flush(); story.append(Spacer(1,1.0*mm)); story.append(HRFlowable(width='100%', thickness=0.3, color=colors.grey)); story.append(Spacer(1,1.0*mm)); continue
              if line.startswith('# '):
                  flush(); story.append(Paragraph(clean_inline(line[2:].strip()), h1)); continue
              if line.startswith('## '):
                  flush(); story.append(Paragraph(clean_inline(line[3:].strip()), h2)); continue
              if line.startswith('### '):
                  flush(); story.append(Paragraph(clean_inline(line[4:].strip()), h3)); continue
              if line.startswith('|'):
                  flush(); story.append(Paragraph(clean_inline(line), small)); continue
              if line.startswith('- '):
                  flush(); story.append(Paragraph('・'+clean_inline(line[2:].strip()), body)); continue
              if re.match(r'^\s*\d+\.\s', line) or re.match(r'^\s*\([1-9]\)\s', line):
                  flush(); story.append(Paragraph(clean_inline(line.strip()), body)); continue
              para.append(line)
          flush()

          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont('HeiseiKakuGo-W5', 6.6)
              canvas.drawString(14*mm, 8*mm, '電験×新幹線 / Topic 34 コンプレッサ・ポンプ・ファンの負荷特性 - 練習問題・完全解説')
              canvas.drawRightString(A4[0]-14*mm, 8*mm, f'{doc.page}')
              canvas.restoreState()

          doc=SimpleDocTemplate(str(out), pagesize=A4,
                                leftMargin=14*mm, rightMargin=14*mm,
                                topMargin=14*mm, bottomMargin=14*mm,
                                title='Topic 34 コンプレッサ・ポンプ・ファンの負荷特性 - 練習問題・完全解説',
                                author='denken-shinkansen', creator='ReportLab', pageCompression=1)
          doc.build(story, onFirstPage=footer, onLaterPages=footer)
          print('generated', out, out.stat().st_size)
          PY

      - name: Render every page and write PDF QA
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics'
          PDF="$BASE/34_compressor_pump_fan_load_characteristics_practice.pdf"
          rm -rf /tmp/topic34_pdfium /tmp/topic34_poppler
          mkdir -p /tmp/topic34_pdfium /tmp/topic34_poppler
          pdftoppm -png -r 180 "$PDF" /tmp/topic34_poppler/page >/dev/null 2>&1
          pdftotext -layout "$PDF" /tmp/topic34_practice.txt
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, re, subprocess
          import pypdfium2 as pdfium

          base=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics')
          pdf=base/'34_compressor_pump_fan_load_characteristics_practice.pdf'
          qa=base/'34_compressor_pump_fan_load_characteristics_practice_pdf_qa.md'
          src=base/'34_compressor_pump_fan_load_characteristics_practice_source.md'
          srcqa=base/'34_compressor_pump_fan_load_characteristics_practice_source_qa.md'
          text=src.read_text(encoding='utf-8')

          doc=pdfium.PdfDocument(str(pdf))
          pdfium_dir=Path('/tmp/topic34_pdfium')
          for i in range(len(doc)):
              page=doc[i]
              bitmap=page.render(scale=180/72)
              bitmap.to_pil().save(pdfium_dir/f'page-{i+1:02d}.png')

          pop=sorted(Path('/tmp/topic34_poppler').glob('page-*.png'))
          pdi=sorted(pdfium_dir.glob('page-*.png'))
          assert len(pop)==len(pdi)==len(doc) and len(doc)>0, (len(pop),len(pdi),len(doc))

          def inspect(paths):
              blank=0; edge=0
              for p in paths:
                  im=Image.open(p).convert('L')
                  mask=im.point(lambda v: 0 if v>=248 else 255)
                  bbox=mask.getbbox()
                  if bbox is None:
                      blank += 1; continue
                  l,t,r,b=bbox
                  if l<8 or t<8 or r>im.width-8 or b>im.height-8:
                      edge += 1
              return blank, edge

          blank_pop, edge_pop=inspect(pop)
          blank_pdfium, edge_pdfium=inspect(pdi)
          assert blank_pop==blank_pdfium==0, (blank_pop, blank_pdfium)
          assert edge_pop==edge_pdfium==0, (edge_pop, edge_pdfium)

          extracted=Path('/tmp/topic34_practice.txt').read_text(encoding='utf-8', errors='replace')
          assert '\ufffd' not in extracted
          for n in range(1,9):
              assert f'一次{n}' in extracted, f'missing 一次{n}'
          for n in range(1,5):
              assert f'二次{n}' in extracted, f'missing 二次{n}'
          assert extracted.count('正答') >= 8, extracted.count('正答')
          assert extracted.count('完全解説') >= 12, extracted.count('完全解説')

          assert len(re.findall(r'^## 一次[1-8]\b', text, re.M))==8
          assert len(re.findall(r'^## 二次[1-4]\b', text, re.M))==4
          assert text.count('### 正答')==8
          assert text.count('### 完全解説')==12
          assert '固定5問・27答案要素' in srcqa.read_text(encoding='utf-8')
          assert 'SPEC固定7項目' in srcqa.read_text(encoding='utf-8')

          sha256=hashlib.sha256(pdf.read_bytes()).hexdigest()
          blob_sha=subprocess.check_output(['git','hash-object',str(pdf)], text=True).strip()
          source_blob=subprocess.check_output(['git','hash-object',str(src)], text=True).strip()
          size=pdf.stat().st_size
          txtsize=Path('/tmp/topic34_practice.txt').stat().st_size

          qa.write_text(f'''# Topic 34 練習PDF QA

更新日: 2026-09-21

判定: `PASS / PRACTICE_PDF_COMPLETE`

## reconcile

最新main、`MASTER_SPEC.md`、`EXAM_ALIGNMENT_SPEC.md`、系列`SPEC.md`、`STATUS.md` / `HANDOFF.md`、Topic 34固定EXAM_ALIGNMENT、解説source/PDF/QA、練習source/source QAをreconcileした。既存workerが完了済みの解説PDF・練習source工程は再実施せず、正本練習source blob `{source_blob}` から練習PDFだけを生成した。

## canonical PDF

- path: `34_compressor_pump_fan_load_characteristics_practice.pdf`
- canonical blob SHA: `{blob_sha}`
- source blob SHA: `{source_blob}`
- file size: `{size} bytes`
- SHA-256: `{sha256}`
- A4縦: `{len(doc)} pages`

## render / text QA

- PDFium render: `{len(pdi)} / {len(doc)} PASS`
- Poppler render: `{len(pop)} / {len(doc)} PASS`
- blank page: `0件`
- page-edge overflow: `0件`
- `pdftotext -layout`: `PASS ({txtsize} bytes)`
- 置換文字 `�`: `0件`
- 一次1〜8: `8 / 8収録 PASS`
- 二次1〜4: `4 / 4収録 PASS`
- 一次正答: `8 / 8収録 PASS`
- 完全解説: `12 / 12収録 PASS`

## 過去問対応品質ゲート

- 固定公式過去問: `5 / 5`
- 固定5問・27答案要素: `27 / 27 connected` を維持
- 一次: `15 / 15 PASS` を維持
- 二次: `12 / 12 PASS` を維持
- SPEC固定7項目: `7 / 7 PASS` を維持
- 一次試験型: `8 / 8`（全問五肢択一）
- 二次試験型: `4 / 4`（途中式・前提・単位・理由を含む）
- source QA済み数値独立再計算: `PASS` を維持
- source QA済み一次正答一意性: `8 / 8 PASS` を維持
- コンプレッサ圧縮熱力学・冷凍サイクル・冷媒物性追加: `0件`
- ポンプ水動力式を固定二種過去問の直接出題式と誤記: `0件`
- ファン相似則を成立条件なしで一般化: `0件`
- 未確認実車値の真値化: `0件`
- Topic 35以降の先取り: `0件`
- Topic 21一般式変更: `0件`
- Topic 21 H26二次問1(4) `48.1 N·m / 48.0 N·m` 過去問固有丸め差注記: `維持`
- exact blocker: `0件`

本判定は練習PDF工程のPASSであり、Topic 34最終完了を意味しない。次工程はTopic 34解説画像PowerPoint生成＋render QA。
''', encoding='utf-8')
          print('pages', len(doc), 'sha256', sha256, 'blob', blob_sha)
          PY

      - name: Commit canonical PDF and QA; remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics'
          PDF="$BASE/34_compressor_pump_fan_load_characteristics_practice.pdf"
          QA="$BASE/34_compressor_pump_fan_load_characteristics_practice_pdf_qa.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git cat-file -e "origin/main:$PDF" 2>/dev/null || git cat-file -e "origin/main:$QA" 2>/dev/null; then
            echo 'Another worker already created Topic 34 practice PDF/QA; refusing duplicate write.'
            exit 23
          fi
          git rm '.github/workflows/tmp_topic34_practice_pdf.yml'
          git add "$PDF" "$QA"
          git commit -m 'Add Topic 34 practice PDF and QA'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
