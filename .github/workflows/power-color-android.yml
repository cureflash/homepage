name: Power Color Android

on:
  push:
    branches:
      - 'codex/power-color-android-20261105'
  pull_request:
    paths:
      - 'qualifications/power-color-android/**'
      - 'qualifications/color-certification/**'
      - 'subjects/english/power-toeic/js/core/session.js'
      - 'subjects/english/power-toeic/js/core/workout-builder.js'
      - 'subjects/english/power-toeic/js/data/question-bank-adapter.js'
      - '.github/workflows/power-color-android.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36'
      - name: Build installable APK and unsigned app bundle
        run: gradle -p qualifications/power-color-android assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: power-color-android-debug
          path: qualifications/power-color-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise all three quiz modes offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle -p qualifications/power-color-android connectedDebugAndroidTest --no-daemon
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-color-android-test-report
          path: qualifications/power-color-android/app/build/reports/androidTests/
          if-no-files-found: ignore
