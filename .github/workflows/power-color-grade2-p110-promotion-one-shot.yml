name: Power Color Grade 2 p110 promotion one-shot

on:
  push:
    branches:
      - power-color-grade2-promote-element-roles-20260902

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[pc2-p110-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-promote-element-roles-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote verified p110 records and extend gates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runtimePath = 'qualifications/color-certification/data/grade2-runtime.json';
          const batchPath = 'qualifications/color-certification/data/grade2-authoring-interior-element-color-roles-0001-0012.json';
          const promotionTestPath = 'qualifications/color-certification/tests/grade2-runtime-promotion.test.js';
          const authoringTestPath = 'qualifications/color-certification/tests/grade2-interior-element-color-roles-authoring.test.js';

          const runtime = JSON.parse(fs.readFileSync(runtimePath, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));

          if (batch.questions.length !== 12 || batch.questions.some((q) => q.validationStatus !== 'verified')) {
            throw new Error('p110 authoring batch is not exactly 12 verified records');
          }
          if (runtime.questions.length !== 216 || runtime.skills.length !== 18) {
            throw new Error(`unexpected runtime frontier ${runtime.questions.length}/${runtime.skills.length}`);
          }
          if (runtime.skills.some((s) => s.id === batch.skill.id) || runtime.questions.some((q) => q.skillId === batch.skill.id)) {
            throw new Error('p110 skill is already present in runtime');
          }

          runtime.skills.push(batch.skill);
          runtime.questions.push(...batch.questions);
          fs.writeFileSync(runtimePath, JSON.stringify(runtime, null, 2) + '\n');

          let promotion = fs.readFileSync(promotionTestPath, 'utf8');
          const anchor = "const interiorZoning = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-zoning-classification-0001-0012.json', import.meta.url), 'utf8'));";
          const added = "const interiorElementColorRoles = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-element-color-roles-0001-0012.json', import.meta.url), 'utf8'));";
          if (!promotion.includes(added)) promotion = promotion.replace(anchor, `${anchor}\n${added}`);
          promotion = promotion.replace('interiorColorPlanning, interiorZoning];', 'interiorColorPlanning, interiorZoning, interiorElementColorRoles];');
          promotion = promotion.replaceAll('216', '228');
          promotion = promotion.replace('totalCount: 54,', 'totalCount: 57,');
          promotion = promotion.replace(').length, 54);', ').length, 57);');
          fs.writeFileSync(promotionTestPath, promotion);

          const authoringTest = `import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import { getAnswerFeedbackModel } from '../js/color-choice-renderer.js';

          const batch = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-element-color-roles-0001-0012.json', import.meta.url), 'utf8'));
          const runtime = JSON.parse(await readFile(new URL('../data/grade2-runtime.json', import.meta.url), 'utf8'));

          function fingerprint(q) { return JSON.stringify([q.sentence, q.choices]); }

          test('Grade 2 Interior p110 element-role batch is independently verified, nonvisual, balanced and runtime-promoted record-identically', () => {
            assert.equal(batch.grade, 2);
            assert.equal(batch.skill.id, 'pc2.interior.element_color_roles');
            assert.equal(batch.questions.length, 12);
            assert.deepEqual(batch.qaSummary, {
              generated: 12, checked: 12, verified: 12, needsRevision: 0, rejected: 0, pending: 0,
              correctIndexDistribution: { A: 3, B: 3, C: 3, D: 3 }
            });
            const positions=[0,0,0,0];
            for (const q of batch.questions) {
              assert.equal(q.validationStatus, 'verified');
              assert.equal(q.qa.generatedAs, 'pending_validation');
              assert.equal(q.questionType, 'text_choice');
              assert.equal(q.taxonomyPath, 'grade2/interior/element_color_roles');
              assert.equal(q.choices.length, 4);
              assert.equal(new Set(q.choices).size, 4);
              assert.equal(q.proposedAnswer, q.choices[q.correctIndex]);
              assert.equal('presentation' in q, false);
              assert.equal('colorRefs' in q, false);
              assert.equal(/#[0-9a-f]{3,8}\\b/i.test(JSON.stringify(q)), false);
              positions[q.correctIndex] += 1;
              const feedback=getAnswerFeedbackModel(q,new Map());
              assert.equal(feedback.kind,'text');
              assert.equal(feedback.showSwatch,false);
            }
            assert.deepEqual(positions,[3,3,3,3]);
            assert.equal(new Set(batch.questions.map(fingerprint)).size,12);
            assert.deepEqual(runtime.skills.find((skill) => skill.id === batch.skill.id), batch.skill);
            assert.deepEqual(runtime.questions.filter((q) => q.skillId === batch.skill.id), batch.questions);
          });
          `;
          fs.writeFileSync(authoringTestPath, authoringTest.replace(/^          /gm, ''));
          NODE
          node --test qualifications/color-certification/tests/grade2-runtime-promotion.test.js qualifications/color-certification/tests/grade2-interior-element-color-roles-authoring.test.js
      - name: Commit generated promotion
        shell: bash
        run: |
          rm .github/workflows/power-color-grade2-p110-promotion-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualifications/color-certification/data/grade2-runtime.json qualifications/color-certification/tests/grade2-runtime-promotion.test.js qualifications/color-certification/tests/grade2-interior-element-color-roles-authoring.test.js .github/workflows/power-color-grade2-p110-promotion-one-shot.yml
          git commit -m 'Promote Grade 2 interior element color roles [pc2-p110-generated]'
          git push origin HEAD:power-color-grade2-promote-element-roles-20260902
