name: Publish Physics Basics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-physics-basic-publish.yml'
      - 'scripts/science_worksheet_helpers.py'
      - 'scripts/science_physics_basic_motion.py'
      - 'scripts/science_physics_basic_forces.py'
      - 'scripts/science_physics_basic_energy.py'
      - 'scripts/science_physics_basic_conservation.py'
      - 'scripts/science_physics_basic_heat.py'
      - 'scripts/science_physics_basic_wave.py'
      - 'scripts/publish_science_physics_basic.py'
      - 'tests/test_science_physics_basic.py'
      - 'tests/test_science_physics_basic_forces.py'
      - 'tests/test_science_physics_basic_energy.py'
      - 'tests/test_science_physics_basic_conservation.py'
      - 'tests/test_science_physics_basic_heat.py'
      - 'tests/test_science_physics_basic_wave.py'

permissions:
  contents: write

concurrency:
  # v2 bypasses the stale pending lock left by the pre-heat publication run.
  # The workflow still checks and publishes latest main, so concurrent recovery
  # attempts cannot safely overwrite a newer main commit.
  group: science-physics-basic-publish-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and Physics Basics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_basic.py
          python tests/test_science_physics_basic_forces.py
          python tests/test_science_physics_basic_energy.py
          python tests/test_science_physics_basic_conservation.py
          python tests/test_science_physics_basic_heat.py
          python tests/test_science_physics_basic_wave.py

      - name: Generate and register Physics Basics batch
        run: python scripts/publish_science_physics_basic.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_basic.py
          python tests/test_science_physics_basic_forces.py
          python tests/test_science_physics_basic_energy.py
          python tests/test_science_physics_basic_conservation.py
          python tests/test_science_physics_basic_heat.py
          python tests/test_science_physics_basic_wave.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog

          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [x for x in catalog if x.get('id', '').startswith('science-physics-basic-motion-')]
          assert len(rows) == 480, len(rows)
          assert all(x['school_level'] == 'high-school' for x in rows)
          assert all(x.get('formal_course') == '物理基礎' for x in rows)
          assert all(x.get('grade') is None for x in rows)
          assert all(x['subject'] == '理科' and x['science_field'] == 'physics' for x in rows)
          assert all(x['worksheet_series'] == 'focused' and x['answer_type'] == 'numeric' for x in rows)
          assert all(x['problem_count'] == 20 for x in rows)
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes['calculation-basic'] == 180, modes
          assert modes['calculation-reverse'] == 300, modes
          skills = Counter(x['skill'] for x in rows)
          assert skills['displacement-average-velocity'] == 20, skills
          assert skills['acceleration-velocity-change'] == 20, skills
          assert skills['initial-final-velocity'] == 20, skills
          assert skills['uniform-acceleration-velocity'] == 30, skills
          assert skills['free-fall-velocity'] == 20, skills
          assert skills['one-dimensional-net-force'] == 30, skills
          assert skills['newton-second-law'] == 30, skills
          assert skills['opposed-force-balance'] == 20, skills
          assert skills['kinetic-friction'] == 30, skills
          assert skills['work-parallel-force-displacement'] == 30, skills
          assert skills['work-rate'] == 20, skills
          assert skills['gravitational-potential-energy'] == 30, skills
          assert skills['kinetic-energy'] == 30, skills
          assert skills['elastic-potential-energy'] == 30, skills
          assert skills['mechanical-energy-conservation'] == 30, skills
          assert skills['specific-heat-quantity'] == 40, skills
          assert skills['heat-capacity'] == 20, skills
          assert skills['wave-speed-frequency-wavelength'] == 30, skills
          units = Counter(x['unit'] for x in rows)
          assert units['物体の運動とエネルギー：運動の表し方'] == 90, units
          assert units['物体の運動とエネルギー：様々な力とその働き'] == 130, units
          assert units['物体の運動とエネルギー：力学的エネルギー'] == 170, units
          assert units['様々な物理現象とエネルギーの利用：熱'] == 60, units
          assert units['様々な物理現象とエネルギーの利用：波'] == 30, units
          assert len({x['content_hash'] for x in rows}) == 480
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('Physics Basics 480-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/high-school/physics-basic/motion/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; Physics Basics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish 30 Physics Basics wave worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
