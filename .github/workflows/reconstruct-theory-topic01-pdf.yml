name: Reconstruct theory II topic 01 PDF

on:
  push:
    branches: [main]
    paths:
      - '.tmp_pdf_chunks/**'
      - '.github/workflows/reconstruct-theory-topic01-pdf.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and publish exact PDF
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          target='denken-shinkansen/08_shinkansen_theory_2/topics/01_catenary_equivalent_circuit/01_catenary_equivalent_circuit_explanation.pdf'
          test -d .tmp_pdf_chunks/theory2_topic01
          cat .tmp_pdf_chunks/theory2_topic01/* | base64 -d > "$target"
          test "$(git hash-object "$target")" = 'f742c808249bd2b1aea2720388cf9f571ea5d4ef'
          git config user.name 'pdf-reconstruct-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git rm -r .tmp_pdf_chunks/theory2_topic01 .github/workflows/reconstruct-theory-topic01-pdf.yml
          git add "$target"
          git commit -m 'Publish exact theory II Topic 01 explanation PDF'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
