name: Build Topic 35 PowerPoint Additional A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_topic35_pptx_additional_a.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest main and preflight
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          if test -e "$base/35_atc_track_circuit_analysis_images.pptx" || test -e "$base/35_atc_track_circuit_analysis_images_qa.md"; then
            echo 'TOPIC35_SKIP=1' >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          status=Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md').read_text()
          handoff=Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md').read_text()
          assert 'current_status: `topic_35_practice_pdf_complete`' in status
          assert '判定: `PASS / PRACTICE_PDF_COMPLETE`' in status
          assert '現在地は `topic_35_practice_pdf_complete`' in handoff
          assert '判定: `PASS / PRACTICE_PDF_COMPLETE`' in handoff
          required=[
            'denken-shinkansen/MASTER_SPEC.md',
            'denken-shinkansen/EXAM_ALIGNMENT_SPEC.md',
            'denken-shinkansen/05_shinkansen_vehicle_2/SPEC.md',
            'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis.md',
            'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis_explanation_source.md',
            'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis_explanation.pdf',
            'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis_practice_source.md',
            'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis_practice.pdf']
          for p in required: assert Path(p).exists(), p
          print('preflight PASS')
          PY

      - name: Install slide and render dependencies
        if: env.TOPIC35_SKIP != '1'
        run: |
          set -euo pipefail
          python -m pip install --quiet python-pptx pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk

      - name: Generate PowerPoint
        if: env.TOPIC35_SKIP != '1'
        run: python .github/scripts/tmp_topic35_pptx_additional_a.py

      - name: Validate PowerPoint and render
        if: env.TOPIC35_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          pptx="$base/35_atc_track_circuit_analysis_images.pptx"
          rm -rf /tmp/topic35 && mkdir -p /tmp/topic35/render
          python - <<'PY'
          from pptx import Presentation
          from pathlib import Path
          p=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis_images.pptx')
          prs=Presentation(p)
          assert len(prs.slides)==6
          assert abs(prs.slide_width/914400-13.333333)<0.01
          assert abs(prs.slide_height/914400-7.5)<0.01
          for si,s in enumerate(prs.slides,1):
              for sh in s.shapes:
                  assert sh.left >= 0 and sh.top >= 0, (si, sh.name)
                  assert sh.left + sh.width <= prs.slide_width + 2, (si, sh.name, 'right')
                  assert sh.top + sh.height <= prs.slide_height + 2, (si, sh.name, 'bottom')
          text='\n'.join(sh.text for s in prs.slides for sh in s.shapes if hasattr(sh,'text_frame'))
          tokens=['軌道回路','レール等価インピーダンス','車軸短絡','受信レベル','信号電流','回路条件','フェイルセーフ','R8一次 理論 問3','R7一次 理論 問3','R7一次 理論 問4','R6一次 理論 問6','R5一次 理論 問4','Zr = Rr + jXr','Zp = ZR·Zs / (ZR + Zs)','Topic 21']
          for token in tokens: assert token in text, token
          assert sum('Sources:' in s.notes_slide.notes_text_frame.text and 'http' in s.notes_slide.notes_text_frame.text for s in prs.slides)==6
          print('geometry/content/notes 6/6 PASS')
          PY
          libreoffice --headless --convert-to pdf --outdir /tmp/topic35 "$pptx" >/tmp/topic35/lo.txt 2>&1
          cat /tmp/topic35/lo.txt
          pdf='/tmp/topic35/35_atc_track_circuit_analysis_images.pdf'
          test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = '6'
          pdftotext -layout "$pdf" /tmp/topic35/extracted.txt
          test "$(grep -o '�' /tmp/topic35/extracted.txt | wc -l)" = '0'
          for token in '車軸短絡' '25 / 25 connected' '48.1/48.0' 'テブナン等価' 'ブリッジ平衡'; do grep -F "$token" /tmp/topic35/extracted.txt >/dev/null; done
          pdftoppm -png -r 120 "$pdf" /tmp/topic35/render/slide >/dev/null 2>&1
          test "$(find /tmp/topic35/render -name 'slide-*.png' | wc -l)" = '6'
          python - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          imgs=sorted(Path('/tmp/topic35/render').glob('slide-*.png'))
          assert len(imgs)==6
          for p in imgs:
              mean=ImageStat.Stat(Image.open(p).convert('L')).mean[0]
              assert mean < 253.5, (p, mean)
          print('render 6/6 PASS')
          PY

      - name: Write QA
        if: env.TOPIC35_SKIP != '1'
        run: python .github/scripts/tmp_topic35_finalize_additional_a.py qa

      - name: Commit PowerPoint and QA
        if: env.TOPIC35_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cureflash'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          rm -f .github/workflows/tmp_topic35_pptx_additional_a.yml .github/scripts/tmp_topic35_pptx_additional_a.py
          git add -A
          git commit -m 'Add Topic 35 PowerPoint and QA'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PPTX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Advance Topic 35 progress records
        if: env.TOPIC35_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python .github/scripts/tmp_topic35_finalize_additional_a.py progress "$PPTX_COMMIT"
          git rm .github/scripts/tmp_topic35_finalize_additional_a.py
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git commit -m 'Advance Topic 35 to PowerPoint complete'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup duplicate staging
        if: env.TOPIC35_SKIP == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cureflash'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          rm -f .github/workflows/tmp_topic35_pptx_additional_a.yml .github/scripts/tmp_topic35_pptx_additional_a.py .github/scripts/tmp_topic35_finalize_additional_a.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Cleanup duplicate Topic 35 PowerPoint staging'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
