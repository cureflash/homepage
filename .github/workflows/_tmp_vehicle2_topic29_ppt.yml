name: tmp-vehicle2-topic29-ppt

on:
  push:

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Stage Topic 29 PowerPoint workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate canonical Topic 29 PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          dir='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force'
          gen="$dir/_tmp_build_topic29.js"
          p="$dir/29_l0_superconducting_magnetic_levitation_force_images.pptx"
          metrics="$dir/_tmp_topic29_ppt_metrics.txt"

          test -f "$gen"
          grep -q 'current_status: `topic_29_practice_pdf_complete`' 'denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'

          mkdir -p /tmp/topic29_node
          npm install --prefix /tmp/topic29_node --no-save pptxgenjs@4.0.0 >/dev/null 2>&1
          NODE_PATH=/tmp/topic29_node/node_modules TOPIC29_OUT="$p" node "$gen"

          unzip -t "$p" >/dev/null
          python -m pip install -q python-pptx
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==6
          assert abs(prs.slide_width/prs.slide_height - 16/9) < 1e-5
          sw,sh=prs.slide_width,prs.slide_height
          texts=[]
          for i,slide in enumerate(prs.slides,1):
              for shape in slide.shapes:
                  assert shape.left >= 0 and shape.top >= 0, (i,shape.name)
                  assert shape.left + shape.width <= sw + 2, (i,shape.name)
                  assert shape.top + shape.height <= sh + 2, (i,shape.name)
                  if hasattr(shape,'text'): texts.append(shape.text)
          all_text='\n'.join(texts)
          required=['Topic 29','e = −dΨ/dt','Irms(v)','Fmodel(v)','R8 一次','R7 一次','R4 一次','R2 一次','H23 二次','24 / 24','ファラデーの法則','相互誘導','誘導電流','磁気エネルギー','電磁力','超電導磁石','浮上力','案内力','磁束変化―誘導起電力','速度―誘導電流','速度―電磁力','48.1 / 48.0 N·m','Topic 30']
          for token in required:
              assert token in all_text, token
          assert '\ufffd' not in all_text
          print('package/open/geometry/content PASS, slides=6')
          PY

          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          fi
          rm -rf /tmp/topic29_render && mkdir -p /tmp/topic29_render
          libreoffice --headless --convert-to pdf --outdir /tmp/topic29_render "$p" >/tmp/topic29_lo.txt 2>&1
          pdf='/tmp/topic29_render/29_l0_superconducting_magnetic_levitation_force_images.pdf'
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = '6'
          pdftotext -layout "$pdf" /tmp/topic29.txt
          for token in 'Topic 29' '26.7 V' '2.74 A' '110 N' '24 / 24' 'H23' '48.1 / 48.0 N·m'; do grep -q "$token" /tmp/topic29.txt; done
          ! grep -q $'\xef\xbf\xbd' /tmp/topic29.txt

          python - <<'PY'
          import math
          Ehat=0.12*2*math.pi*50
          Erms=Ehat/math.sqrt(2)
          assert abs(Ehat-37.6991118431)<1e-9
          assert abs(Erms-26.65729762895)<1e-9
          def I(v): return (4*0.08*v/math.sqrt(2))/math.sqrt(0.6**2+(4*0.02*v)**2)
          vals={10:I(10),30:I(30),60:I(60)}
          assert abs(vals[10]-2.2627417)<1e-5
          assert abs(vals[30]-2.744432)<1e-5
          assert abs(vals[60]-2.806379)<1e-5
          assert abs(40*vals[30]-109.7773)<0.01
          print('numeric QA PASS')
          PY

          size=$(stat -c '%s' "$p")
          hash=$(sha256sum "$p" | awk '{print $1}')
          textbytes=$(stat -c '%s' /tmp/topic29.txt)
          printf 'size=%s\nsha256=%s\nslides=6\nrender_pages=6\npdftotext=PASS\ntext_bytes=%s\nnumeric_qa=PASS\n' "$size" "$hash" "$textbytes" > "$metrics"

          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add "$p" "$metrics"
          git commit -m 'Rebuild Topic 29 PowerPoint canonical artifact'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
