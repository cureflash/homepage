name: Temporary Machine2 Topic19 Practice PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-machine2-topic19-practice-pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ipafont-gothic poppler-utils
          python -m pip install --quiet reportlab

      - name: Generate A4 practice PDF from canonical source
        shell: bash
        run: |
          set -euo pipefail
          src='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.md'
          target='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.pdf'
          echo "SOURCE_BLOB=$(git hash-object "$src")" >> "$GITHUB_ENV"
          font_path=$(fc-match -f '%{file}\n' 'IPAGothic' | head -n 1)
          test -n "$font_path"
          export FONT_PATH="$font_path" SRC="$src" TARGET="$target"
          python - <<'PY'
          import os, re, html
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, HRFlowable

          src = os.environ['SRC']
          target = os.environ['TARGET']
          font_path = os.environ['FONT_PATH']
          pdfmetrics.registerFont(TTFont('IPA', font_path))

          doc = SimpleDocTemplate(
              target,
              pagesize=A4,
              rightMargin=14*mm,
              leftMargin=14*mm,
              topMargin=13*mm,
              bottomMargin=13*mm,
              title='Topic 19 練習問題 — PIDで新幹線の速度を制御する',
              author='cureflash/homepage',
          )
          styles = getSampleStyleSheet()
          base = dict(fontName='IPA', textColor='#111111', allowWidows=0, allowOrphans=0)
          title = ParagraphStyle('TitleIPA', parent=styles['Title'], fontSize=16, leading=22, spaceAfter=8, alignment=TA_CENTER, **base)
          h1 = ParagraphStyle('H1IPA', parent=styles['Heading1'], fontSize=14, leading=19, spaceBefore=7, spaceAfter=5, **base)
          h2 = ParagraphStyle('H2IPA', parent=styles['Heading2'], fontSize=12.5, leading=17, spaceBefore=7, spaceAfter=4, **base)
          h3 = ParagraphStyle('H3IPA', parent=styles['Heading3'], fontSize=10.8, leading=15, spaceBefore=5, spaceAfter=3, **base)
          body = ParagraphStyle('BodyIPA', parent=styles['BodyText'], fontSize=9.3, leading=13.4, spaceAfter=2.3, **base)
          bullet = ParagraphStyle('BulletIPA', parent=body, leftIndent=10, firstLineIndent=-7, bulletIndent=2)
          option = ParagraphStyle('OptionIPA', parent=body, leftIndent=9)
          code = ParagraphStyle('CodeIPA', parent=body, leftIndent=8, rightIndent=6, backColor='#f6f6f6', borderPadding=3, spaceBefore=1.5, spaceAfter=3)

          def clean_inline(s):
              s = html.escape(s, quote=False)
              s = re.sub(r'`([^`]*)`', r'\1', s)
              s = s.replace('  ', ' ')
              return s

          story = []
          first_title = True
          with open(src, 'r', encoding='utf-8') as f:
              lines = f.read().splitlines()
          for raw in lines:
              line = raw.strip()
              if not line:
                  story.append(Spacer(1, 2.5*mm))
                  continue
              if line == '---':
                  story.append(Spacer(1, 1.5*mm))
                  story.append(HRFlowable(width='100%', thickness=0.4, color='#bbbbbb', spaceBefore=1, spaceAfter=3))
                  continue
              if line.startswith('# '):
                  sty = title if first_title else h1
                  first_title = False
                  story.append(Paragraph(clean_inline(line[2:]), sty))
                  continue
              if line.startswith('## '):
                  story.append(Paragraph(clean_inline(line[3:]), h2))
                  continue
              if line.startswith('### '):
                  story.append(Paragraph(clean_inline(line[4:]), h3))
                  continue
              if line.startswith('- '):
                  story.append(Paragraph('• ' + clean_inline(line[2:]), bullet))
                  continue
              if re.match(r'^\d+\.\s', line):
                  story.append(Paragraph(clean_inline(line), option))
                  continue
              if line.startswith('`') and line.endswith('`'):
                  story.append(Paragraph(clean_inline(line), code))
                  continue
              story.append(Paragraph(clean_inline(line), body))

          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont('IPA', 7.5)
              canvas.drawCentredString(A4[0]/2, 7*mm, f'{doc.page}')
              canvas.restoreState()

          doc.build(story, onFirstPage=footer, onLaterPages=footer)
          PY

      - name: Structural and extraction checks
        shell: bash
        run: |
          set -euo pipefail
          src='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.md'
          target='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.pdf'
          test "$(grep -c '^## 問' "$src")" -eq 15
          pdfinfo "$target" | tee /tmp/pdfinfo.txt
          grep -Eq 'Page size:[[:space:]]+595(\.276)? x 841(\.89)? pts \(A4\)' /tmp/pdfinfo.txt
          pdftotext -layout "$target" /tmp/practice.txt
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/practice.txt').read_text(encoding='utf-8')
          for key in ['問1', '問10', '問11', '問15', 'PID', 'Kp', 'Ki', 'Kd']:
              assert key in text, key
          assert '\ufffd' not in text
          assert '(cid:' not in text
          PY
          echo "PDF_SHA256=$(sha256sum "$target" | awk '{print $1}')"
          echo "PDF_SIZE=$(wc -c < "$target")"
          echo "PDF_BLOB=$(git hash-object "$target")"

      - name: Commit PDF if canonical source is unchanged
        shell: bash
        run: |
          set -euo pipefail
          src='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.md'
          target='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.pdf'
          cp "$target" /tmp/topic19-practice.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            test "$(git hash-object "$src")" = "$SOURCE_BLOB"
            cp /tmp/topic19-practice.pdf "$target"
            git add "$target"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'denken machine2: add Topic 19 practice PDF'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
