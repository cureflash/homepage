name: Grade 4 worksheet factory checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_grade4_large_integer_add_sub.py'
      - 'scripts/publish_grade4_division.py'
      - 'scripts/publish_grade4_decimals.py'
      - 'scripts/publish_grade4_decimal_multiplication.py'
      - 'scripts/publish_grade4_decimal_division.py'
      - 'scripts/publish_grade4_same_denominator_fractions.py'
      - 'scripts/publish_grade4_fraction_conversions.py'
      - 'scripts/publish_grade4_order_of_operations.py'
      - 'scripts/publish_grade4_mixed_operations.py'
      - 'tests/test_grade4_*_publisher.py'
      - '.github/workflows/grade4-core-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Reconcile latest main and validate grade 4 batch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            python scripts/publish_grade4_large_integer_add_sub.py .
            python scripts/publish_grade4_division.py .
            python scripts/publish_grade4_decimals.py .
            python scripts/publish_grade4_decimal_multiplication.py .
            python scripts/publish_grade4_decimal_division.py .
            python scripts/publish_grade4_same_denominator_fractions.py .
            python scripts/publish_grade4_fraction_conversions.py .
            python scripts/publish_grade4_order_of_operations.py .
            python scripts/publish_grade4_mixed_operations.py .
            python tests/test_grade4_large_integer_add_sub_publisher.py
            python tests/test_grade4_division_publisher.py
            python tests/test_grade4_decimals_publisher.py
            python tests/test_grade4_decimal_multiplication_publisher.py
            python tests/test_grade4_decimal_division_publisher.py
            python tests/test_grade4_same_denominator_fractions_publisher.py
            python tests/test_grade4_fraction_conversions_publisher.py
            python tests/test_grade4_order_of_operations_publisher.py
            python tests/test_grade4_mixed_operations_publisher.py
            python tests/test_worksheet_factory.py
            before=$(git rev-parse origin/main); git fetch origin main; after=$(git rev-parse origin/main)
            [ "$before" = "$after" ] && break
            [ "$attempt" = 3 ] && { echo 'main kept moving; aborting rather than validating stale state' >&2; exit 1; }
          done
      - name: Commit validated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worksheet-factory-bot'; git config user.email '89366952+cureflash@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/elementary/grade-04/
          if git diff --cached --quiet; then echo 'No grade-4 checkpoint changes to publish.'; exit 0; fi
          git commit -m 'Publish grade 4 worksheet checkpoint'; git push origin HEAD:main
