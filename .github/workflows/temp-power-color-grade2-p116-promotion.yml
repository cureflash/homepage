name: Temporary Power Color Grade 2 p116 promotion

on:
  push:
    branches:
      - power-color-grade2-landscape-p116-promotion-20260902

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-landscape-p116-promotion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified p116 records record-identically
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runtimePath = 'qualifications/color-certification/data/grade2-runtime.json';
          const batchPath = 'qualifications/color-certification/data/grade2-authoring-landscape-public-nature-0001-0012.json';
          const promotionTestPath = 'qualifications/color-certification/tests/grade2-runtime-promotion.test.js';
          const landscapeTestPath = 'qualifications/color-certification/tests/grade2-landscape-public-nature-authoring.test.js';
          const workflowPath = '.github/workflows/temp-power-color-grade2-p116-promotion.yml';

          const runtime = JSON.parse(fs.readFileSync(runtimePath, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
          if (batch.questions.length !== 12) throw new Error('expected 12 p116 questions');
          if (!batch.questions.every((q) => q.validationStatus === 'verified')) throw new Error('all p116 questions must be verified');
          if (runtime.questions.length !== 240 || runtime.skills.length !== 20) throw new Error(`unexpected runtime frontier ${runtime.questions.length}/${runtime.skills.length}`);
          if (runtime.skills.some((s) => s.id === batch.skill.id)) throw new Error('p116 skill already promoted');
          const fp = (q) => JSON.stringify([q.sentence, q.choices]);
          const ids = new Set(runtime.questions.map((q) => q.id));
          const fps = new Set(runtime.questions.map(fp));
          for (const q of batch.questions) {
            if (ids.has(q.id)) throw new Error(`duplicate id ${q.id}`);
            if (fps.has(fp(q))) throw new Error(`duplicate fingerprint ${q.id}`);
          }
          runtime.skills.push(batch.skill);
          runtime.questions.push(...batch.questions);
          if (runtime.questions.length !== 252 || runtime.skills.length !== 21) throw new Error('promotion count mismatch');
          fs.writeFileSync(runtimePath, JSON.stringify(runtime, null, 2) + '\n');

          let promotion = fs.readFileSync(promotionTestPath, 'utf8');
          promotion = promotion.replace(
            "const interiorStyleNames = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-style-name-inventory-0001-0012.json', import.meta.url), 'utf8'));\n",
            "const interiorStyleNames = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-style-name-inventory-0001-0012.json', import.meta.url), 'utf8'));\nconst landscapePublicNature = JSON.parse(await readFile(new URL('../data/grade2-authoring-landscape-public-nature-0001-0012.json', import.meta.url), 'utf8'));\n"
          );
          promotion = promotion.replace(', interiorStyleNames];', ', interiorStyleNames, landscapePublicNature];');
          promotion = promotion.replaceAll('240', '252').replaceAll('60', '63');
          if (!promotion.includes('landscapePublicNature') || !promotion.includes('runtime.questions.length, 252') || !promotion.includes('totalCount: 63')) throw new Error('promotion test rewrite failed');
          fs.writeFileSync(promotionTestPath, promotion);

          let landscape = fs.readFileSync(landscapeTestPath, 'utf8');
          landscape = landscape.replace('independently verified, nonvisual, balanced and not yet runtime-promoted', 'independently verified, nonvisual, balanced and runtime-promoted record-identically');
          const oldTail = `  const runtimeFingerprints = new Set(runtime.questions.map(fingerprint));\n  assert.equal(batchFingerprints.some((fp) => runtimeFingerprints.has(fp)), false);\n  assert.equal(runtime.questions.some((q) => q.skillId === batch.skill.id), false);`;
          const newTail = `  const runtimeQuestions = runtime.questions.filter((q) => q.skillId === batch.skill.id);\n  assert.deepEqual(runtimeQuestions, batch.questions);\n  assert.deepEqual(runtime.skills.find((skill) => skill.id === batch.skill.id), batch.skill);`;
          if (!landscape.includes(oldTail)) throw new Error('landscape test old promotion boundary not found');
          landscape = landscape.replace(oldTail, newTail);
          fs.writeFileSync(landscapeTestPath, landscape);
          fs.unlinkSync(workflowPath);
          NODE
      - name: Run Power Color gates
        run: node --test qualifications/color-certification/tests/*.test.js
      - name: Commit generated promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Promote Grade 2 landscape public nature to runtime"
          git push origin HEAD:power-color-grade2-landscape-p116-promotion-20260902
