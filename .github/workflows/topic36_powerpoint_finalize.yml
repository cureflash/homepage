name: Topic36 PowerPoint Finalize
on:
  push:
    paths:
      - '.github/workflows/topic36_powerpoint_finalize.yml'
permissions:
  contents: write
concurrency:
  group: vehicle2-topic36-powerpoint
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: |
          python -m pip install --quiet python-pptx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
      - name: Rebuild canonical PPTX
        run: |
          python - <<'PYBUILD'
          import base64,zlib,pathlib
          data=pathlib.Path('.github/topic36_builder.zb64').read_text().strip()
          src=zlib.decompress(base64.b64decode(data)).decode('utf-8')
          out="denken-shinkansen/05_shinkansen_vehicle_2/topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx"
          src=src.replace("OUT=Path('/mnt/data/topic36qa/36_atc_signal_transmission_frequency_images.pptx')", f"OUT=Path('{out}')")
          pathlib.Path('/tmp/build_topic36_pptx.py').write_text(src,encoding='utf-8')
          PYBUILD
          python /tmp/build_topic36_pptx.py
      - name: Canonical PPTX QA
        run: |
          mkdir -p /tmp/topic36_lo /tmp/topic36_png
          python - <<'PYQA'
          from pptx import Presentation
          from pathlib import Path
          p=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx')
          prs=Presentation(p)
          assert len(prs.slides)==6
          assert 1.76 < prs.slide_width/prs.slide_height < 1.79
          all_text=[]
          for s in prs.slides:
              assert len(s.shapes)>0
              for sh in s.shapes:
                  assert sh.left>=0 and sh.top>=0 and sh.left+sh.width<=prs.slide_width and sh.top+sh.height<=prs.slide_height
                  if hasattr(sh,'text'): all_text.append(sh.text)
              assert s.notes_slide.notes_text_frame.text.strip()
          text='\n'.join(all_text)
          required=['ATC② 信号伝送と周波数','R8 一次 理論 問5','R3 一次 機械 問8','H26 一次 機械 問8','H25 一次 機械 問8','H22 一次 機械 問8','25/25 connected','SPEC固定8項目','48.1 N·m / 48.0 N·m','P=Tω','ω=2πN/60']
          for x in required: assert x in text, x
          PYQA
          libreoffice --headless --convert-to pdf --outdir /tmp/topic36_lo denken-shinkansen/05_shinkansen_vehicle_2/topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx >/tmp/lo.txt 2>&1
          test "$(pdfinfo /tmp/topic36_lo/36_atc_signal_transmission_frequency_images.pdf | awk '/^Pages:/ {print $2}')" = "6"
          pdftotext -layout /tmp/topic36_lo/36_atc_signal_transmission_frequency_images.pdf /tmp/topic36.txt
          test -s /tmp/topic36.txt
          ! grep -q $'\uFFFD' /tmp/topic36.txt
          pdftoppm -png -r 120 /tmp/topic36_lo/36_atc_signal_transmission_frequency_images.pdf /tmp/topic36_png/slide >/dev/null 2>&1
          test "$(find /tmp/topic36_png -name 'slide-*.png' | wc -l)" = "6"
      - name: Write QA and progress records
        run: |
          python - <<'PYWRITE'
          from pathlib import Path
          import hashlib,re
          root=Path('denken-shinkansen/05_shinkansen_vehicle_2')
          topic=root/'topics/36_atc_signal_transmission_frequency'
          pptx=topic/'36_atc_signal_transmission_frequency_images.pptx'
          sha=hashlib.sha256(pptx.read_bytes()).hexdigest(); size=pptx.stat().st_size
          qa=f'''# Topic 36 PowerPoint QA — ATC② 信号伝送と周波数

更新日: 2026-09-21

判定: `PASS / POWERPOINT_COMPLETE`

## reconcile

最新main、`MASTER_SPEC.md`、`EXAM_ALIGNMENT_SPEC.md`、系列`SPEC.md`、`STATUS.md` / `HANDOFF.md`、Topic 36固定EXAM_ALIGNMENT、解説source/PDF、練習source/PDFと各QAをreconcileし、未完了だった解説画像PowerPointのみを作成した。固定EXAM_ALIGNMENT、固定5問・25答案要素、既存source/PDFは変更していない。

## canonical artifact

- path: `36_atc_signal_transmission_frequency_images.pptx`
- file size: `{size} bytes`
- SHA-256: `{sha}`
- 16:9 / `6 slides`
- python-pptx open / geometry bounds: `6 / 6 PASS`
- PPTX text/content assertions: `PASS`
- source notes: `6 / 6 slides`
- LibreOffice PDF変換: `6 / 6 pages PASS`
- Poppler `pdftotext -layout`: `PASS`
- 置換文字 U+FFFD: `0件`
- Poppler PNG render: `6 / 6 PASS`
- 同一builderの事前visual inspection: `6 / 6 PASS`

## slide構成

1. 原信号→変調→伝送路→復調→判定、SPEC固定8項目、実車固有値の境界
2. `ω=2πf`、RLC直列共振、Q、`V_L=QV`、R8一次「理論」問5
3. AM/FM/PM・ASK/FSK/PSK/QAM、標本化・量子化・サンプルホールド、R3/H25一次
4. S/N、dB、教材用しきい値モデル、ノイズによる判定余裕
5. リピータとOSI層、MAC/IP、ストライピング・ミラーリング・パリティ・RAID5の一般原理
6. 固定5問25答案要素のPowerPointマッピング、二次0問、Topic 21固有丸め差注記

## 固定過去問接続

- R8一次「理論」問5: `5 / 5` → slide 2
- R3一次「機械」問8: `5 / 5` → slide 3
- H26一次「機械」問8: `5 / 5` → slide 5
- H25一次「機械」問8: `5 / 5` → slides 1 / 3
- H22一次「機械」問8: `5 / 5` → slides 5 / 6
- 一次: `25 / 25 connected`
- 二次: `0問`（公式科目範囲外、件数合わせなし）

## SPEC gate

- 周波数: `PASS` — slides 1 / 2 / 3
- 信号伝送: `PASS` — slides 1 / 3 / 5
- 変調: `PASS` — slides 1 / 3
- フィルタ: `PASS` — slides 2 / 3
- ノイズ: `PASS` — slide 4
- S/N: `PASS` — slide 4
- デジタル判定: `PASS` — slides 3 / 4
- 冗長化: `PASS` — slides 1 / 5 / 6
- SPEC固定8項目: `8 / 8 PASS`

## 数値・内容QA

- RLC例: `R=20 Ω`, `L=0.20 H`, `C=50 μF` → `ω0=316.2 rad/s`, `f0=50.3 Hz`, `Q=3.16`: `PASS`
- 標本化例: `fmax=3 kHz` → `fs>6 kHz`, 8 bit → `256 levels`: `PASS`
- S/N例: `V_S=1.0 V`, `V_N=0.10 V` → `20 dB`; `V_N=0.20 V` → `14.0 dB`; 約`6 dB`低下: `PASS`
- 教材用判定例: `Vth=2.5 V`, `2.3 V→0`, `+0.3 V`重畳で`2.6 V→1`: `PASS`
- リピータ=物理層、MAC=データリンク層、IP=ネットワーク層: `PASS`
- RAIDは冗長化一般原理として扱い、ATC実装と断定しない: `PASS`
- Topic 21一般式 `P=Tω`, `ω=2πN/60`: 変更なし
- H26二次問1(4) `48.1 N·m / 48.0 N·m`: `π=3.14`相当の過去問固有丸め差として注記維持

## 境界確認

- 固定EXAM_ALIGNMENT変更: `0件`
- 二次問題の件数合わせ採用: `0件`
- 未確認ATC使用周波数・変調方式・受信しきい値・S/N要求値・冗長構成の真値化: `0件`
- H22 RAIDをATC実装そのものと断定: `0件`
- Topic 37・38先取り: `0件`
- Topic 21一般式変更: `0件`
- exact blocker: `0件`

PowerPoint工程は完了。次工程はanswer-bearing資料を先に開かないfresh workerによるclean blind candidate固定。本runは固定EXAM_ALIGNMENT・解説・練習のanswer-bearing資料を確認済みのため、clean blind candidateは作成しない。
'''
          (topic/'36_atc_signal_transmission_frequency_images_qa.md').write_text(qa,encoding='utf-8')
          status_path=root/'STATUS.md'; status=status_path.read_text(encoding='utf-8')
          status=status.replace('- current_status: `topic_36_practice_pdf_complete`','- current_status: `topic_36_powerpoint_complete`',1)
          status=re.sub(r'^- next_start:.*$', '- next_start: 最新main、上位仕様、系列SPEC、`STATUS.md` / `HANDOFF.md`、Topic 36全成果物をreconcileし、answer-bearing資料を先に開かないfresh workerでclean blind candidateを固定して独立再解答する。固定5問・25答案要素、SPEC固定8項目、二次0問の適用判定、鉄道一次資料の境界を維持し、candidate固定後修正をしない。', status, count=1, flags=re.M)
          status=status.replace('判定: `IN PROGRESS / PRACTICE_PDF_COMPLETE`','判定: `IN PROGRESS / POWERPOINT_COMPLETE`',1)
          marker='### 解説画像PowerPoint\n\n- PowerPoint: `topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx`'
          if marker not in status:
              status += f'''\n\n### 解説画像PowerPoint\n\n- PowerPoint: `topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx`\n- QA: `topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images_qa.md`\n- SHA-256: `{sha}`\n- 16:9: `6枚`\n- python-pptx geometry: `6 / 6 PASS`\n- LibreOffice PDF / Poppler PNG render: `6 / 6 PASS`\n- 固定5問・25答案要素: `25 / 25 connected`\n- SPEC固定8項目: `8 / 8 PASS`\n- 二次試験型: `0問`（公式科目範囲外）\n- Topic 21一般式変更: `0件`\n- exact blocker: `0件`\n\nPowerPoint工程まで完了。完成数は `35 / 39` のまま。次工程はfresh clean blind独立再解答。\n'''
          status_path.write_text(status,encoding='utf-8')
          hand_path=root/'HANDOFF.md'; hand=hand_path.read_text(encoding='utf-8')
          hand=re.sub(r'^現在地は `topic_36_practice_pdf_complete`.*$', '現在地は `topic_36_powerpoint_complete`。active topicは `36 ATC② 信号伝送と周波数`。制作前EXAM_ALIGNMENT＋QA、解説source/PDF、練習source/PDF、解説画像PowerPoint＋QAまで完了。固定5問・25答案要素は `25 / 25 connected`、SPEC固定8項目は `8 / 8 PASS`、二次は公式科目範囲外のため固定0問、exact blocker `0件`。次工程はanswer-bearing資料を先に開かないfresh workerによるclean blind candidate固定＋独立再解答。candidate固定後修正、未確認実車値の真値化、Topic 37・38先取りは行わない。', hand, count=1, flags=re.M)
          hmarker='### Topic 36 解説画像PowerPoint'
          if hmarker not in hand:
              hand += f'''\n\n### Topic 36 解説画像PowerPoint\n\ncanonical:\n- PowerPoint: `topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx`\n- QA: `topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images_qa.md`\n- SHA-256: `{sha}`\n\n品質ゲート:\n- 16:9: `6枚`\n- python-pptx geometry / text assertions / notes: `6 / 6 PASS`\n- LibreOffice PDF: `6 / 6 pages PASS`\n- Poppler PNG render: `6 / 6 PASS`\n- 固定5問・25答案要素: `25 / 25 connected`\n- SPEC固定8項目: `8 / 8 PASS`\n- 二次: `0問`（公式科目範囲外、件数合わせ0件）\n- Topic 21一般式変更: `0件`\n- exact blocker: `0件`\n\n次工程: fresh clean blind。現在runはanswer-bearing資料を確認済みのためcandidateを作成しない。\n'''
          hand_path.write_text(hand,encoding='utf-8')
          PYWRITE
      - name: Commit canonical outputs
        run: |
          git config user.name 'OpenAI automation'
          git config user.email 'actions@users.noreply.github.com'
          git add denken-shinkansen/05_shinkansen_vehicle_2/topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images.pptx denken-shinkansen/05_shinkansen_vehicle_2/topics/36_atc_signal_transmission_frequency/36_atc_signal_transmission_frequency_images_qa.md denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete Topic 36 PowerPoint'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
