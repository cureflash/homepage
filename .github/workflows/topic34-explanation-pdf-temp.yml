name: Topic34 explanation PDF temporary build
on:
  push:
    paths:
      - '.github/workflows/topic34-explanation-pdf-temp.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'reportlab==4.4.9'
      - name: Generate canonical PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from xml.sax.saxutils import escape
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, PageBreak
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib import colors
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.lib.units import mm

          base=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics')
          src=base/'34_compressor_pump_fan_load_characteristics_explanation_source.md'
          out=base/'34_compressor_pump_fan_load_characteristics_explanation.pdf'
          pdfmetrics.registerFont(UnicodeCIDFont('HeiseiKakuGo-W5'))
          pdfmetrics.registerFont(UnicodeCIDFont('HeiseiMin-W3'))
          styles={
            'title': ParagraphStyle('title',fontName='HeiseiKakuGo-W5',fontSize=17,leading=22,alignment=TA_CENTER,spaceAfter=7),
            'sub': ParagraphStyle('sub',fontName='HeiseiMin-W3',fontSize=8.5,leading=12,alignment=TA_CENTER,textColor=colors.HexColor('#444444'),spaceAfter=10),
            'h1': ParagraphStyle('h1',fontName='HeiseiKakuGo-W5',fontSize=12.2,leading=16,spaceBefore=7,spaceAfter=4,keepWithNext=True),
            'h2': ParagraphStyle('h2',fontName='HeiseiKakuGo-W5',fontSize=10.2,leading=14,spaceBefore=5,spaceAfter=3,keepWithNext=True),
            'body': ParagraphStyle('body',fontName='HeiseiMin-W3',fontSize=8.7,leading=12.2,spaceAfter=3.5,wordWrap='CJK'),
            'bullet': ParagraphStyle('bullet',fontName='HeiseiMin-W3',fontSize=8.5,leading=11.6,leftIndent=9,firstLineIndent=-7,spaceAfter=1.4,wordWrap='CJK'),
            'formula': ParagraphStyle('formula',fontName='HeiseiMin-W3',fontSize=9.0,leading=12.5,leftIndent=9,rightIndent=7,spaceBefore=2,spaceAfter=3,backColor=colors.HexColor('#f5f5f5'),borderPadding=(3,5,3,5),wordWrap='CJK'),
          }
          def clean(s):
              s=s.replace('**','').replace('`','')
              return escape(s)
          lines=src.read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if x.startswith('## 1. '))
          lines=lines[start:]
          story=[Paragraph('34 コンプレッサ・ポンプ・ファンの負荷特性',styles['title']),Paragraph('電験二種「機械」・「機械・制御」対応 解説プリント',styles['sub'])]
          for raw in lines:
              line=raw.strip()
              if line.startswith('次工程は'):
                  break
              if not line:
                  story.append(Spacer(1,1.5*mm)); continue
              if line.startswith('## '):
                  story.append(Paragraph(clean(line[3:]),styles['h1'])); continue
              if line.startswith('### '):
                  story.append(Paragraph(clean(line[4:]),styles['h2'])); continue
              if line.startswith('- '):
                  story.append(Paragraph('・'+clean(line[2:]),styles['bullet'])); continue
              if re.match(r'^\d+\.\s+',line):
                  story.append(Paragraph(clean(line),styles['bullet'])); continue
              if raw.startswith('`') and raw.endswith('`'):
                  story.append(Paragraph(clean(line),styles['formula'])); continue
              story.append(Paragraph(clean(line),styles['body']))
          W,H=A4
          def footer(c,doc):
              c.saveState(); c.setFont('HeiseiMin-W3',7); c.setFillColor(colors.HexColor('#666666'))
              c.drawString(15*mm,8*mm,'電験×新幹線 / 05 新幹線車両・二種 / Topic 34')
              c.drawRightString(W-15*mm,8*mm,str(doc.page)); c.restoreState()
          doc=SimpleDocTemplate(str(out),pagesize=A4,rightMargin=14*mm,leftMargin=14*mm,topMargin=14*mm,bottomMargin=14*mm,title='34 コンプレッサ・ポンプ・ファンの負荷特性',author='電験×新幹線 教材プロジェクト')
          doc.build(story,onFirstPage=footer,onLaterPages=footer)
          print(out)
          PY
      - name: Commit PDF
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics/34_compressor_pump_fan_load_characteristics_explanation.pdf
          git commit -m 'Add Topic 34 explanation PDF'
          git push
