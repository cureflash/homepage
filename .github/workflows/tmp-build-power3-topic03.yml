name: Build power3 Topic 03 PowerPoint

on:
  push:
    paths:
      - '.github/workflows/tmp-build-power3-topic03.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PPTX generator
        run: npm install --no-save --package-lock=false pptxgenjs@4.0.0
      - name: Generate PowerPoint
        run: node .github/scripts/tmp_generate_power3_topic03_pptx.js
      - name: Verify artifact
        run: |
          test -s denken-shinkansen/02_shinkansen_power_3/topics/03_thermal_power/03_thermal_power_images.pptx
          unzip -t denken-shinkansen/02_shinkansen_power_3/topics/03_thermal_power/03_thermal_power_images.pptx >/dev/null
      - name: Commit canonical artifact and remove temporary builder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denken-shinkansen/02_shinkansen_power_3/topics/03_thermal_power/03_thermal_power_images.pptx
          git rm .github/scripts/tmp_generate_power3_topic03_pptx.js .github/workflows/tmp-build-power3-topic03.yml
          git commit -m 'Add Topic 03 thermal power PowerPoint'
          git pull --rebase origin main
          git push origin HEAD:main