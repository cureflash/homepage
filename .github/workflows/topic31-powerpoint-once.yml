name: topic31-powerpoint-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic31-powerpoint-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install python-pptx pillow
      - name: Generate PowerPoint
        run: python .github/topic31_make_ppt_20260920.py
      - name: Render PowerPoint
        run: |
          set -euo pipefail
          PPT='denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_images.pptx'
          TMP=/tmp/topic31_render
          rm -rf "$TMP"
          mkdir -p "$TMP"
          libreoffice --headless --convert-to pdf --outdir "$TMP" "$PPT"
          PDF="$TMP/31_auxiliary_power_converter_images.pdf"
          test -s "$PDF"
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = '6'
          pdftotext -layout "$PDF" "$TMP/text.txt"
          if grep -q '�' "$TMP/text.txt"; then exit 1; fi
          pdftoppm -png -r 120 "$PDF" "$TMP/slide" >/dev/null 2>&1
          test "$(find "$TMP" -maxdepth 1 -name 'slide-*.png' | wc -l)" = '6'
      - name: Validate PowerPoint
        run: python .github/topic31_validate_20260920.py
      - name: Write QA and progress
        run: python .github/topic31_finalize_20260920.py
      - name: Commit canonical artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/topic31_make_ppt_20260920.py .github/topic31_validate_20260920.py .github/topic31_finalize_20260920.py .github/workflows/topic31-powerpoint-once.yml
          git add denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_images.pptx
          git add denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_images_qa.md
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git commit -m 'Complete Topic 31 PowerPoint QA'
          git fetch origin main
          PARENT="$(git rev-parse HEAD^)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$REMOTE" != "$PARENT" ]; then git rebase origin/main; fi
          git push origin HEAD:main
