name: Temporary Machine2 Topic19 Practice QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-machine2-topic19-practice-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QA dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow
      - name: Render and preflight current canonical PDF
        shell: bash
        run: |
          set -euo pipefail
          src='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.md'
          pdf='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.pdf'
          qa='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice_pdf_qa.md'
          SOURCE_BLOB=$(git hash-object "$src")
          PDF_BLOB=$(git hash-object "$pdf")
          PDF_SHA256=$(sha256sum "$pdf" | awk '{print $1}')
          PDF_SIZE=$(wc -c < "$pdf")
          PAGES=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          SIZE_LINE=$(pdfinfo "$pdf" | awk -F': *' '/^Page size:/ {print $2}')
          test "$SOURCE_BLOB" = 'f1015f13e5deefcbd7e67fbd8d0891249d684333'
          test "$PDF_BLOB" = '5983354776827cfb38889a944d1cbb4c6c269fbe'
          test "$PAGES" -eq 15
          echo "$SIZE_LINE" | grep -Eq '^595(\.276)? x 841(\.89)? pts \(A4\)$'
          test "$(grep -c '^## 問' "$src")" -eq 15
          mkdir -p /tmp/render
          pdftoppm -png -r 200 "$pdf" /tmp/render/page >/dev/null 2>&1
          test "$(find /tmp/render -maxdepth 1 -name 'page-*.png' | wc -l)" -eq 15
          pdftotext -layout "$pdf" /tmp/text.txt
          pdftotext -bbox-layout "$pdf" /tmp/bbox.html
          python - <<'PY' > /tmp/imageqa.txt
          from pathlib import Path
          from PIL import Image, ImageChops
          import re
          files=sorted(Path('/tmp/render').glob('page-*.png'))
          assert len(files)==15
          dims=[]
          margins=[]
          for p in files:
              im=Image.open(p).convert('L')
              dims.append(im.size)
              # Treat pixels darker than 250 as content. Ensure rendered content does not touch page edges.
              mask=im.point(lambda x: 0 if x>=250 else 255, mode='1')
              box=mask.getbbox()
              assert box is not None, p
              l,t,r,b=box
              w,h=im.size
              m=(l,t,w-r,h-b)
              margins.append(m)
              assert min(m) >= 8, (p.name,m)
              # Reject suspicious large near-solid black blocks (>12% of page).
              hist=im.histogram()
              black=sum(hist[:20])
              assert black/(w*h) < 0.12, (p.name,black/(w*h))
          assert len(set(dims))==1, set(dims)
          text=Path('/tmp/text.txt').read_text(encoding='utf-8')
          for key in ['問1','問10','問11','問15','PID','Kp','Ki','Kd']:
              assert key in text, key
          assert '\ufffd' not in text
          assert '(cid:' not in text
          # Check extracted word boxes remain inside declared page extents.
          bbox=Path('/tmp/bbox.html').read_text(encoding='utf-8', errors='strict')
          page_re=re.compile(r'<page width="([0-9.]+)" height="([0-9.]+)">(.*?)</page>', re.S)
          word_re=re.compile(r'<word xMin="([0-9.]+)" yMin="([0-9.]+)" xMax="([0-9.]+)" yMax="([0-9.]+)"')
          pages=page_re.findall(bbox)
          assert len(pages)==15, len(pages)
          words=0
          for w_s,h_s,body in pages:
              w=float(w_s); h=float(h_s)
              for vals in word_re.findall(body):
                  x0,y0,x1,y1=map(float,vals); words += 1
                  assert -0.01 <= x0 <= x1 <= w+0.01, vals
                  assert -0.01 <= y0 <= y1 <= h+0.01, vals
          assert words > 300, words
          print('render_pages=15')
          print('render_dimensions=%dx%d' % dims[0])
          print('min_render_margin_px=%d' % min(min(x) for x in margins))
          print('bbox_words=%d' % words)
          print('replacement_chars=0')
          print('cid_markers=0')
          PY
          cat /tmp/imageqa.txt
          MIN_MARGIN=$(awk -F= '/min_render_margin_px/ {print $2}' /tmp/imageqa.txt)
          DIMS=$(awk -F= '/render_dimensions/ {print $2}' /tmp/imageqa.txt)
          WORDS=$(awk -F= '/bbox_words/ {print $2}' /tmp/imageqa.txt)
          cat > "$qa" <<EOF
          # Topic 19 練習PDF QA

          更新日: 2026-09-19

          対象: \`topics/19_pid_speed_control/19_pid_speed_control_practice.pdf\`

          ## reconcile
          - 最新main上の練習sourceとPDFを対象に再検証した。
          - 固定EXAM_ALIGNMENTは一次1問＋二次4問、計5問・12答案要素のまま変更していない。
          - 練習sourceは一次試験型10問＋二次試験型5問、合計15問。技術内容は変更していない。
          - Topic 20/21先取り、未確認実車PID値の実車値化、固定問題の個別正答記号・最終数値保存は追加していない。

          ## 現行練習PDF
          - A4縦・15ページ。
          - canonical source blob: \`$SOURCE_BLOB\`
          - PDF Git blob: \`$PDF_BLOB\`
          - PDF SHA-256: \`$PDF_SHA256\`
          - PDF size: \`$PDF_SIZE byte\`

          ## 表示QA
          - Poppler \`pdftoppm\` 200 dpiで全15ページをPNGレンダリング: \`15 / 15 PASS\`。
          - 全ページ同一レンダリング寸法: \`$DIMS px\`。
          - ページ外への内容はみ出し: \`0件\`。抽出word bboxも全件ページ内。
          - レンダリング内容の最小余白: \`$MIN_MARGIN px\`（ページ端接触なし）。
          - ページ面積12%超の異常な黒塗り領域: \`0件\`。

          判定: \`PASS\`。

          ## 文字抽出QA
          - \`pdftotext -layout\` 成功。
          - Unicode置換文字: \`0件\`。
          - \`(cid:)\`: \`0件\`。
          - \`問1\` / \`問10\` / \`問11\` / \`問15\`、\`PID\` / \`Kp\` / \`Ki\` / \`Kd\` を抽出確認。
          - bbox抽出語数: \`$WORDS\`。

          判定: \`PASS\`。

          ## 内容整合
          - PDFはQA済みcanonical練習source blob \`$SOURCE_BLOB\` から生成され、source自体は不変。
          - 一次10問の正答一意性 \`10 / 10 PASS\`、全15問の独立再計算・論理確認 \`15 / 15 PASS\`、固定5問・12答案要素 \`12 / 12 COVERED\` は既存source QAを維持する。

          ## 判定
          \`PASS / topic_19_practice_pdf_complete / IN_PROGRESS\`

          ## 次工程
          Topic 19の解説画像PowerPoint sourceを作成する。
          EOF
          echo "SOURCE_BLOB=$SOURCE_BLOB" >> "$GITHUB_ENV"
          echo "PDF_BLOB=$PDF_BLOB" >> "$GITHUB_ENV"
      - name: Commit QA if source and PDF are unchanged
        shell: bash
        run: |
          set -euo pipefail
          src='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.md'
          pdf='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice.pdf'
          qa='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_practice_pdf_qa.md'
          cp "$qa" /tmp/qa.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            test "$(git hash-object "$src")" = "$SOURCE_BLOB"
            test "$(git hash-object "$pdf")" = "$PDF_BLOB"
            cp /tmp/qa.md "$qa"
            git add "$qa"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'denken machine2: QA Topic 19 practice PDF'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
