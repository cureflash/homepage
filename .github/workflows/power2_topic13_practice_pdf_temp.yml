name: Power2 Topic 13 practice PDF

on:
  push:
    paths:
      - 'denken-shinkansen/06_shinkansen_power_2/topics/13_three_phase_unbalance/_build_topic13_practice_pdf.py'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF QA dependencies
        run: python -m pip install --disable-pip-version-check reportlab pymupdf
      - name: Reconcile and build
        shell: bash
        run: |
          set -euo pipefail
          STATUS='denken-shinkansen/06_shinkansen_power_2/STATUS.md'
          PDF='denken-shinkansen/06_shinkansen_power_2/topics/13_three_phase_unbalance/13_three_phase_unbalance_practice.pdf'
          if grep -Fq 'current_status: `topic_13_practice_source_complete`' "$STATUS" && [ ! -e "$PDF" ]; then
            python denken-shinkansen/06_shinkansen_power_2/topics/13_three_phase_unbalance/_build_topic13_practice_pdf.py
            echo 'build' > /tmp/power2_topic13_mode
          else
            echo 'skip' > /tmp/power2_topic13_mode
            echo 'Main already moved past the expected source-complete state; skipping duplicate work.'
          fi
      - name: Commit result and remove one-shot job
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='denken-shinkansen/06_shinkansen_power_2/topics/13_three_phase_unbalance/_build_topic13_practice_pdf.py'
          WORKFLOW='.github/workflows/power2_topic13_practice_pdf_temp.yml'
          git rm "$SCRIPT" "$WORKFLOW"
          if [ "$(cat /tmp/power2_topic13_mode)" = 'build' ]; then
            git add denken-shinkansen/06_shinkansen_power_2/STATUS.md \
                    denken-shinkansen/06_shinkansen_power_2/HANDOFF.md \
                    denken-shinkansen/06_shinkansen_power_2/topics/13_three_phase_unbalance/13_three_phase_unbalance_practice.pdf \
                    denken-shinkansen/06_shinkansen_power_2/topics/13_three_phase_unbalance/13_three_phase_unbalance_practice_pdf_qa.md
            MSG='denken power2: add Topic 13 practice PDF and QA'
          else
            MSG='chore: remove reconciled Topic 13 one-shot job'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$MSG"
          for try in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
