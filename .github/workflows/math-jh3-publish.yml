name: Junior-high grade 3 worksheet factory checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_jh3_*.py'
      - 'tests/test_jh3_*_publisher.py'
      - '.github/workflows/math-jh3-publish.yml'
  workflow_dispatch:

concurrency:
  group: worksheet-catalog-publish-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Reconcile latest main and validate junior-high grade 3 batch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_jh3_expansion_basics.py .
            python scripts/publish_jh3_factorization_basics.py .
            python scripts/publish_jh3_factorization_roots.py .
            python tests/test_jh3_expansion_basics_publisher.py
            python tests/test_jh3_factorization_basics_publisher.py
            python tests/test_jh3_factorization_roots_publisher.py
            python tests/test_worksheet_factory.py
            python tests/test_worksheet_catalog_writer_concurrency.py
            before=$(git rev-parse origin/main)
            git fetch origin main
            after=$(git rev-parse origin/main)
            [ "$before" = "$after" ] && break
            [ "$attempt" = 3 ] && { echo 'main kept moving; aborting rather than validating stale state' >&2; exit 1; }
          done
      - name: Commit validated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worksheet-factory-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/junior-high/grade-03/
          if git diff --cached --quiet; then
            echo 'No junior-high grade-3 checkpoint changes to publish.'
            exit 0
          fi
          git commit -m 'Publish junior-high grade 3 worksheet checkpoint'
          git push origin HEAD:main
