name: Publish junior-high grade 1 physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-jh1-publish.yml'
      - 'scripts/publish_science_physics_jh1.py'
      - 'scripts/publish_science_physics_jh1_retrieval.py'
      - 'scripts/science_physics_topics.py'
      - 'tests/test_science_physics_jh1.py'
      - 'tests/test_science_physics_jh1_retrieval.py'

permissions:
  contents: write

concurrency:
  group: science-jh1-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and JH1 physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh1.py
          python tests/test_science_physics_jh1_retrieval.py

      - name: Ensure calculation batch is present
        run: python scripts/publish_science_physics_jh1.py

      - name: Generate and register retrieval batch
        run: python scripts/publish_science_physics_jh1_retrieval.py

      - name: Re-run full validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh1.py
          python tests/test_science_physics_jh1_retrieval.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog
          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          science = [
              x for x in catalog
              if x.get('subject') == '理科'
              and x.get('science_field') == 'physics'
              and x.get('school_level') == 'junior-high'
              and x.get('grade') == 1
          ]
          assert len(science) == 24, len(science)
          assert sum(x.get('answer_type') == 'numeric' for x in science) == 12
          assert sum(x.get('answer_type') == 'accepted-set' for x in science) == 12
          for entry in science:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('JH1 physics 24-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/junior-high/grade-01/physics/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; all JH1 physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish junior-high physics retrieval worksheet batch'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
