name: Publish junior-high grade 1 physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-jh1-publish.yml'
      - 'scripts/publish_science_physics_jh1.py'

permissions:
  contents: write

concurrency:
  group: science-jh1-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared worksheet tests
        run: python tests/test_worksheet_factory.py

      - name: Run junior-high grade 1 physics tests
        run: python tests/test_science_physics_jh1.py

      - name: Generate and register first physics batch
        run: python scripts/publish_science_physics_jh1.py

      - name: Re-run shared validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh1.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog
          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          science = [x for x in catalog if x.get('subject') == '理科' and x.get('science_field') == 'physics' and x.get('school_level') == 'junior-high' and x.get('grade') == 1]
          assert len(science) == 12, len(science)
          for entry in science:
              path = root / entry['url']
              assert path.read_bytes().startswith(b'%PDF')
              assert path.stat().st_size > 1000
          print('published science catalog/PDF validation: OK')
          PY

      - name: Commit generated PDFs and catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/junior-high/grade-01/physics/*.pdf
          git diff --cached --exit-code && { echo 'No generated changes'; exit 1; } || true
          git commit -m 'Publish first junior-high physics worksheet batch'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
