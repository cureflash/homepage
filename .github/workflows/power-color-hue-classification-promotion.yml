name: Power Color hue classification promotion

on:
  push:
    branches:
      - automation/power-color-hue-class-runtime-20260901
    paths:
      - 'qualifications/color-certification/**'
      - '.github/workflows/power-color-hue-classification-promotion.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified promotion request when present
        working-directory: qualifications/color-certification
        run: node tools/promote-verified-authoring.mjs
      - name: Run Power Color tests
        working-directory: qualifications/color-certification
        run: npm test
      - name: Commit promotion result when the request changed files
        shell: bash
        run: |
          if [ -n "$(git status --porcelain qualifications/color-certification)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A qualifications/color-certification
            git commit -m "Power Color: apply hue classification runtime promotion [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
