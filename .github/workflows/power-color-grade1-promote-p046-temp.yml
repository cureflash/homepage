name: Power Color Grade 1 p046 canonical promotion temp

on:
  push:
    branches:
      - power-color/grade1-p046-promotion-retry-20260904-1401

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, 'Apply canonical p046 promotion') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical promotion
        run: node tools/power-color-grade1-promote-p046.mjs
      - name: Run Grade 1 runtime gate
        run: node --test qualifications/color-certification/tests/grade1-runtime-promotion.test.js
      - name: Commit generated promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualifications/color-certification/data/grade1-runtime.json qualifications/color-certification/tests/grade1-runtime-promotion.test.js
          git commit -m "Apply canonical p046 promotion"
          git push origin HEAD:${GITHUB_REF_NAME}
