name: Temporary vehicle2 Topic 24 canonical PPTX QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_vehicle2_topic24_canonical_qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Independently QA canonical PPTX and resolve blocker
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          status='denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'
          handoff='denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md'
          dir='denken-shinkansen/05_shinkansen_vehicle_2/topics/24_n700s_main_motor_design_comparison'
          p="$dir/24_n700s_main_motor_design_comparison_images.pptx"
          qa="$dir/24_n700s_main_motor_design_comparison_powerpoint_qa.md"
          wf='.github/workflows/_tmp_vehicle2_topic24_canonical_qa.yml'

          cleanup_only() {
            git config user.name 'denken-vehicle2-bot'
            git config user.email '89366952+cureflash@users.noreply.github.com'
            git rm -f "$wf"
            git commit -m 'Remove obsolete Topic 24 canonical QA workflow'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          }

          grep -Fq 'current_status: `topic_24_powerpoint_blocked_artifact_identity`' "$status" || cleanup_only
          test -f "$p"
          artifact_git=$(git hash-object "$p")
          bytes=$(wc -c < "$p" | tr -d ' ')
          sha=$(sha256sum "$p" | awk '{print $1}')

          unzip -t "$p" >/tmp/topic24_unzip.txt
          python -m pip install -q python-pptx pypdfium2
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/05_shinkansen_vehicle_2/topics/24_n700s_main_motor_design_comparison/24_n700s_main_motor_design_comparison_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==6, len(prs.slides)
          sw,sh=prs.slide_width,prs.slide_height
          texts=[]
          for n,sl in enumerate(prs.slides,1):
              for shape in sl.shapes:
                  assert shape.left >= 0 and shape.top >= 0, (n,shape.name,'negative')
                  assert shape.left + shape.width <= sw, (n,shape.name,'right overflow')
                  assert shape.top + shape.height <= sh, (n,shape.name,'bottom overflow')
                  if hasattr(shape,'text') and shape.text:
                      texts.append(shape.text)
          t='\n'.join(texts)
          required=['17 / 17','n_s = 120f / P','P_m = omega T','theta_e = (P/2) theta_m','T proportional to s','Phi proportional to V/f','48.1','48.0','6-pole','20%']
          # canonical deck may use Unicode mathematical glyphs/Japanese labels; require semantic alternatives
          groups=[
              ['17 / 17','17/17'],
              ['n_s = 120f / P','nₛ = 120f / P','n_s=120f/P'],
              ['P_m = omega T','Pₘ=ωT','P_m=ωT'],
              ['theta_e = (P/2) theta_m','θₑ=(P/2)θₘ','θ_e=(P/2)θ_m'],
              ['T proportional to s','T ∝ s','T∝s'],
              ['Phi proportional to V/f','Φ ∝ V/f','Φ∝V/f'],
              ['48.1'],['48.0'],['6極','6-pole'],['20%','約20%']
          ]
          for g in groups:
              assert any(x in t for x in g), g
          print('python-pptx=PASS slides=6 shape-bounds=PASS semantic-terms=PASS')
          PY

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libreoffice-impress poppler-utils >/dev/null
          mkdir -p /tmp/topic24canonical/poppler /tmp/topic24canonical/pdfium
          libreoffice --headless --convert-to pdf --outdir /tmp/topic24canonical "$p" >/tmp/topic24_lo.txt 2>&1
          pdf='/tmp/topic24canonical/24_n700s_main_motor_design_comparison_images.pdf'
          test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = '6'
          pdftoppm -png -r 150 "$pdf" /tmp/topic24canonical/poppler/page >/tmp/topic24_pdftoppm.txt 2>&1
          test "$(find /tmp/topic24canonical/poppler -name 'page-*.png' | wc -l)" = '6'
          python - <<'PY'
          import pypdfium2 as pdfium
          from pathlib import Path
          pdf=pdfium.PdfDocument('/tmp/topic24canonical/24_n700s_main_motor_design_comparison_images.pdf')
          assert len(pdf)==6
          out=Path('/tmp/topic24canonical/pdfium')
          for i,page in enumerate(pdf):
              bmp=page.render(scale=150/72)
              bmp.to_pil().save(out/f'page-{i+1}.png')
          assert len(list(out.glob('page-*.png')))==6
          print('pdfium-render=PASS pages=6')
          PY
          pdftotext "$pdf" /tmp/topic24canonical/text.txt
          test "$(grep -o '�' /tmp/topic24canonical/text.txt | wc -l)" = '0'
          test "$(grep -o '(cid:' /tmp/topic24canonical/text.txt | wc -l)" = '0'
          for term in '17 / 17' '48.1' '48.0' '6極' '20%'; do grep -Fq "$term" /tmp/topic24canonical/text.txt; done
          pdftotext -bbox "$pdf" /tmp/topic24canonical/bbox.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/topic24canonical/bbox.html').read_text(errors='replace')
          pages=re.findall(r'<page width="([0-9.]+)" height="([0-9.]+)">(.*?)</page>',s,re.S)
          assert len(pages)==6, len(pages)
          for i,(w,h,body) in enumerate(pages,1):
              W,H=float(w),float(h)
              for x1,y1,x2,y2 in re.findall(r'<word xMin="([0-9.]+)" yMin="([0-9.]+)" xMax="([0-9.]+)" yMax="([0-9.]+)"',body):
                  x1,y1,x2,y2=map(float,(x1,y1,x2,y2))
                  assert 0 <= x1 <= x2 <= W+0.2, (i,x1,x2,W)
                  assert 0 <= y1 <= y2 <= H+0.2, (i,y1,y2,H)
          print('bbox-page-bounds=PASS pages=6')
          PY

          # Reconcile once more before writing progress files. If another worker moved the series, do not overwrite it.
          git fetch origin main
          remote_status=$(git show origin/main:"$status")
          printf '%s' "$remote_status" | grep -Fq 'current_status: `topic_24_powerpoint_blocked_artifact_identity`' || cleanup_only
          remote_git=$(git show origin/main:"$p" | git hash-object --stdin)
          test "$remote_git" = "$artifact_git" || cleanup_only
          git reset --hard origin/main

          cat > "$qa" <<'EOF'
          # Topic 24 N700S 主電動機設計の比較 - 解説画像PowerPoint QA

          更新日: 2026-09-20

          判定: `PASS / POWERPOINT_CANONICAL_QA_COMPLETE`

          ## reconcile

          最新main、`MASTER_SPEC.md`、`EXAM_ALIGNMENT_SPEC.md`、系列 `SPEC.md`、最新 `STATUS.md` / `HANDOFF.md`、直近車両二種worker成果をreconcileした。先行workerが記録したローカル最終artifactとGitHub正本PPTXのidentity不一致を引き継ぎ、QA結果の流用はせず、GitHub main正本PPTXそのものを独立に再QAした。

          Topic 21 H26二次「機械・制御」問1(4)の `48.1 / 48.0 N·m` 差は既存診断どおり過去問固有丸め差として維持し、一般式 `P=Tω`、`ω=2πN/60` は変更していない。

          ## GitHub正本artifact

          - path: `topics/24_n700s_main_motor_design_comparison/24_n700s_main_motor_design_comparison_images.pptx`
          - 形式: 16:9 / `6 slides`
          - byte size: `__BYTES__ bytes`
          - SHA-256: `__SHA__`
          - Git blob SHA: `__GIT__`

          先行workerのローカルQA済みartifact `27,698 bytes` とは同一ではないが、GitHub正本を直接・独立にQAしたため、artifact identity blockerは解消した。

          ## GitHub正本 構造・表示QA

          - ZIP integrity: `PASS`
          - python-pptx open: `6 / 6 PASS`
          - geometry overflow: `0`
          - 必須意味要素のPPTX内存在: `PASS`
          - LibreOffice PDF変換: `PASS / 6 pages`
          - Poppler 150 dpi render: `6 / 6 PASS`
          - PDFium 150 dpi render: `6 / 6 PASS`
          - PDF bbox page bounds: `6 / 6 PASS`
          - pdftotext replacement character `�`: `0`
          - pdftotext `(cid:)`: `0`
          - 主要数式・数値・境界語のPDF文字抽出: `PASS`

          ## 内容・境界QA

          - 固定過去問: 第二種一次3問＋二次2問 = `5 / 5 covered`
          - 一次答案要素: `11 / 11 covered`
          - 二次答案要素: `6 / 6 covered`
          - 合計答案要素: `17 / 17 covered`
          - SPEC必須8項目: `8 / 8 covered`
          - SPEC指定3可視化: `3 / 3 PASS`
          - N700S実車接続: 確認済み主電動機6極化のみを実値として扱う
          - 駆動システム約20%軽量化を主電動機単体・6極化単独へ誤帰属: `0件`
          - 未確認N700S実運転周波数・回転速度・トルク・寸法・質量の真値化: `0件`
          - 固定EXAM_ALIGNMENT変更: `0件`
          - Topic 21一般式変更: `0件`
          - SPEC外主題追加: `0件`
          - 新たなexact blocker: `0件`

          ## 次工程

          GitHub正本PPTXの独立QAがPASSしたため、次はTopic 24教材だけで固定5問・17答案要素をclean blind独立再解答し、候補答案を固定する。候補固定前に公式標準解答へ照合しない。
          EOF
          sed -i "s/__BYTES__/$bytes/g; s/__SHA__/$sha/g; s/__GIT__/$artifact_git/g" "$qa"

          python - <<'PY'
          from pathlib import Path
          import re
          status=Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md')
          s=status.read_text()
          s=s.replace('- current_status: `topic_24_powerpoint_blocked_artifact_identity`','- current_status: `topic_24_powerpoint_complete`')
          s=re.sub(r'- next_start: Topic 24 PowerPointのartifact identity blocker解消。.*?clean blindへ進まない', '- next_start: Topic 24 clean blind独立再解答。Topic 24教材だけで固定5問・17答案要素を再解答し、候補答案を固定する。公式照合は候補固定後に行う', s, count=1)
          start=s.index('## Topic 24 解説画像PowerPoint')
          end=s.index('## Topic 24 練習PDF')
          section='''## Topic 24 解説画像PowerPoint\n\n- 判定: `PASS / POWERPOINT_CANONICAL_QA_COMPLETE`\n- GitHub main正本を独立再QA: `PASS`\n- 16:9: `6 slides`\n- ZIP / python-pptx / geometry: `PASS`\n- LibreOffice PDF変換: `6 / 6 PASS`\n- Poppler 150 dpi: `6 / 6 PASS`\n- PDFium 150 dpi: `6 / 6 PASS`\n- bbox page bounds: `6 / 6 PASS`\n- 固定過去問: 第二種一次3問＋二次2問 = `5 / 5 covered`\n- 一次答案要素: `11 / 11 covered`\n- 二次答案要素: `6 / 6 covered`\n- 合計答案要素: `17 / 17 covered`\n- SPEC必須8項目: `8 / 8 covered`\n- SPEC指定3可視化: `3 / 3 PASS`\n- artifact identity blocker: `RESOLVED`（旧ローカルartifactとは別物だがGitHub正本を直接QA）\n- Topic 21 H26二次 問1(4)の丸め注記: `48.1 / 48.0 N·m` を過去問固有差として維持\n- Topic 21一般式変更: `0件`\n- 固定EXAM_ALIGNMENT変更: `0件`\n- SPEC外主題追加: `0件`\n- 未確認N700S実車値の真値化: `0件`\n- 完成後clean blind固定過去問再解答: `未実施`\n- 新たなexact blocker: `0件`\n\n成果物:\n- `topics/24_n700s_main_motor_design_comparison/24_n700s_main_motor_design_comparison_images.pptx`\n- `topics/24_n700s_main_motor_design_comparison/24_n700s_main_motor_design_comparison_powerpoint_qa.md`\n\nTopic 24全体は `completed` としない。\n\n'''
          s=s[:start]+section+s[end:]
          s=s.replace('## 次工程\n\nTopic 24 PowerPointのartifact identity blocker解消。GitHub正本PPTXをQA済み最終artifactと一致させ、正本に対して構造・表示QAを再確認する。解消前はclean blindへ進まない。', '## 次工程\n\nTopic 24 clean blind独立再解答。Topic 24教材だけで固定5問・17答案要素を解き、候補答案を固定する。公式照合は候補固定後に行う。完成数は `23 / 39` のまま。')
          status.write_text(s)

          handoff=Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          h=handoff.read_text()
          a=h.index('## 今回実施 — Topic 24 解説画像PowerPoint')
          b=h.index('## Topic 24 既存成果')
          sec='''## 今回実施 — Topic 24 GitHub正本PowerPoint独立QA\n\n先行workerが `GitHub正本PPTX 24,879 bytes` と `ローカルQA済みartifact 27,698 bytes` のidentity不一致をexact blockerとして記録したため、clean blindへは進まず、GitHub main正本PPTXそのものを独立に再QAした。\n\n判定: `PASS / POWERPOINT_CANONICAL_QA_COMPLETE`\n\n- 16:9 / `6 slides`\n- ZIP / python-pptx / geometry: `PASS`\n- LibreOffice PDF: `6 / 6 PASS`\n- Poppler 150 dpi: `6 / 6 PASS`\n- PDFium 150 dpi: `6 / 6 PASS`\n- bbox page bounds: `6 / 6 PASS`\n- 固定5問・17答案要素: `17 / 17 covered`\n- SPEC必須8項目: `8 / 8 covered`\n- SPEC指定3可視化: `3 / 3 PASS`\n- artifact identity blocker: `RESOLVED`（ローカルQA結果を流用せず正本を直接QA）\n- 固定EXAM_ALIGNMENT変更: `0件`\n- Topic 21一般式変更: `0件`\n- 未確認N700S実車値の真値化: `0件`\n- 新たなexact blocker: `0件`\n\nTopic 24はまだ `completed` としない。次工程はclean blind候補答案固定。\n\n'''
          h=h[:a]+sec+h[b:]
          h=h.replace('- 解説画像PowerPoint: `PASS / POWERPOINT_COMPLETE`','- 解説画像PowerPoint: `PASS / POWERPOINT_CANONICAL_QA_COMPLETE`')
          h=h.replace('## 次の安全な工程\n\nTopic 24教材だけを使い、固定5問・17答案要素をclean blind独立再解答する。公式標準解答との一致を確認し、PASSした場合のみ最終QAへ進む。', '## 次の安全な工程\n\nTopic 24教材だけを使い、固定5問・17答案要素をclean blind独立再解答して候補答案を固定する。候補固定前に公式標準解答へ照合しない。候補固定後に公式照合へ進む。')
          handoff.write_text(h)
          PY

          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git rm "$wf"
          git add "$qa" "$status" "$handoff"
          git commit -m 'Resolve Topic 24 PowerPoint canonical QA blocker'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
