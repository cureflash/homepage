name: Temp patch Topic 17 progress

on:
  push:
    paths:
      - 'denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/_patch_topic17_progress.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch records
        run: python denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/_patch_topic17_progress.py
      - name: Commit records
        shell: bash
        run: |
          set -euo pipefail
          GEN='denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/_patch_topic17_progress.py'
          git rm "$GEN"
          git add denken-shinkansen/10_electrical_math_2/STATUS.md \
                  denken-shinkansen/10_electrical_math_2/HANDOFF.md \
                  denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/17_ode_numerical_methods.md \
                  denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/17_ode_numerical_methods_powerpoint_qa.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'denken: record Topic 17 PowerPoint QA progress'
          for try in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
