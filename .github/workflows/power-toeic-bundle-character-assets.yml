name: Power TOEIC bundle character assets

on:
  push:
    branches:
      - power-toeic/phase-11-4-character-assets
    paths:
      - scripts/power_toeic_bundle_irasutoya_assets.py
      - .github/workflows/power-toeic-bundle-character-assets.yml
      - subjects/english/power-toeic/tests/character-presenter.test.js
      - subjects/english/power-toeic-ios/Package.swift
      - subjects/english/power-toeic-ios/Sources/PowerTOEIC/Views/Character/CharacterView.swift
      - subjects/english/power-toeic-ios/Sources/PowerTOEIC/Views/Character/AssetCatalog.swift
      - subjects/english/power-toeic-ios/Tests/PowerTOEICTests/ProgressionAssetTests.swift
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-and-validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-toeic/phase-11-4-character-assets

      - name: Bundle pinned Irasutoya character assets
        run: python3 scripts/power_toeic_bundle_irasutoya_assets.py

      - name: Validate Web tests
        working-directory: subjects/english/power-toeic
        run: npm test

      - name: Validate Swift tests
        working-directory: subjects/english/power-toeic-ios
        run: swift test

      - name: Validate identical Web and Swift character bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          web = root / 'subjects/english/power-toeic/assets/characters'
          swift = root / 'subjects/english/power-toeic-ios/Sources/PowerTOEIC/Resources/Character'
          names = [
              'irasutoya_sergeant_instructor.png',
              'irasutoya_trainee_skinny.png',
              'irasutoya_trainee_muscular.png',
          ]
          for name in names:
              a = (web / name).read_bytes()
              b = (swift / name).read_bytes()
              assert a == b, name
              assert a.startswith(b'\x89PNG\r\n\x1a\n'), name
              print(name, len(a), hashlib.sha256(a).hexdigest())
          bodybuilder = 'irasutoya_trainee_bodybuilder.png'
          assert not (web / bodybuilder).exists(), 'Do not substitute an unverified Stage 5 image'
          assert not (swift / bodybuilder).exists(), 'Do not substitute an unverified Stage 5 image'
          PY

      - name: Commit bundled assets and provenance
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            subjects/english/power-toeic/assets/characters \
            subjects/english/power-toeic/js/ui/asset-catalog.js \
            subjects/english/power-toeic-ios/Sources/PowerTOEIC/Resources/Character \
            subjects/english/power-toeic-ios/Release/AssetManifest.json
          git commit -m "Power TOEIC: bundle verified Irasutoya character assets"
          git push origin HEAD:power-toeic/phase-11-4-character-assets
