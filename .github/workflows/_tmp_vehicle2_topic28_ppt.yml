name: tmp-vehicle2-topic28-ppt

on:
  push:

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Stage Topic 28 PowerPoint workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate canonical Topic 28 PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          dir='denken-shinkansen/05_shinkansen_vehicle_2/topics/28_l0_synchronous_machine_phasor_propulsion'
          gen="$dir/_tmp_build_topic28.js"
          p="$dir/28_l0_synchronous_machine_phasor_propulsion_images.pptx"
          metrics="$dir/_tmp_topic28_ppt_metrics.txt"

          test -f "$gen"
          grep -q 'current_status: `topic_28_practice_pdf_complete`' 'denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'

          mkdir -p /tmp/topic28_node
          npm install --prefix /tmp/topic28_node --no-save pptxgenjs@4.0.0 >/dev/null 2>&1
          NODE_PATH=/tmp/topic28_node/node_modules TOPIC28_OUT="$p" node "$gen"

          unzip -t "$p" >/dev/null
          python -m pip install -q python-pptx
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/05_shinkansen_vehicle_2/topics/28_l0_synchronous_machine_phasor_propulsion/28_l0_synchronous_machine_phasor_propulsion_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==6
          assert abs(prs.slide_width/prs.slide_height - 16/9) < 1e-5
          sw,sh=prs.slide_width,prs.slide_height
          texts=[]
          for i,slide in enumerate(prs.slides,1):
              for shape in slide.shapes:
                  assert shape.left >= 0 and shape.top >= 0, (i,shape.name)
                  assert shape.left + shape.width <= sw + 2, (i,shape.name)
                  assert shape.top + shape.height <= sh + 2, (i,shape.name)
                  if hasattr(shape,'text'): texts.append(shape.text)
          all_text='\n'.join(texts)
          required=['Topic 28','発電機：E = V + jXₛI','電動機：E = V − jXₛI','P_mech = Fv','R4 一次','R7 二次','R5 二次','H29 二次','H27 二次','27 / 27','SPEC必須8項目','指定3可視化','48.1 / 48.0 N·m','Topic 29']
          for token in required:
              assert token in all_text, token
          assert '\ufffd' not in all_text
          print('package/open/geometry/content PASS, slides=6')
          PY

          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          fi
          rm -rf /tmp/topic28_render && mkdir -p /tmp/topic28_render
          libreoffice --headless --convert-to pdf --outdir /tmp/topic28_render "$p" >/tmp/topic28_lo.txt 2>&1
          pdf='/tmp/topic28_render/28_l0_synchronous_machine_phasor_propulsion_images.pdf'
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = '6'
          pdftotext -layout "$pdf" /tmp/topic28.txt
          for token in 'Topic 28' '150 kN' '27 / 27' 'R7' '48.1 / 48.0 N·m'; do grep -q "$token" /tmp/topic28.txt; done
          ! grep -q $'\xef\xbf\xbd' /tmp/topic28.txt

          size=$(stat -c '%s' "$p")
          hash=$(sha256sum "$p" | awk '{print $1}')
          textbytes=$(stat -c '%s' /tmp/topic28.txt)
          printf 'size=%s\nsha256=%s\nslides=6\nrender_pages=6\npdftotext=PASS\ntext_bytes=%s\n' "$size" "$hash" "$textbytes" > "$metrics"

          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add "$p" "$metrics"
          git commit -m 'Rebuild Topic 28 PowerPoint canonical artifact'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
