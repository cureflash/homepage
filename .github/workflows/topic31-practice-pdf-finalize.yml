name: Topic 31 practice PDF finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic31-practice-pdf-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest main and finalize state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice.pdf'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice_pdf_qa.md'
          STATUS='denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'
          HANDOFF='denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md'

          test -f "$PDF"
          test -f "$QA"
          test "$(git hash-object "$PDF")" = '405383decbd8db2e9af66d314699081ccf1ec0a8'
          grep -Fq 'PASS / PRACTICE_PDF_COMPLETE' "$QA"
          grep -Fq '27 / 27 connected' "$QA"
          grep -Fq '8 / 8 covered' "$QA"
          grep -Fq 'exact blocker: `0件`' "$QA"

          python - <<'PY'
          from pathlib import Path

          status = Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md')
          s = status.read_text(encoding='utf-8')
          if 'current_status: `topic_31_practice_pdf_complete`' not in s:
              old = """- current_status: `topic_31_practice_source_complete`
- last_completed_topic: `30 L0系④ 誘導集電・非接触電力伝送`
- active_topic: `31 補助電源変換器`
- next_start: Topic 31練習PDFを生成し、固定5問・27答案要素とSPEC 8項目を維持してPDF QAする

Topic 01〜30は `PASS / completed`。完成数 `30 / 39`。Topic 31は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QAまで完了。

## Topic 31 練習source
"""
              new = """- current_status: `topic_31_practice_pdf_complete`
- last_completed_topic: `30 L0系④ 誘導集電・非接触電力伝送`
- active_topic: `31 補助電源変換器`
- next_start: Topic 31 PowerPointを作成し、固定5問・27答案要素とSPEC 8項目を維持してrender QAする

Topic 01〜30は `PASS / completed`。完成数 `30 / 39`。Topic 31は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了。

## Topic 31 練習PDF

判定: `PASS / PRACTICE_PDF_COMPLETE`

canonical artifacts:
- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice.pdf`
- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice_pdf_qa.md`

QA:
- PDF blob SHA: `405383decbd8db2e9af66d314699081ccf1ec0a8`
- source blob SHA: `ab834c6c1b640ad2f5e06d49370672a1d5bd14fd`
- A4縦: `9頁`
- PDFium: `9 / 9 PASS`
- Poppler: `9 / 9 PASS`
- 空白頁・ページ端・置換文字: `0件`
- 一次8問＋二次4問: `12 / 12 PASS`
- 固定5問・27答案要素: `27 / 27 PASS`
- 一次: `15 / 15 PASS`
- 二次: `12 / 12 PASS`
- SPEC固定8項目: `8 / 8 PASS`
- 固定EXAM_ALIGNMENT変更: `0件`
- 未確認実車値の真値化: `0件`
- Topic 32〜34先取り: `0件`
- Topic 21一般式変更: `0件`
- exact blocker: `0件`

## Topic 31 練習source
"""
              if old not in s:
                  raise SystemExit('STATUS exact state mismatch; stop without guessing')
              s = s.replace(old, new, 1)
              status.write_text(s, encoding='utf-8')

          handoff = Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          h = handoff.read_text(encoding='utf-8')
          if '現在地は `topic_31_practice_pdf_complete`' not in h:
              old = """現在地は `topic_31_practice_source_complete`。Topic 31 `補助電源変換器` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QAまで完了。次は練習PDF＋PDF QA。

## Topic 31 練習source完了記録
"""
              new = """現在地は `topic_31_practice_pdf_complete`。Topic 31 `補助電源変換器` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了。次はPowerPoint＋render QA。

## Topic 31 練習PDF完了記録

判定: `PASS / PRACTICE_PDF_COMPLETE`

canonical artifacts:
- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice.pdf`
- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice_pdf_qa.md`

QA:
- PDF blob `405383decbd8db2e9af66d314699081ccf1ec0a8`
- source blob `ab834c6c1b640ad2f5e06d49370672a1d5bd14fd`
- A4縦 `9頁`
- PDFium `9 / 9 PASS`
- Poppler `9 / 9 PASS`
- 空白頁・ページ端・置換文字 `0件`
- 一次8問＋二次4問 `12 / 12 PASS`
- 固定5問・27答案要素 `27 / 27 PASS`
- 一次 `15 / 15 PASS`
- 二次 `12 / 12 PASS`
- SPEC固定8項目 `8 / 8 PASS`
- 固定EXAM_ALIGNMENT変更 `0件`
- 未確認実車値の真値化 `0件`
- Topic 32〜34先取り `0件`
- Topic 21一般式変更 `0件`
- exact blocker `0件`

## Topic 31 練習source完了記録
"""
              if old not in h:
                  raise SystemExit('HANDOFF exact state mismatch; stop without guessing')
              h = h.replace(old, new, 1)

              old2 = """2. 固定EXAM_ALIGNMENT、解説source、解説PDF、練習sourceを変更せず、Topic 31練習PDFを生成する。
3. PDFはA4、全文、数式、表、ページ端、置換文字、空白頁を確認し、可能な複数レンダラで全頁QAする。
4. 固定5問・27答案要素、SPEC 8項目、一次8問＋二次4問がPDFへ欠落なく入ったことを確認する。
5. R2二次問2の変圧器固有条件、H22のPV/MPPT、R5能動フィルタ実車搭載など固定境界を維持する。
6. 練習PDF QAがPASSしてからPowerPointへ進む。
7. 仕様不整合・確定不能事項が出た場合はexact blockerを記録して停止する。
"""
              new2 = """2. 固定EXAM_ALIGNMENT、解説source/PDF、練習source/PDFを変更せず、Topic 31 PowerPointを作成する。
3. 固定5問・27答案要素、SPEC 8項目を可視化へ接続し、16:9全スライドをrender QAする。
4. 数式・図・表・文字切れ・重なり・置換文字を確認し、未確認実車値を真値化しない。
5. R2二次問2の変圧器固有条件、H22のPV/MPPT、R5能動フィルタ実車搭載など固定境界を維持する。
6. PowerPoint QAがPASSしてからclean blind candidate固定へ進む。
7. 仕様不整合・確定不能事項が出た場合はexact blockerを記録して停止する。
"""
              if old2 not in h:
                  raise SystemExit('HANDOFF next-step mismatch; stop without guessing')
              h = h.replace(old2, new2, 1)
              handoff.write_text(h, encoding='utf-8')
          PY

          rm -f .github/workflows/topic31-practice-pdf-build.yml
          rm -f .github/workflows/topic31-practice-pdf-finalize.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS" "$HANDOFF" .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'denken: mark Topic 31 practice PDF complete'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main