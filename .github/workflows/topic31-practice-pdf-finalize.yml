name: Topic 31 practice PDF finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic31-practice-pdf-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest main and finalize state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice.pdf'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice_pdf_qa.md'
          STATUS='denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'
          HANDOFF='denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md'
          test -f "$PDF"
          test -f "$QA"
          test "$(git hash-object "$PDF")" = '405383decbd8db2e9af66d314699081ccf1ec0a8'
          grep -Fq 'PASS / PRACTICE_PDF_COMPLETE' "$QA"
          grep -Fq '27 / 27 connected' "$QA"
          grep -Fq '8 / 8 covered' "$QA"
          grep -Fq 'exact blocker: `0件`' "$QA"
          python - <<'PY'
          from pathlib import Path

          def replace_exact(lines, old, new):
              try:
                  i = lines.index(old)
              except ValueError:
                  raise SystemExit(f'exact state mismatch: {old}')
              lines[i] = new

          status = Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md')
          sl = status.read_text(encoding='utf-8').splitlines()
          if '- current_status: `topic_31_practice_pdf_complete`' not in sl:
              replace_exact(sl, '- current_status: `topic_31_practice_source_complete`', '- current_status: `topic_31_practice_pdf_complete`')
              replace_exact(sl, '- next_start: Topic 31練習PDFを生成し、固定5問・27答案要素とSPEC 8項目を維持してPDF QAする', '- next_start: Topic 31 PowerPointを作成し、固定5問・27答案要素とSPEC 8項目を維持してrender QAする')
              replace_exact(sl, 'Topic 01〜30は `PASS / completed`。完成数 `30 / 39`。Topic 31は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QAまで完了。', 'Topic 01〜30は `PASS / completed`。完成数 `30 / 39`。Topic 31は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了。')
              marker = '## Topic 31 練習source'
              i = sl.index(marker)
              block = [
                  '## Topic 31 練習PDF',
                  '',
                  '判定: `PASS / PRACTICE_PDF_COMPLETE`',
                  '',
                  'canonical artifacts:',
                  '- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice.pdf`',
                  '- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice_pdf_qa.md`',
                  '',
                  'QA:',
                  '- PDF blob SHA: `405383decbd8db2e9af66d314699081ccf1ec0a8`',
                  '- source blob SHA: `ab834c6c1b640ad2f5e06d49370672a1d5bd14fd`',
                  '- A4縦: `9頁`',
                  '- PDFium: `9 / 9 PASS`',
                  '- Poppler: `9 / 9 PASS`',
                  '- 空白頁・ページ端・置換文字: `0件`',
                  '- 一次8問＋二次4問: `12 / 12 PASS`',
                  '- 固定5問・27答案要素: `27 / 27 PASS`',
                  '- 一次: `15 / 15 PASS`',
                  '- 二次: `12 / 12 PASS`',
                  '- SPEC固定8項目: `8 / 8 PASS`',
                  '- 固定EXAM_ALIGNMENT変更: `0件`',
                  '- 未確認実車値の真値化: `0件`',
                  '- Topic 32〜34先取り: `0件`',
                  '- Topic 21一般式変更: `0件`',
                  '- exact blocker: `0件`',
                  '',
              ]
              sl[i:i] = block
              status.write_text('\n'.join(sl) + '\n', encoding='utf-8')

          handoff = Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          hl = handoff.read_text(encoding='utf-8').splitlines()
          if '現在地は `topic_31_practice_pdf_complete`。Topic 31 `補助電源変換器` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了。次はPowerPoint＋render QA。' not in hl:
              replace_exact(hl, '現在地は `topic_31_practice_source_complete`。Topic 31 `補助電源変換器` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QAまで完了。次は練習PDF＋PDF QA。', '現在地は `topic_31_practice_pdf_complete`。Topic 31 `補助電源変換器` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了。次はPowerPoint＋render QA。')
              marker = '## Topic 31 練習source完了記録'
              i = hl.index(marker)
              block = [
                  '## Topic 31 練習PDF完了記録',
                  '',
                  '判定: `PASS / PRACTICE_PDF_COMPLETE`',
                  '',
                  'canonical artifacts:',
                  '- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice.pdf`',
                  '- `topics/31_auxiliary_power_converter/31_auxiliary_power_converter_practice_pdf_qa.md`',
                  '',
                  'QA:',
                  '- PDF blob `405383decbd8db2e9af66d314699081ccf1ec0a8`',
                  '- source blob `ab834c6c1b640ad2f5e06d49370672a1d5bd14fd`',
                  '- A4縦 `9頁`',
                  '- PDFium `9 / 9 PASS`',
                  '- Poppler `9 / 9 PASS`',
                  '- 空白頁・ページ端・置換文字 `0件`',
                  '- 一次8問＋二次4問 `12 / 12 PASS`',
                  '- 固定5問・27答案要素 `27 / 27 PASS`',
                  '- 一次 `15 / 15 PASS`',
                  '- 二次 `12 / 12 PASS`',
                  '- SPEC固定8項目 `8 / 8 PASS`',
                  '- 固定EXAM_ALIGNMENT変更 `0件`',
                  '- 未確認実車値の真値化 `0件`',
                  '- Topic 32〜34先取り `0件`',
                  '- Topic 21一般式変更 `0件`',
                  '- exact blocker `0件`',
                  '',
              ]
              hl[i:i] = block
              replace_exact(hl, '2. 固定EXAM_ALIGNMENT、解説source、解説PDF、練習sourceを変更せず、Topic 31練習PDFを生成する。', '2. 固定EXAM_ALIGNMENT、解説source/PDF、練習source/PDFを変更せず、Topic 31 PowerPointを作成する。')
              replace_exact(hl, '3. PDFはA4、全文、数式、表、ページ端、置換文字、空白頁を確認し、可能な複数レンダラで全頁QAする。', '3. 固定5問・27答案要素、SPEC 8項目を可視化へ接続し、16:9全スライドをrender QAする。')
              replace_exact(hl, '4. 固定5問・27答案要素、SPEC 8項目、一次8問＋二次4問がPDFへ欠落なく入ったことを確認する。', '4. 数式・図・表・文字切れ・重なり・置換文字を確認し、未確認実車値を真値化しない。')
              replace_exact(hl, '6. 練習PDF QAがPASSしてからPowerPointへ進む。', '6. PowerPoint QAがPASSしてからclean blind candidate固定へ進む。')
              handoff.write_text('\n'.join(hl) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/topic31-practice-pdf-build.yml
          rm -f .github/workflows/topic31-practice-pdf-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS" "$HANDOFF" .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'denken: mark Topic 31 practice PDF complete'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main