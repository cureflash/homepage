name: Power Color runtime promotion once

on:
  push:
    branches:
      - 'automation/power-color-pccs-runtime-promotion-20260831-1745'
    paths:
      - '.github/workflows/power-color-runtime-promotion-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/power-color-pccs-runtime-promotion-20260831-1745
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified PCCS records and gates
        run: node qualifications/color-certification/scripts/promote-complementary-runtime-once.cjs
      - name: Run Power Color tests
        working-directory: qualifications/color-certification
        run: npm test
      - name: Commit promoted runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/power-color-runtime-promotion-once.yml
          git rm qualifications/color-certification/scripts/promote-complementary-runtime-once.cjs
          git add qualifications/color-certification/data/grade3-runtime.json
          git add qualifications/color-certification/tests/color-bank.test.js
          git add qualifications/color-certification/tests/conventional-corpus-gate.test.js
          git add qualifications/color-certification/tests/pccs-complementary-hue-runtime-promotion.test.js
          git add docs/power-color/STATUS.json
          git add docs/power-color/20_EXECUTION_PLAN.md
          git add docs/power-color/90_HANDOFF.md
          git commit -m 'power-color: promote PCCS complementary hue runtime'
          git push origin HEAD:automation/power-color-pccs-runtime-promotion-20260831-1745
