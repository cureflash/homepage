name: Topic15 PDF transfer

on:
  push:
    paths:
      - '.tmp/topic15_pdf/**'
      - '.github/workflows/topic15-pdf-transfer.yml'

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify
        shell: bash
        run: |
          set -euo pipefail
          target='denken-shinkansen/07_shinkansen_machine_2/topics/15_auxiliary_motor_design/15_auxiliary_motor_design_practice.pdf'
          mkdir -p "$(dirname "$target")"
          cat .tmp/topic15_pdf/part1 .tmp/topic15_pdf/part2 .tmp/topic15_pdf/part3 .tmp/topic15_pdf/part4 .tmp/topic15_pdf/part5 | base64 -d > "$target"
          test "$(sha256sum "$target" | awk '{print $1}')" = 'a8cfcf15d58c2d93100479c7a6b6a627b6ccf01b8a36ac3659ba665c8b8f8de5'
          rm -rf .tmp/topic15_pdf
          rm .github/workflows/topic15-pdf-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target" .tmp/topic15_pdf .github/workflows/topic15-pdf-transfer.yml
          git commit -m 'Add Topic 15 practice PDF'
          git push
