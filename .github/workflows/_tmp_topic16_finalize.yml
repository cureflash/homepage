name: Temporary Topic 16 finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_topic16_finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile, QA, and finalize Topic 16
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          series='denken-shinkansen/06_shinkansen_power_2'
          topic="$series/topics/16_short_circuit"
          pptx="$topic/16_short_circuit_images.pptx"
          exp_pdf="$topic/16_short_circuit_explanation.pdf"
          prac_pdf="$topic/16_short_circuit_practice.pdf"
          workflow='.github/workflows/_tmp_topic16_finalize.yml'

          # Reconcile with any concurrent worker before writing.
          if grep -q 'current_status: `topic_16_completed`' "$series/STATUS.md"; then
            git rm -f "$workflow"
            git config user.name 'denken-power2-bot'
            git config user.email '89366952+cureflash@users.noreply.github.com'
            git commit -m 'Cleanup temporary Topic 16 finalize workflow'
            git push origin HEAD:main
            exit 0
          fi

          # Exact artifact identities established on current main.
          test "$(git hash-object "$pptx")" = '4aee9bedf079ed9a44fe789562e2192fc00728f3'
          test "$(wc -c < "$pptx")" = '38384'
          test "$(git hash-object "$exp_pdf")" = '626d9098ccf7453f2439b1ffc3df50c3bbdd3b5b'
          test "$(git hash-object "$prac_pdf")" = '626a7015e60d7c968128277e5ff18e9039df74fc'

          python -m pip install -q python-pptx
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          from pptx import Presentation

          p=Path('denken-shinkansen/06_shinkansen_power_2/topics/16_short_circuit/16_short_circuit_images.pptx')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          prs=Presentation(p)
          assert len(prs.slides)==6
          text='\n'.join(sh.text for sl in prs.slides for sh in sl.shapes if hasattr(sh,'text_frame'))
          required=['電磁誘導障害','遮断容量','BTB','電圧階級上昇','故障前','6.08 kA','10.3 kA','23/23']
          for term in required:
              assert term in text, term
          print('pptx-zip-python-pptx-qa=PASS')
          print('sha256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils >/dev/null
          fi
          rm -rf /tmp/topic16-final && mkdir -p /tmp/topic16-final
          libreoffice --headless --convert-to pdf --outdir /tmp/topic16-final "$pptx" >/tmp/topic16-lo.txt 2>&1
          test "$(pdfinfo /tmp/topic16-final/16_short_circuit_images.pdf | awk '/^Pages:/ {print $2}')" = '6'
          pdftotext /tmp/topic16-final/16_short_circuit_images.pdf /tmp/topic16-final.txt
          grep -q '23/23' /tmp/topic16-final.txt
          grep -q '6.08 kA' /tmp/topic16-final.txt
          grep -q '10.3 kA' /tmp/topic16-final.txt
          echo 'pptx-libreoffice-render-qa=PASS pages=6'

          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          root=Path('denken-shinkansen/06_shinkansen_power_2')
          topic=root/'topics/16_short_circuit'
          pptx=topic/'16_short_circuit_images.pptx'
          sha256=hashlib.sha256(pptx.read_bytes()).hexdigest()
          base_main=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()

          # Sync the stale top-level state in the main topic source without changing EXAM_ALIGNMENT or technical scope.
          src=topic/'16_short_circuit.md'
          text=src.read_text(encoding='utf-8')
          old="""## 状態\n\n`topic_16_preproduction_blind_complete`\n\n制作前EXAM_ALIGNMENTと制作前blind独立再解答を完了した。正式品質ゲート対象は一次2問＋二次3問の固定5問・23答案要素。平成21年度二次「電力・管理」問6はclean rerunで2 / 2 PASSとなり、制作前blindは23 / 23答案要素すべてPASS。解説source/PDF、練習source/PDF、PowerPointは未着手。"""
          new="""## 状態\n\n`topic_16_completed`\n\n制作前EXAM_ALIGNMENT、制作前blind独立再解答、解説source/PDF、練習source/PDF、PowerPoint、learner-facing補正、補正後完成後blind clean rerun、Webカタログ登録、現行exact artifact QA、最終QAまで完了した。正式品質ゲート対象は一次2問＋二次3問の固定5問・23答案要素で、制作前blind・完成後clean blind・公式標準解答照合はいずれも23 / 23 PASS。固定EXAM_ALIGNMENTとTopic 16範囲は変更していない。"""
          if old not in text:
              raise SystemExit('exact blocker: stale state block in 16_short_circuit.md did not match expected canonical text')
          src.write_text(text.replace(old,new,1), encoding='utf-8')

