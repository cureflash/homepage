name: Temporary Topic 16 finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_topic16_finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile, QA, and finalize Topic 16
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          series='denken-shinkansen/06_shinkansen_power_2'
          topic="$series/topics/16_short_circuit"
          workflow='.github/workflows/_tmp_topic16_finalize.yml'
          git config user.name 'denken-power2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          if grep -q 'current_status: `topic_16_completed`' "$series/STATUS.md"; then
            git rm -f "$workflow"
            git commit -m 'Cleanup temporary Topic 16 finalize workflow'
            git push origin HEAD:main
            exit 0
          fi
          python -m pip install -q python-pptx
          echo '' | base64 -d > /tmp/topic16_finalize.py
          python /tmp/topic16_finalize.py
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils >/dev/null
          fi
          rm -rf /tmp/topic16-final && mkdir -p /tmp/topic16-final
          libreoffice --headless --convert-to pdf --outdir /tmp/topic16-final "$topic/16_short_circuit_images.pptx" >/tmp/topic16-lo.txt 2>&1
          test "$(pdfinfo /tmp/topic16-final/16_short_circuit_images.pdf | awk '/^Pages:/ {print $2}')" = '6'
          pdftotext /tmp/topic16-final/16_short_circuit_images.pdf /tmp/topic16-final.txt
          grep -q '23/23' /tmp/topic16-final.txt
          grep -q '6.08 kA' /tmp/topic16-final.txt
          grep -q '10.3 kA' /tmp/topic16-final.txt
          git add "$series/STATUS.md" "$series/HANDOFF.md" "$topic/16_short_circuit.md" "$topic/16_short_circuit_powerpoint_qa.md" "$topic/16_short_circuit_final_qa.md"
          git rm -f "$workflow"
          git commit -m 'Complete power2 Topic 16 after exact artifact QA'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
