name: Topic34 explanation PDF temporary QA
on:
  push:
    paths:
      - '.github/workflows/topic34-explanation-pdf-qa-temp.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk
          pip install 'pypdfium2==4.30.0' 'Pillow==11.3.0'
      - name: Render and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, hashlib, re, json
          from PIL import Image, ImageChops
          import pypdfium2 as pdfium
          base=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics')
          pdf=base/'34_compressor_pump_fan_load_characteristics_explanation.pdf'
          tmp=Path('/tmp/topic34_pdf_qa'); tmp.mkdir(exist_ok=True)
          pop=tmp/'poppler'; pop.mkdir(exist_ok=True)
          pui=tmp/'pdfium'; pui.mkdir(exist_ok=True)
          info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace')
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          sz=re.search(r'^Page size:\s+([0-9.]+) x ([0-9.]+) pts',info,re.M)
          wpt,hpt=map(float,sz.groups())
          a4=abs(wpt-595.276)<1 and abs(hpt-841.89)<1
          txtpath=tmp/'text.txt'
          subprocess.run(['pdftotext','-layout',str(pdf),str(txtpath)],check=True)
          text=txtpath.read_text(encoding='utf-8',errors='replace').replace('\u0332','_')
          compact=re.sub(r'\s+','',text)
          urep=text.count('\ufffd')
          checks=['3V_1^2','s>0','停動トルク','二次抵抗','T∝s','誘導電動機','s<0','ブラシ','IGBT','V/f','回転角速度','過負荷耐量','定常状態','トルク成分','滑り角周波数','N_s=120f/p','すべり','定格トルク','P_c2','固定損','小すべり','E_d=1.35V_LL','I_d=P_d/E_d','I_1=P_d/(sqrt(3)V_LL)','V_ph,peak=mE_d/2','V_LL,rms','V/f']
          present=[re.sub(r'\s+','',s) in compact for s in checks]
          fixed=sum(present)
          specs=['電動機出力','負荷トルク','ポンプ動力','ファン動力','回転速度','効率','インバータ制御']
          spec_ok=sum(s in text for s in specs)
          examples=['95.5N·m','1500min^-1','4.0%','199N·m','33.3kW','7.59kW','8.63kW','0.75']
          ex_ok=sum(re.sub(r'\s+','',s) in compact for s in examples)
          subprocess.run(['pdftoppm','-png','-r','160',str(pdf),str(pop/'page')],check=True,stdout=subprocess.DEVNULL)
          doc=pdfium.PdfDocument(str(pdf)); scale=160/72
          for i in range(len(doc)):
              doc[i].render(scale=scale).to_pil().convert('RGB').save(pui/f'page-{i+1:02d}.png')
          popimgs=sorted(pop.glob('page-*.png')); puiimgs=sorted(pui.glob('page-*.png'))
          if len(popimgs)!=pages or len(puiimgs)!=pages:
              raise SystemExit('render page count mismatch')
          blank=edge=parity_bad=0; bounds=[]; parity=[]
          for a,b in zip(popimgs,puiimgs):
              im1=Image.open(a).convert('L'); im2=Image.open(b).convert('L')
              mask=im2.point(lambda p: 255 if p<245 else 0)
              bb=mask.getbbox(); bounds.append(bb)
              if not bb:
                  blank+=1
              else:
                  l,t,r,bt=bb; W,H=im2.size
                  if l<12 or t<12 or r>W-12 or bt>H-12:
                      edge+=1
              if im1.size!=im2.size:
                  im1=im1.resize(im2.size)
              hist=ImageChops.difference(im1,im2).histogram(); total=im2.size[0]*im2.size[1]
              changed=sum(hist[35:])/total*100; parity.append(round(changed,4))
              if changed>2.0:
                  parity_bad+=1
          metrics={'a4':a4,'pages':pages,'urep':urep,'blank':blank,'edge':edge,'parity_bad':parity_bad,'parity_pct':parity,'bounds':bounds,'fixed':fixed,'fixed_each':present,'spec':spec_ok,'examples':ex_ok,'text_chars':len(text),'sha256':hashlib.sha256(pdf.read_bytes()).hexdigest()}
          print('TOPIC34_QA='+json.dumps(metrics,ensure_ascii=False))
          if not (a4 and pages>0 and urep==0 and blank==0 and edge==0 and parity_bad==0 and fixed==27 and spec_ok==7 and ex_ok==8):
              raise SystemExit(1)
          PY
