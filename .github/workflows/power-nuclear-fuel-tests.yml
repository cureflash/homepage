name: Power Nuclear Fuel tests

on:
  pull_request:
    paths:
      - 'qualifications/nuclear-fuel/**'
      - 'subjects/english/power-toeic/js/core/session.js'
      - 'subjects/english/power-toeic/js/core/workout-builder.js'
      - 'subjects/english/power-toeic/js/data/question-bank-adapter.js'
      - 'qualifications/color-certification/js/color-choice-renderer.js'
  push:
    branches: [main]
    paths:
      - 'qualifications/nuclear-fuel/**'
      - '.github/workflows/power-nuclear-fuel-tests.yml'
      - 'subjects/english/power-toeic/js/core/session.js'
      - 'subjects/english/power-toeic/js/core/workout-builder.js'
      - 'subjects/english/power-toeic/js/data/question-bank-adapter.js'
      - 'qualifications/color-certification/js/color-choice-renderer.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nuclear fuel quiz tests
        working-directory: qualifications/nuclear-fuel
        run: npm test
