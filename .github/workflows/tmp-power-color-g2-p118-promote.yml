name: Temporary Power Color Grade 2 p118 promotion

on:
  push:
    branches:
      - agent/power-color-g2-p118-regional-promotion-20260903
    paths:
      - .automation-trigger-power-color-g2-p118

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/power-color-g2-p118-regional-promotion-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Promote verified batch record-identically
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runtimePath = 'qualifications/color-certification/data/grade2-runtime.json';
          const authoringPath = 'qualifications/color-certification/data/grade2-authoring-landscape-regional-color-context-0001-0012.json';
          const testPath = 'qualifications/color-certification/tests/grade2-runtime-promotion.test.js';
          const runtime = JSON.parse(fs.readFileSync(runtimePath, 'utf8'));
          const authoring = JSON.parse(fs.readFileSync(authoringPath, 'utf8'));
          if (authoring.skill.id !== 'pc2.landscape.regional_color_context') throw new Error('unexpected skill');
          if (authoring.questions.length !== 12) throw new Error('expected 12 authoring questions');
          if (!authoring.questions.every(q => q.validationStatus === 'verified')) throw new Error('authoring batch not fully verified');
          if (runtime.skills.some(s => s.id === authoring.skill.id)) throw new Error('skill already promoted');
          const existingIds = new Set(runtime.questions.map(q => q.id));
          if (authoring.questions.some(q => existingIds.has(q.id))) throw new Error('question id already promoted');
          runtime.skills.push(authoring.skill);
          runtime.questions.push(...authoring.questions);
          if (runtime.skills.length !== 24 || runtime.questions.length !== 288) throw new Error(`unexpected promoted totals ${runtime.skills.length}/${runtime.questions.length}`);
          fs.writeFileSync(runtimePath, JSON.stringify(runtime, null, 2) + '\n');

          let test = fs.readFileSync(testPath, 'utf8');
          const importAnchor = "const landscapeColorDesignHarmonyRole = JSON.parse(await readFile(new URL('../data/grade2-authoring-landscape-color-design-harmony-role-0001-0012.json', import.meta.url), 'utf8'));";
          const importLine = "const landscapeRegionalColorContext = JSON.parse(await readFile(new URL('../data/grade2-authoring-landscape-regional-color-context-0001-0012.json', import.meta.url), 'utf8'));";
          if (!test.includes(importLine)) test = test.replace(importAnchor, `${importAnchor}\n${importLine}`);
          const oldBatches = 'const batches = [foundation, triad, munsell, naturalComplex, dominant, toneOnTone, toneInTone, tonal, camaieu, bicolorTricolor, hueCircleDivision, imageSchemeKeywords, rgbCmykModels, colorManagementProfiles, imageBasics, basicTrend, interiorColorPlanning, interiorZoning, interiorElementColorRoles, interiorStyleNames, landscapePublicNature, landscapeElementExamples, landscapeColorDesignHarmonyRole];';
          const newBatches = 'const batches = [foundation, triad, munsell, naturalComplex, dominant, toneOnTone, toneInTone, tonal, camaieu, bicolorTricolor, hueCircleDivision, imageSchemeKeywords, rgbCmykModels, colorManagementProfiles, imageBasics, basicTrend, interiorColorPlanning, interiorZoning, interiorElementColorRoles, interiorStyleNames, landscapePublicNature, landscapeElementExamples, landscapeColorDesignHarmonyRole, landscapeRegionalColorContext];';
          if (!test.includes(newBatches)) {
            if (!test.includes(oldBatches)) throw new Error('batches anchor missing');
            test = test.replace(oldBatches, newBatches);
          }
          test = test.replace('assert.equal(runtime.questions.length, 276);', 'assert.equal(runtime.questions.length, 288);');
          test = test.replace("assert.equal(runtime.questions.filter((q) => q.validationStatus === 'verified').length, 276);", "assert.equal(runtime.questions.filter((q) => q.validationStatus === 'verified').length, 288);");
          test = test.replace('totalCount: 69,', 'totalCount: 72,');
          test = test.replace('assert.equal(selectQuestionIds({ repository, recipe }).length, 69);', 'assert.equal(selectQuestionIds({ repository, recipe }).length, 72);');
          fs.writeFileSync(testPath, test);
          NODE
      - name: Run Grade 2 promotion gate
        run: node --test qualifications/color-certification/tests/grade2-runtime-promotion.test.js
      - name: Commit deterministic promotion
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualifications/color-certification/data/grade2-runtime.json qualifications/color-certification/tests/grade2-runtime-promotion.test.js
          git commit -m "Promote Grade 2 Landscape p118 regional color runtime"
          git push origin HEAD:agent/power-color-g2-p118-regional-promotion-20260903
