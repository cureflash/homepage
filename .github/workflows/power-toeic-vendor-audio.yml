name: Power TOEIC Vendor Audio

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/power-toeic-vendor-audio.yml'
      - 'subjects/english/power-toeic-ios/**'

permissions:
  contents: write

jobs:
  vendor-audio:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download exact OtoLogic sources
        shell: bash
        run: |
          set -euo pipefail
          dest='subjects/english/power-toeic-ios/Sources/PowerTOEIC/Resources/Audio'
          mkdir -p "$dest"

          curl --fail --location --retry 3 \
            'https://otologic.jp/sounds/se/pre2/Quiz-Ding_Dong05-1(Fast-Short).mp3' \
            --output "$dest/otologic_correct.mp3"
          curl --fail --location --retry 3 \
            'https://otologic.jp/sounds/se/pre2/Quiz-Buzzer05-1(Mid).mp3' \
            --output "$dest/otologic_incorrect.mp3"
          curl --fail --location --retry 3 \
            'https://otologic.jp/sounds/se/pre2/Inspiration11-1(Low).mp3' \
            --output "$dest/otologic_inspiration.mp3"

      - name: Verify against connected Drive copies
        shell: bash
        run: |
          set -euo pipefail
          cd subjects/english/power-toeic-ios/Sources/PowerTOEIC/Resources/Audio
          cat > /tmp/power-toeic-audio.sha256 <<'EOF'
          085e5a4a3fe2669ad1378423c412f7e76cc6b2b573b3081380207f5d8b8ea2fc  otologic_correct.mp3
          c5141a298f48e63c4606ab34b189590cd0f64611ae9546463511d63da7deb2eb  otologic_incorrect.mp3
          4c61471b681bdb407fcdaa183e6881aaa76be05887accf761f73b0454f0f5f66a  otologic_inspiration.mp3
          EOF
          sha256sum -c /tmp/power-toeic-audio.sha256

      - name: Commit verified resources to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- subjects/english/power-toeic-ios/Sources/PowerTOEIC/Resources/Audio)" ]; then
            echo 'Verified audio resources already match the repository.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subjects/english/power-toeic-ios/Sources/PowerTOEIC/Resources/Audio
          git commit -m 'chore(power-toeic): vendor verified OtoLogic audio'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
