name: Topic 22 PPTX build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Run Topic 22 PPTX builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-pptx
      - run: python .github/tmp_topic22/build.py
      - run: |
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/07_shinkansen_machine_2/topics/22_integrated_route_simulation/22_integrated_route_simulation_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==4
          assert abs((prs.slide_width/prs.slide_height)-(16/9)) < 1e-5
          for slide in prs.slides:
              for sh in slide.shapes:
                  assert sh.left >= 0 and sh.top >= 0
                  assert sh.left + sh.width <= prs.slide_width
                  assert sh.top + sh.height <= prs.slide_height
          print('PPTX structural QA PASS: 4 slides, 16:9, no out-of-bounds shapes')
          PY
          unzip -t denken-shinkansen/07_shinkansen_machine_2/topics/22_integrated_route_simulation/22_integrated_route_simulation_images.pptx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denken-shinkansen/07_shinkansen_machine_2/topics/22_integrated_route_simulation/22_integrated_route_simulation_images.pptx
          git commit -m 'Add Topic 22 image PowerPoint'
          git push
