name: tmp-vehicle2-topic27-ppt

on:
  push:

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Stage Topic 27 PowerPoint workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate canonical Topic 27 PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          dir='denken-shinkansen/05_shinkansen_vehicle_2/topics/27_l0_linear_synchronous_motor'
          gen="$dir/_tmp_build_topic27.js"
          p="$dir/27_l0_linear_synchronous_motor_images.pptx"
          metrics="$dir/_tmp_topic27_ppt_metrics.txt"

          test -f "$gen"
          grep -q 'current_status: `topic_27_practice_pdf_complete`' 'denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'

          mkdir -p /tmp/topic27_node
          npm install --prefix /tmp/topic27_node --no-save pptxgenjs@4.0.0 >/dev/null 2>&1
          NODE_PATH=/tmp/topic27_node/node_modules TOPIC27_OUT="$p" node "$gen"

          unzip -t "$p" >/dev/null
          python -m pip install -q python-pptx
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/05_shinkansen_vehicle_2/topics/27_l0_linear_synchronous_motor/27_l0_linear_synchronous_motor_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==6
          assert abs(prs.slide_width/prs.slide_height - 16/9) < 1e-5
          sw,sh=prs.slide_width,prs.slide_height
          texts=[]
          for i,slide in enumerate(prs.slides,1):
              for shape in slide.shapes:
                  assert shape.left >= 0 and shape.top >= 0, (i,shape.name)
                  assert shape.left + shape.width <= sw + 2, (i,shape.name)
                  assert shape.top + shape.height <= sh + 2, (i,shape.name)
                  if hasattr(shape,'text'): texts.append(shape.text)
          all_text='\n'.join(texts)
          required=['Topic 27','N_s = 120f / P','v_s = fλ = 2τf','X_s = X_a + X_l','Z_s(p.u.) = 1 / K','周波数 f [Hz]','極ピッチ τ [m]','R7 一次','R6 一次','H29 一次','H21 一次','R6 二次','23/23','必須7項目：7/7','指定可視化：2/2','Topic 28','48.0 / 48.1 N·m']
          for token in required:
              assert token in all_text, token
          assert '\ufffd' not in all_text
          print('package/open/geometry/content PASS, slides=6')
          PY

          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          fi
          rm -rf /tmp/topic27_render && mkdir -p /tmp/topic27_render
          libreoffice --headless --convert-to pdf --outdir /tmp/topic27_render "$p" >/tmp/topic27_lo.txt 2>&1
          pdf='/tmp/topic27_render/27_l0_linear_synchronous_motor_images.pdf'
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = '6'
          pdftotext -layout "$pdf" /tmp/topic27.txt
          for token in 'Topic 27' '120 m/s' '0.909 p.u.' 'R6 二次' '48.0 / 48.1 N·m'; do grep -q "$token" /tmp/topic27.txt; done
          ! grep -q $'\xef\xbf\xbd' /tmp/topic27.txt

          size=$(stat -c '%s' "$p")
          hash=$(sha256sum "$p" | awk '{print $1}')
          textbytes=$(stat -c '%s' /tmp/topic27.txt)
          printf 'size=%s\nsha256=%s\nslides=6\nrender_pages=6\npdftotext=PASS\ntext_bytes=%s\n' "$size" "$hash" "$textbytes" > "$metrics"

          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add "$p" "$metrics"
          git commit -m 'Rebuild Topic 27 PowerPoint canonical artifact'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
