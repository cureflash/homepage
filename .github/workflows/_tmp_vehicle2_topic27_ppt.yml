name: tmp-vehicle2-topic27-progress-sync

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Run Topic 27 progress sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync records
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python denken-shinkansen/05_shinkansen_vehicle_2/topics/27_l0_linear_synchronous_motor/_tmp_sync_topic27_progress.py
          git diff --check
          grep -q 'current_status: `topic_27_powerpoint_complete`' denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md
          grep -q 'PASS / POWERPOINT_COMPLETE' denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md
          grep -q '現在地は `topic_27_powerpoint_complete`' denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git commit -m 'Record Topic 27 PowerPoint completion'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
