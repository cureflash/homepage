name: finalize-vehicle2-topic19-practice-pdf
on:
  push:
    paths:
      - '.github/tmp/build_vehicle2_topic19_practice_pdf.py'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf && python -m pip install --disable-pip-version-check reportlab pypdfium2 pillow
      - name: Build and record canonical practice PDF
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python .github/tmp/build_vehicle2_topic19_practice_pdf.py
          rm -f .github/tmp/build_vehicle2_topic19_practice_pdf.py .github/workflows/finalize_vehicle2_topic19_practice_pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'denken vehicle2: add Topic 19 practice PDF and QA'
          git pull --rebase origin main
          git push origin HEAD:main
