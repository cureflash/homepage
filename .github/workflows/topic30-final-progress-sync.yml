name: Topic 30 final progress sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic30-final-progress-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile latest main and sync Topic 30 completion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          status = Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md')
          s = status.read_text(encoding='utf-8')
          s = s.replace('- exam_aligned_completed_topics: `29 / 39`', '- exam_aligned_completed_topics: `30 / 39`')
          s = s.replace('- current_status: `topic_30_powerpoint_complete`', '- current_status: `topic_31_exam_alignment_pending`')
          s = s.replace('- last_completed_topic: `29 L0系③ 超電導磁気浮上の電磁力`', '- last_completed_topic: `30 L0系④ 誘導集電・非接触電力伝送`')
          s = s.replace('- active_topic: `30 L0系④ 誘導集電・非接触電力伝送`', '- active_topic: `31 補助電源変換器`')
          s = s.replace('- next_start: Topic 30教材完成状態をreconcileし、fresh clean blind独立再解答のcandidate固定工程へ進む', '- next_start: Topic 31の制作前EXAM_ALIGNMENT。公式過去問を直近年度から一次・二次合わせ原則5問以上調査し、SPECのインバータ・コンバータ・三相負荷・力率・高調波・変換損失・効率・負荷変動へ逆算して固定する')
          old_summary = 'Topic 01〜29は `PASS / completed`。完成数 `29 / 39`。Topic 30は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QA、解説画像PowerPoint＋QAまで完了した。'
          new_summary = 'Topic 01〜30は `PASS / completed`。完成数 `30 / 39`。Topic 30はfresh clean blind独立再解答まで完了し、一次20/20・二次5/5・合計25/25で公式標準解答と一致した。次はTopic 31の制作前EXAM_ALIGNMENT。'
          s = s.replace(old_summary, new_summary)
          if '## Topic 30 最終結果\n' not in s:
              marker = '## Topic 30 PowerPoint\n'
              assert marker in s
              section = '''## Topic 30 最終結果\n\n判定: `PASS / COMPLETED`\n\nclean blind:\n- candidate: `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_clean_blind_candidate.md`\n- candidate blob SHA: `33b53e26f54b8619da9819e2ce48cb2250ad13b1`\n- candidate lock commit: `a9295e2a018f4d75d3b99ac7c5c6c9044528c8e7`\n- compare QA: `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_clean_blind_compare_qa.md`\n- final QA commit: `77a747090260a9b517fdb0b5d112ce7e79728391`\n- candidate固定後修正: `0件`\n- 一次: `20 / 20 PASS`\n- 二次: `5 / 5 PASS`\n- 合計: `25 / 25 PASS`\n- 公式照合不一致: `0件`\n- SPEC必須7項目: `7 / 7 PASS`\n- 指定3可視化: `3 / 3 PASS`\n- 固定EXAM_ALIGNMENT変更: `0件`\n- 未確認L0系実車値の真値化: `0件`\n- exact blocker: `0件`\n\nR2二次「機械・制御」問2は最終5答案要素が公式表示値と一致。candidateの未丸め途中値に最終表示へ影響しない微小差があるためcandidateは変更していない。\n\nTopic 21 H26二次問1(4)の `48.1 N・m / 48.0 N・m` は既診断どおり `π=3.14` 相当の過去問固有丸め差として維持し、一般式 `P=Tω`、`ω=2πN/60` は変更しない。\n\n'''
              s = s.replace(marker, section + marker, 1)
          status.write_text(s, encoding='utf-8')

          hand = Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          h = hand.read_text(encoding='utf-8')
          h = h.replace('Topic 01〜29は最終QAまで `PASS / completed`。完成数 `29 / 39`。', 'Topic 01〜30は最終QAまで `PASS / completed`。完成数 `30 / 39`。')
          h = h.replace('現在地は `topic_30_powerpoint_complete`。Topic 30 `L0系④ 誘導集電・非接触電力伝送` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QA、解説画像PowerPoint＋QAまで完了。次はfresh clean blind独立再解答のcandidate固定工程。', '現在地は `topic_31_exam_alignment_pending`。Topic 30 `L0系④ 誘導集電・非接触電力伝送` はfresh clean blindまで `PASS / completed`。次はTopic 31 `補助電源変換器` の制作前EXAM_ALIGNMENT。')
          if '## Topic 30 最終完了記録\n' not in h:
              marker = '## Topic 30 PowerPoint完了記録\n'
              assert marker in h
              section = '''## Topic 30 最終完了記録\n\n判定: `PASS / COMPLETED`\n\nclean blind canonical:\n- candidate: `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_clean_blind_candidate.md`\n- candidate blob: `33b53e26f54b8619da9819e2ce48cb2250ad13b1`\n- candidate lock commit: `a9295e2a018f4d75d3b99ac7c5c6c9044528c8e7`\n- compare QA: `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_clean_blind_compare_qa.md`\n- final QA commit: `77a747090260a9b517fdb0b5d112ce7e79728391`\n\n結果:\n- candidate固定後修正 `0件`\n- 一次 `20 / 20 PASS`\n- 二次 `5 / 5 PASS`\n- 合計 `25 / 25 PASS`\n- 公式照合不一致 `0件`\n- SPEC必須7項目 `7 / 7 PASS`\n- 指定3可視化 `3 / 3 PASS`\n- 固定EXAM_ALIGNMENT変更 `0件`\n- 未確認L0系実車値の真値化 `0件`\n- exact blocker `0件`\n\n'''
              h = h.replace(marker, section + marker, 1)
          start = h.index('## 次の安全な工程\n')
          end = h.index('\n## Topic 29 完了記録', start)
          nextsec = '''## 次の安全な工程\n\n1. 最新main、`MASTER_SPEC.md`、`EXAM_ALIGNMENT_SPEC.md`、系列`SPEC.md`、既存worker成果をreconcileする。\n2. Topic 31 `補助電源変換器` について、電気技術者試験センターの二種公式過去問を直近年度から調査する。\n3. 一次・二次合わせ原則5問以上を固定し、二次対象論点の記述問題が確認できる場合は最低1問含める。\n4. 過去問要求を、系列SPECの `インバータ / コンバータ / 三相負荷 / 力率 / 高調波 / 変換損失 / 効率 / 負荷変動` に逆算して対応付ける。\n5. 公式問題・公式解答で独立再計算し、制作前EXAM_ALIGNMENT QAをPASSしてから解説sourceへ進む。\n6. 実車の補助電源方式・定格・周波数・容量・効率等は一次資料で確認できない限り真値化しない。仕様不整合・確定不能事項はexact blockerとして停止する。\n\nTopic 21 H26二次問1(4)の一般式は変更しない。\n'''
          h = h[:start] + nextsec + h[end:]
          hand.write_text(h, encoding='utf-8')
          PY

          git rm -f .github/workflows/topic30-final-progress-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git commit -m 'denken: record Topic 30 completion and hand off Topic 31'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
