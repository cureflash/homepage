name: Build Six World Regions

on:
  push:
    branches:
      - social-quiz-six-world-regions
    paths:
      - scripts/build_social_world_maps.py
      - .github/workflows/build-six-world-regions.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-quiz-six-world-regions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install map build dependency
        run: python -m pip install "pyshp==2.3.1"
      - name: Generate six major-region Mercator SVGs
        run: python scripts/build_social_world_maps.py
      - name: Commit generated map assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A subjects/social/quiz/assets/maps/world/
          if git diff --cached --quiet; then
            echo "No generated map changes."
            exit 0
          fi
          git commit -m "Generate six major-region world maps"
          git push origin HEAD:social-quiz-six-world-regions
