name: Sync Topic 15 practice PDF progress

on:
  push:
    paths:
      - '.github/workflows/topic15-progress-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync progress records
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          STATUS = Path('denken-shinkansen/07_shinkansen_machine_2/STATUS.md')
          HANDOFF = Path('denken-shinkansen/07_shinkansen_machine_2/HANDOFF.md')
          MAIN = Path('denken-shinkansen/07_shinkansen_machine_2/topics/15_auxiliary_motor_design/15_auxiliary_motor_design.md')
          PRACTICE = Path('denken-shinkansen/07_shinkansen_machine_2/topics/15_auxiliary_motor_design/15_auxiliary_motor_design_practice.md')

          PDF_QA_STATUS = '''## Topic 15 練習PDF
          - [x] `topics/15_auxiliary_motor_design/15_auxiliary_motor_design_practice.pdf`
          - [x] A4縦7ページ
          - [x] 一次10問＋二次5問・解答／完全解説を収録
          - [x] 200 dpi全7ページ表示QA `7 / 7 PASS`
          - [x] 文字抽出QA PASS / Unicode置換文字 `0件` / `□`置換 `0件` / `(cid:)` `0件`
          - [x] 問1〜問15の全設問存在確認 `15 / 15 PASS`
          - [x] 数値・論理再検算 `15 / 15 PASS`
          - [x] 一次正答一意性 `10 / 10 PASS` を維持
          - [x] 固定一次3問＋二次2問・8答案要素と固定範囲を維持
          - [x] コンプレッサへの三乗則無条件適用 `0件`
          - [x] Topic 05〜09の等価回路・PWM・ベクトル制御詳細の再制作 `0件`
          - [x] Topic 16以降の先取り `0件`
          - [x] 未確認新幹線補機実値の真値化 `0件`
          - [x] SHA-256 `a8cfcf15d58c2d93100479c7a6b6a627b6ccf01b8a36ac3659ba665c8b8f8de5`'''

          PDF_QA_SOURCE = '''# 練習PDF QA

          - [x] `topics/15_auxiliary_motor_design/15_auxiliary_motor_design_practice.pdf`
          - [x] A4縦7ページ
          - [x] 一次10問＋二次5問・解答／完全解説を収録
          - [x] 200 dpi全7ページ表示QA `7 / 7 PASS`
          - [x] 文字抽出QA PASS / Unicode置換文字 `0件` / `□`置換 `0件` / `(cid:)` `0件`
          - [x] 問1〜問15の全設問存在確認 `15 / 15 PASS`
          - [x] 数値・論理再検算 `15 / 15 PASS`
          - [x] 一次正答一意性 `10 / 10 PASS` を維持
          - [x] 固定一次3問＋二次2問・8答案要素と固定範囲を維持
          - [x] コンプレッサへの三乗則無条件適用 `0件`
          - [x] Topic 05〜09の等価回路・PWM・ベクトル制御詳細の再制作 `0件`
          - [x] Topic 16以降の先取り `0件`
          - [x] 未確認新幹線補機実値の真値化 `0件`
          - [x] SHA-256 `a8cfcf15d58c2d93100479c7a6b6a627b6ccf01b8a36ac3659ba665c8b8f8de5`'''

          def repl(path, old, new):
              text = path.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {n}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # STATUS
          repl(STATUS, '- current_status: `topic_15_practice_source_complete`', '- current_status: `topic_15_practice_pdf_complete`')
          repl(STATUS, '- next_start: Topic 15 練習PDF', '- next_start: Topic 15 解説画像PowerPoint')
          repl(STATUS,
               '- [x] 固定公式過去問の個別正答記号・完成済み答案保存 `0件`\n\n## 今回進めた内容',
               '- [x] 固定公式過去問の個別正答記号・完成済み答案保存 `0件`\n\n' + PDF_QA_STATUS + '\n\n## 今回進めた内容')
          repl(STATUS,
               'Topic 15練習問題sourceを作成した。一次試験型10問・全問五肢択一、二次試験型5問、合計15問。一次正答一意性 `10 / 10 PASS`、独立計算・論理QA `15 / 15 PASS`、固定一次3問＋二次記述2問・8答案要素へ `8 / 8` 接続した。仕様外論点、Topic 16以降の先取り、未確認新幹線補機実値の追加は行っていない。',
               'Topic 15練習PDFを作成した。A4縦7ページ、一次10問＋二次5問・解答／完全解説を収録。200 dpi表示QA `7 / 7 PASS`、文字抽出QA PASS、全設問存在確認 `15 / 15 PASS`、数値・論理再検算 `15 / 15 PASS`。固定一次3問＋二次2問・8答案要素と固定範囲を維持し、仕様外論点、Topic 16以降の先取り、未確認新幹線補機実値の追加は行っていない。')
          repl(STATUS,
               'Topic 15は `topic_15_practice_source_complete / IN_PROGRESS`。完成数は `14 / 22`。次はTopic 15練習PDF。',
               'Topic 15は `topic_15_practice_pdf_complete / IN_PROGRESS`。完成数は `14 / 22`。次はTopic 15解説画像PowerPoint。')

          # HANDOFF
          repl(HANDOFF, '- current status: `topic_15_practice_source_complete`', '- current status: `topic_15_practice_pdf_complete`')
          repl(HANDOFF, '- 次工程: Topic 15 練習PDF', '- 次工程: Topic 15 解説画像PowerPoint')
          repl(HANDOFF,
               '- 今回、Topic 15練習問題sourceを作成した。一次試験型10問・全問五肢択一、二次試験型5問、合計15問。\n- 一次正答一意性 `10 / 10 PASS`、独立計算・論理QA `15 / 15 PASS`、固定5問・8答案要素へ `8 / 8` 接続した。',
               '- Topic 15練習問題sourceは一次試験型10問・全問五肢択一、二次試験型5問、合計15問で完成済み。一次正答一意性 `10 / 10 PASS`、独立計算・論理QA `15 / 15 PASS`、固定5問・8答案要素へ `8 / 8` 接続済み。\n- 今回、Topic 15練習PDFを作成した。A4縦7ページ、200 dpi表示QA `7 / 7 PASS`、文字抽出QA PASS、問1〜15存在確認 `15 / 15 PASS`、数値・論理再検算 `15 / 15 PASS`。')
          repl(HANDOFF,
               '- [x] Topic 16以降先取り・未確認新幹線補機実値追加 `0件`\n\n## Topic 15 現成果物',
               '- [x] Topic 16以降先取り・未確認新幹線補機実値追加 `0件`\n\n' + PDF_QA_STATUS + '\n\n## Topic 15 現成果物')
          repl(HANDOFF, '- 練習PDF: 未着手', '- 練習PDF: 完成')
          repl(HANDOFF,
               'Topic 15「新幹線の補機モーターを設計する」の練習PDFを作成し、A4表示QA・文字抽出QA・問題数／解説収録・数値再検算を行う。',
               'Topic 15「新幹線の補機モーターを設計する」の解説画像PowerPointを作成し、固定一次3問＋二次2問・8答案要素と固定範囲を維持したまま表示QA・overflow・ZIP整合性を確認する。')

          # Main source
          repl(MAIN,
               '制作前 `EXAM_ALIGNMENT`、解説本文＋基礎／本試験標準／複合の3段階例題、解説PDF、練習問題sourceまで完成。練習PDF・解説画像PowerPoint・完成後独立再解答は未着手。',
               '制作前 `EXAM_ALIGNMENT`、解説本文＋基礎／本試験標準／複合の3段階例題、解説PDF、練習問題source、練習PDFまで完成。解説画像PowerPoint・完成後独立再解答は未着手。')
          repl(MAIN,
               '現在の判定は `topic_15_practice_source_complete / IN_PROGRESS`。次工程は練習PDF。',
               '現在の判定は `topic_15_practice_pdf_complete / IN_PROGRESS`。次工程は解説画像PowerPoint。')
          repl(MAIN,
               '# 次工程\n\nTopic 15の練習PDFを作成し、A4表示QA・文字抽出QA・問題数／解説収録・数値再検算を行う。',
               PDF_QA_SOURCE + '\n\n# 次工程\n\nTopic 15の解説画像PowerPointを作成し、固定一次3問＋二次2問・8答案要素と固定範囲を維持したまま表示QA・overflow・ZIP整合性を確認する。')

          # Practice source
          repl(PRACTICE,
               '# 次工程\n\nTopic 15の練習PDFを作成し、A4表示QA・文字抽出QA・問題数／解説収録・数値再検算を行う。',
               PDF_QA_SOURCE + '\n\n# 次工程\n\nTopic 15の解説画像PowerPointを作成し、固定一次3問＋二次2問・8答案要素と固定範囲を維持したまま表示QA・overflow・ZIP整合性を確認する。')

          # Sanity gates
          for p in (STATUS, HANDOFF, MAIN, PRACTICE):
              t = p.read_text(encoding='utf-8')
              assert 'a8cfcf15d58c2d93100479c7a6b6a627b6ccf01b8a36ac3659ba665c8b8f8de5' in t
          assert 'topic_15_practice_pdf_complete' in STATUS.read_text(encoding='utf-8')
          assert 'topic_15_practice_pdf_complete' in HANDOFF.read_text(encoding='utf-8')
          assert 'topic_15_practice_pdf_complete' in MAIN.read_text(encoding='utf-8')
          assert 'R04 二次 機械・制御 問3 (6)' in HANDOFF.read_text(encoding='utf-8')
          assert 'R07 二次 機械・制御 問2 (1)の定格トルク部分' in HANDOFF.read_text(encoding='utf-8')
          PY

          rm .github/workflows/topic15-progress-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            denken-shinkansen/07_shinkansen_machine_2/STATUS.md \
            denken-shinkansen/07_shinkansen_machine_2/HANDOFF.md \
            denken-shinkansen/07_shinkansen_machine_2/topics/15_auxiliary_motor_design/15_auxiliary_motor_design.md \
            denken-shinkansen/07_shinkansen_machine_2/topics/15_auxiliary_motor_design/15_auxiliary_motor_design_practice.md \
            .github/workflows/topic15-progress-sync.yml
          git commit -m 'Sync Topic 15 practice PDF progress'
          git push
