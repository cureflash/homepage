name: Power Color Grade 1 p046 normalize temp

on:
  push:
    branches:
      - power-color/grade1-p046-promotion-retry-20260904-1401

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'Normalize p046 runtime diff') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize runtime diff
        run: node tools/power-color-grade1-normalize-p046-diff.mjs
      - name: Run Grade 1 runtime gate
        run: node --test qualifications/color-certification/tests/grade1-runtime-promotion.test.js
      - name: Commit normalized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualifications/color-certification/data/grade1-runtime.json
          git commit -m "Normalize p046 runtime diff"
          git push origin HEAD:${GITHUB_REF_NAME}
