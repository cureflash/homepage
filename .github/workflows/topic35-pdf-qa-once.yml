name: Topic 35 PDF QA one-shot

on:
  push:
    branches: [main]
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_qa/BUILD'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install renderers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install -q pypdfium2 pillow
      - name: Validate with qpdf, Poppler and PDFium
        shell: bash
        run: |
          set -euo pipefail
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          pdf="$base/35_atc_track_circuit_analysis_explanation.pdf"
          qpdf --check "$pdf" | tee /tmp/qpdf-check.txt
          pdfinfo "$pdf" >/tmp/pdfinfo.txt 2>/tmp/pdfinfo.err
          test ! -s /tmp/pdfinfo.err
          pages="$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)"
          test "$pages" = '10'
          read -r width height < <(awk '/^Page size:/ {print $3, $5}' /tmp/pdfinfo.txt)
          awk -v w="$width" -v h="$height" 'BEGIN { exit !(w >= 595.2 && w <= 595.4 && h >= 841.8 && h <= 842.0) }'
          pdftotext "$pdf" /tmp/topic35.txt 2>/tmp/pdftotext.err
          test ! -s /tmp/pdftotext.err
          grep -q 'ATC' /tmp/topic35.txt
          chars="$(python - <<'PY'
from pathlib import Path
s=Path('/tmp/topic35.txt').read_text(errors='replace')
print(len(s))
PY
          )"
          replacements="$(python - <<'PY'
from pathlib import Path
s=Path('/tmp/topic35.txt').read_text(errors='replace')
print(s.count('\ufffd'))
PY
          )"
          test "$replacements" -eq 0
          mkdir -p /tmp/poppler /tmp/pdfium
          pdftoppm -png -r 160 "$pdf" /tmp/poppler/page >/dev/null 2>/tmp/pdftoppm.err
          test ! -s /tmp/pdftoppm.err
          python - <<'PY'
import pypdfium2 as pdfium
from pathlib import Path
pdf=pdfium.PdfDocument('denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/35_atc_track_circuit_analysis_explanation.pdf')
out=Path('/tmp/pdfium')
for i,p in enumerate(pdf):
    img=p.render(scale=160/72).to_pil()
    img.save(out/f'page-{i+1:02d}.png')
print('pdfium_pages', len(pdf))
PY
          pop_count="$(find /tmp/poppler -name 'page-*.png' | wc -l)"
          pdfium_count="$(find /tmp/pdfium -name 'page-*.png' | wc -l)"
          test "$pop_count" -eq 10
          test "$pdfium_count" -eq 10
          python - <<'PY'
from pathlib import Path
from PIL import Image, ImageChops, ImageStat

def bbox_margin(path):
    im=Image.open(path).convert('L')
    # pixels darker than 248 count as content
    mask=im.point(lambda p: 255 if p < 248 else 0)
    box=mask.getbbox()
    if box is None:
        return None
    l,t,r,b=box
    return (l,t,im.width-r,im.height-b), im.size

mins=[]
for engine in ('poppler','pdfium'):
    files=sorted(Path('/tmp',engine).glob('page-*.png'))
    assert len(files)==10
    for i,p in enumerate(files,1):
        res=bbox_margin(p)
        assert res is not None, f'{engine} page {i} blank'
        margins,size=res
        mins.extend(margins)
        assert min(margins) >= 8, f'{engine} page {i} content touches edge: {margins} size={size}'
    print(engine, '10/10 PASS', 'minimum_margin_px', min(mins[-40:]))
print('content_bounds PASS')
PY
          sha256sum "$pdf" | tee /tmp/topic35.sha256
          echo "validated pages=$pages size=${width}x${height} poppler=$pop_count/10 pdfium=$pdfium_count/10 chars=$chars replacements=$replacements"
          rm -rf "$base/.pdf_qa"
          rm -f .github/workflows/topic35-pdf-qa-once.yml
      - name: Remove one-shot QA trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Topic 35 PDF renderer QA'
          git push origin HEAD:main
