name: Topic 35 PDF QA one-shot

on:
  push:
    branches: [main]
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_qa/BUILD'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install renderers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install -q pypdfium2 pillow
      - name: Validate with qpdf, Poppler and PDFium
        shell: bash
        run: |
          set -euo pipefail
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          pdf="$base/35_atc_track_circuit_analysis_explanation.pdf"
          qpdf --check "$pdf" | tee /tmp/qpdf-check.txt
          pdfinfo "$pdf" >/tmp/pdfinfo.txt 2>/tmp/pdfinfo.err
          test ! -s /tmp/pdfinfo.err
          pages="$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)"
          test "$pages" = '10'
          read -r width height < <(awk '/^Page size:/ {print $3, $5}' /tmp/pdfinfo.txt)
          awk -v w="$width" -v h="$height" 'BEGIN { exit !(w >= 595.2 && w <= 595.4 && h >= 841.8 && h <= 842.0) }'
          pdftotext "$pdf" /tmp/topic35.txt 2>/tmp/pdftotext.err
          test ! -s /tmp/pdftotext.err
          grep -q 'ATC' /tmp/topic35.txt
          chars="$(python -c "from pathlib import Path; s=Path('/tmp/topic35.txt').read_text(errors='replace'); print(len(s))")"
          replacements="$(python -c "from pathlib import Path; s=Path('/tmp/topic35.txt').read_text(errors='replace'); print(s.count(chr(0xfffd)))")"
          test "$replacements" -eq 0
          mkdir -p /tmp/poppler /tmp/pdfium
          pdftoppm -png -r 160 "$pdf" /tmp/poppler/page >/dev/null 2>/tmp/pdftoppm.err
          test ! -s /tmp/pdftoppm.err
          python -c "import pypdfium2 as pdfium; from pathlib import Path; pdf=pdfium.PdfDocument('$base/35_atc_track_circuit_analysis_explanation.pdf'); out=Path('/tmp/pdfium'); [(p.render(scale=160/72).to_pil().save(out/f'page-{i+1:02d}.png')) for i,p in enumerate(pdf)]; print('pdfium_pages',len(pdf))"
          pop_count="$(find /tmp/poppler -name 'page-*.png' | wc -l)"
          pdfium_count="$(find /tmp/pdfium -name 'page-*.png' | wc -l)"
          test "$pop_count" -eq 10
          test "$pdfium_count" -eq 10
          python -c "from pathlib import Path; from PIL import Image; mins=[]; files=[]; [files.extend(sorted(Path('/tmp',e).glob('page-*.png'))) for e in ('poppler','pdfium')]; assert len(files)==20; [(lambda im,box: (assertion:=None))(None,None) for _ in []]; results=[]; exec(\"for p in files:\\n im=Image.open(p).convert('L')\\n mask=im.point(lambda x: 255 if x<248 else 0)\\n box=mask.getbbox()\\n assert box is not None, f'blank {p}'\\n l,t,r,b=box\\n m=(l,t,im.width-r,im.height-b)\\n assert min(m)>=8, f'content touches edge {p}: {m}'\\n mins.extend(m)\"); print('content_bounds PASS minimum_margin_px',min(mins))"
          sha256sum "$pdf" | tee /tmp/topic35.sha256
          echo "validated pages=$pages size=${width}x${height} poppler=$pop_count/10 pdfium=$pdfium_count/10 chars=$chars replacements=$replacements"
          rm -rf "$base/.pdf_qa"
          rm -f .github/workflows/topic35-pdf-qa-once.yml
      - name: Remove one-shot QA trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Topic 35 PDF renderer QA'
          git push origin HEAD:main
