name: Topic 30 PowerPoint build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic30-powerpoint-build.yml'
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/.tmp_build_topic30_ppt.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk libreoffice-impress poppler-utils >/dev/null
          npm install --no-save pptxgenjs >/dev/null
          python -m pip install -q python-pptx

      - name: Build canonical PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          node denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/.tmp_build_topic30_ppt.js
          PPT='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx'
          test -s "$PPT"

      - name: PowerPoint geometry and render QA
        shell: bash
        run: |
          set -euo pipefail
          PPT='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx'
          OUT='/tmp/topic30_ppt_qa'
          mkdir -p "$OUT"
          python - <<'PY'
          from pptx import Presentation
          from pathlib import Path
          p=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx')
          prs=Presentation(p)
          assert len(prs.slides)==6, len(prs.slides)
          assert abs(prs.slide_width/914400-13.3333333333)<0.01
          assert abs(prs.slide_height/914400-7.5)<0.01
          W,H=prs.slide_width,prs.slide_height
          for si,slide in enumerate(prs.slides,1):
              for sh in slide.shapes:
                  assert sh.left >= 0 and sh.top >= 0 and sh.left+sh.width <= W and sh.top+sh.height <= H, (si,sh.name)
                  if hasattr(sh,'text'):
                      assert '\ufffd' not in sh.text
          print('PPTX_GEOMETRY=6/6 PASS')
          PY
          libreoffice --headless --convert-to pdf --outdir "$OUT" "$PPT" >/tmp/topic30_lo.out 2>/tmp/topic30_lo.err
          PDF="$OUT/30_l0_inductive_power_collection_contactless_power_transfer_images.pdf"
          test -s "$PDF"
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = '6'
          pdftotext -layout "$PDF" "$OUT/out.txt"
          python - <<'PY'
          from pathlib import Path
          t=Path('/tmp/topic30_ppt_qa/out.txt').read_text(encoding='utf-8',errors='replace')
          assert '\ufffd' not in t
          required=['L0系④','相互インダクタンス','結合係数','指定可視化 1・2','周波数特性','最大効率','25/25 connected','Topic 21 H26二次']
          for s in required:
              assert s in t, s
          print('PDF_TEXT=PASS')
          PY
          pdftoppm -png -r 110 "$PDF" "$OUT/slide" >/dev/null
          test "$(find "$OUT" -name 'slide-*.png' | wc -l)" = '6'

      - name: Write QA and update progress records
        shell: bash
        run: |
          set -euo pipefail
          PPT='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images_qa.md'
          BLOB=$(git hash-object "$PPT")
          SIZE=$(stat -c%s "$PPT")
          SHA256=$(sha256sum "$PPT" | awk '{print $1}')
          TEXT_BYTES=$(stat -c%s /tmp/topic30_ppt_qa/out.txt)
          cat > "$QA" <<EOF
          # Topic 30 PowerPoint QA

          更新日: 2026-09-20

          判定: \`PASS / POWERPOINT_COMPLETE\`

          ## reconcile

          最新main、\`MASTER_SPEC.md\`、\`EXAM_ALIGNMENT_SPEC.md\`、系列\`SPEC.md\`、\`STATUS.md\`、\`HANDOFF.md\`、直近の車両二種worker成果をreconcileした。Topic 30は解説PDF・練習PDFまで完了していたため重複作業をせず、既存sourceから解説画像PowerPoint生成＋QAのみ実施した。

          ## canonical artifact

          - path: \`30_l0_inductive_power_collection_contactless_power_transfer_images.pptx\`
          - canonical blob SHA: \`$BLOB\`
          - file size: \`$SIZE bytes\`
          - SHA-256: \`$SHA256\`
          - 16:9: \`6 slides\`
          - python-pptx open / geometry bounds: \`6 / 6 PASS\`
          - LibreOffice PDF変換: \`6 / 6 pages PASS\`
          - \`pdftotext -layout\`: \`PASS ($TEXT_BYTES bytes)\`
          - 置換文字 \`�\`: \`0件\`

          ## 過去問対応品質ゲート

          - 固定5問・25答案要素: \`25 / 25 connected\`
          - 一次: \`20 / 20 connected\`
          - 二次: \`5 / 5 connected\`
          - SPEC必須7項目: \`7 / 7 PASS\`
          - 指定3可視化: \`3 / 3 PASS\`
          - 固定EXAM_ALIGNMENT変更: \`0件\`
          - Topic 31範囲先取り: \`0件\`
          - 未確認L0系実車値の真値化: \`0件\`
          - exact blocker: \`0件\`

          スライド上の \`k\`, \`L\`, \`M\`, \`R\`, \`f\`, 伝送電力、効率は教材用仮定値であり、L0系実車値として扱わない。1 kHzの共振ピークも教材条件である。

          本判定はPowerPoint工程のPASSであり、Topic 30最終clean blind PASSを意味しない。

          ## Topic 21 H26二次 問1(4)

          \`48.1 N·m / 48.0 N·m\` 差は、公式標準解答が \`π=3.14\` 相当の数値処理を用いた過去問固有丸め差として維持する。一般式 \`P=Tω\`、\`ω=2πN/60\` は変更しない。
          EOF

          python - <<'PY'
          from pathlib import Path
          status=Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md')
          s=status.read_text(encoding='utf-8')
          s=s.replace('- current_status: `topic_30_practice_pdf_complete`','- current_status: `topic_30_powerpoint_complete`')
          s=s.replace('- next_start: Topic 30解説画像PowerPointを生成し、固定25答案要素・SPEC必須7項目・指定3可視化への接続と表示をQAする','- next_start: Topic 30教材完成状態をreconcileし、fresh clean blind独立再解答のcandidate固定工程へ進む')
          s=s.replace('Topic 30は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了した。','Topic 30は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QA、解説画像PowerPoint＋QAまで完了した。')
          marker='## Topic 30 練習PDF\n'
          section='''## Topic 30 PowerPoint\n\n判定: `PASS / POWERPOINT_COMPLETE`\n\n成果物:\n- `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx`\n- `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images_qa.md`\n\n結果:\n- 16:9: `6 slides`\n- python-pptx geometry bounds: `6 / 6 PASS`\n- LibreOffice PDF変換: `6 / 6 PASS`\n- `pdftotext -layout`: `PASS`\n- 置換文字: `0件`\n- 固定5問・25答案要素: `25 / 25 connected`\n- 一次: `20 / 20 connected`\n- 二次: `5 / 5 connected`\n- SPEC必須7項目: `7 / 7 PASS`\n- 指定3可視化: `3 / 3 PASS`\n- 未確認L0系実車値の真値化: `0件`\n- 固定EXAM_ALIGNMENT変更: `0件`\n- Topic 31範囲先取り: `0件`\n- exact blocker: `0件`\n\nこれはPowerPoint工程の接続QAであり、Topic 30最終clean blind PASSを意味しない。\n\n'''
          assert marker in s and '## Topic 30 PowerPoint\n' not in s
          s=s.replace(marker,section+marker,1)
          status.write_text(s,encoding='utf-8')

          hand=Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          h=hand.read_text(encoding='utf-8')
          h=h.replace('現在地は `topic_30_practice_pdf_complete`。Topic 30 `L0系④ 誘導集電・非接触電力伝送` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QAまで完了。次は解説画像PowerPoint生成＋QA。','現在地は `topic_30_powerpoint_complete`。Topic 30 `L0系④ 誘導集電・非接触電力伝送` は制作前EXAM_ALIGNMENT、解説source＋source QA、解説PDF＋PDF QA、練習source＋source QA、練習PDF＋PDF QA、解説画像PowerPoint＋QAまで完了。次はfresh clean blind独立再解答のcandidate固定工程。')
          marker='## Topic 30 練習PDF完了記録\n'
          section='''## Topic 30 PowerPoint完了記録\n\n判定: `PASS / POWERPOINT_COMPLETE`\n\ncanonical artifacts:\n- PPTX: `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx`\n- QA: `topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images_qa.md`\n\nQA:\n- 16:9 `6 slides`\n- python-pptx geometry bounds `6 / 6 PASS`\n- LibreOffice PDF変換 `6 / 6 PASS`\n- `pdftotext -layout` `PASS`\n- 置換文字 `0件`\n- 固定5問・25答案要素 `25 / 25 connected`\n- 一次 `20 / 20 connected`\n- 二次 `5 / 5 connected`\n- SPEC必須7項目 `7 / 7 PASS`\n- 指定3可視化 `3 / 3 PASS`\n- 固定EXAM_ALIGNMENT変更 `0件`\n- Topic 31範囲先取り `0件`\n- 未確認L0系実車値の真値化 `0件`\n- exact blocker `0件`\n\n'''
          assert marker in h and '## Topic 30 PowerPoint完了記録\n' not in h
          h=h.replace(marker,section+marker,1)
          a=h.index('## 次の安全な工程\n')
          b=h.index('\n## Topic 29 完了記録',a)
          nextsec='''## 次の安全な工程\n\n1. 最新mainと車両二種worker成果を再reconcileする。\n2. Topic 30教材完成状態を確認後、fresh clean blind用candidateをanswer-bearing資料を見ずに固定する。\n3. candidate固定後に公式標準解答と比較し、一次20要素＋二次5要素の `25 / 25` を判定する。\n4. 不一致時はcandidateを改変せず原因を分類し、教材不足のみremediationする。仕様不整合・確定不能事項はexact blockerとして停止する。\n5. 固定EXAM_ALIGNMENTは差し替えず、未確認L0系実車値は真値化しない。\n\n教材完成後clean blindのcandidate固定前には、Topic 30 EXAM_ALIGNMENT本体、exam alignment QA、公式解答等のanswer-bearing資料を開かない。\n'''
          h=h[:a]+nextsec+h[b:]
          hand.write_text(h,encoding='utf-8')
          PY

      - name: Commit canonical artifact and progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images.pptx \
            denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_images_qa.md \
            denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md \
            denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md
          git commit -m 'denken: complete Topic 30 PowerPoint and QA'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
