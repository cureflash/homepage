name: Export Plarail Universal IPA

on:
  push:
    paths:
      - '.github/workflows/export-plarail-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify universal IPA
        run: |
          set -euxo pipefail
          test -s plarail-ios/PlarailController-Universal-unsigned.ipa
          ls -lh plarail-ios/PlarailController-Universal-unsigned.ipa

      - name: Record export run ID
        run: |
          set -euxo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > plarail-ios/latest-export-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plarail-ios/latest-export-run-id.txt
          git commit -m "Record Plarail export run ID [skip ci]"
          git push

      - name: Upload universal IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlarailController-Universal-iPhone-iPad
          path: plarail-ios/PlarailController-Universal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
