name: Power Color Grade 2 temporary image-keyword promotion
on:
  push:
    branches:
      - power-color-grade2-image-keywords-promotion
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-image-keywords-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified image-keyword batch
        run: python3 .github/scripts/power_color_grade2_image_keywords_promote.py
      - name: Switch authoring gate to promoted-state assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qualifications/color-certification/tests/grade2-image-scheme-keywords-authoring.test.js')
          s = p.read_text()
          s = s.replace('runtime-distinct', 'runtime-promoted')
          s = s.replace("assert.equal(runtimeFp.has(fingerprint(q)),false);", "assert.equal(runtimeFp.has(fingerprint(q)),true);")
          p.write_text(s)
          PY
      - name: Run full Power Color tests
        run: node --test qualifications/color-certification/tests/*.test.js
      - name: Commit promotion and remove temporary helpers
        run: |
          git config user.name "Power Color Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/power-color-grade2-image-keywords-promote-temp.yml .github/scripts/power_color_grade2_image_keywords_promote.py
          git rm -f .github/power-color-grade2-image-keywords-promotion-debug.txt
          git add docs/power-color qualifications/color-certification/data/grade2-runtime.json qualifications/color-certification/tests/grade2-runtime-promotion.test.js qualifications/color-certification/tests/grade2-image-scheme-keywords-authoring.test.js
          git commit -m "power-color: promote Grade 2 image-scheme keywords"
          git push origin HEAD:power-color-grade2-image-keywords-promotion
