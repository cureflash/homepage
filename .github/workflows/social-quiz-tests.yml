name: Social Quiz Tests

on:
  pull_request:
    paths:
      - "subjects/social/quiz/**"
      - "docs/social-quiz-factory/**"
      - "index.html"
      - ".github/workflows/social-quiz-tests.yml"
  push:
    branches: [main]
    paths:
      - "subjects/social/quiz/**"
      - "docs/social-quiz-factory/**"
      - "index.html"
      - ".github/workflows/social-quiz-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run social quiz tests
        working-directory: subjects/social/quiz
        run: npm test
