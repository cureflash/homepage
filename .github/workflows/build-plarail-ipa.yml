name: Build Plarail unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'plarail-ios/PlarailController.swiftpm.zip'
      - 'plarail-ios/project.yml'
      - '.github/workflows/build-plarail-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free macOS runner disk space
        run: |
          set -euxo pipefail
          echo '=== disk before cleanup ==='
          df -h /
          ACTIVE_DEVELOPER="$(xcode-select -p)"
          ACTIVE_XCODE="${ACTIVE_DEVELOPER%/Contents/Developer}"
          ACTIVE_REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$ACTIVE_XCODE")"
          for xcode in /Applications/Xcode*.app; do
            [ -e "$xcode" ] || continue
            REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$xcode")"
            if [ "$REAL" != "$ACTIVE_REAL" ]; then
              echo "Removing unused $xcode"
              sudo rm -rf "$xcode"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          rm -rf "$HOME/Library/Caches/Homebrew" || true
          brew cleanup -s || true
          echo '=== disk after cleanup ==='
          df -h /

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Restore Swift Playground app
        run: |
          set -euxo pipefail
          ZIP='plarail-ios/PlarailController.swiftpm.zip'
          test -f "$ZIP"
          rm -rf plarail-ios/work
          mkdir -p plarail-ios/work
          unzip -q "$ZIP" -d plarail-ios/work
          APP_DIR="$(find plarail-ios/work -maxdepth 2 -type d -name '*.swiftpm' | head -1)"
          test -n "$APP_DIR"
          cp plarail-ios/project.yml "$APP_DIR/project.yml"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          find "$APP_DIR" -maxdepth 3 -type f | sort | head -100

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          brew cleanup -s || true
          rm -rf "$HOME/Library/Caches/Homebrew" || true
          df -h /

      - name: Generate Xcode project
        run: |
          cd "$APP_DIR"
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          cd "$APP_DIR"
          df -h /
          xcodebuild \
            -project PlarailController.xcodeproj \
            -scheme PlarailController \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlarailController-build-log
          path: ${{ env.APP_DIR }}/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          APP='build/Build/Products/Release-iphoneos/PlarailController.app'
          test -d "$APP"
          rm -rf Payload PlarailController-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry PlarailController-unsigned.ipa Payload
          /usr/bin/unzip -l PlarailController-unsigned.ipa | head -60

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlarailController-unsigned-ipa
          path: ${{ env.APP_DIR }}/PlarailController-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
