name: temporary-topic10-progress-sync

on:
  push:
    paths:
      - '.github/topic10-progress-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync Topic 10 progress records
        shell: python
        run: |
          from pathlib import Path

          root = Path('denken-shinkansen/05_shinkansen_vehicle_2')
          status = root / 'STATUS.md'
          handoff = root / 'HANDOFF.md'
          source = root / 'topics/10_300series_induction_motor_equivalent_circuit/10_300series_induction_motor_equivalent_circuit.md'

          s = status.read_text(encoding='utf-8')
          s = s.replace('- current_status: `topic_10_practice_pdf_complete`', '- current_status: `topic_10_powerpoint_complete`')
          s = s.replace('- next_start: Topic 10の解説画像PowerPointを制作する。SPEC指定4グラフ（トルク―すべり、出力―すべり、効率―負荷率、二次抵抗変更時の特性）を収録し、表示QA・overflow・PowerPoint ZIP整合性を確認する', '- next_start: Topic 10の完成教材だけで固定一次3問＋二次2問・22答案要素を独立再解答する')
          old_tail = '次工程はTopic 10 `300系① 誘導電動機等価回路` の解説画像PowerPoint。SPEC指定4グラフを収録し、表示QA・overflow・PowerPoint ZIP整合性を確認する。'
          ppt_block = '''## Topic 10 解説画像PowerPoint\n- `10_300series_induction_motor_equivalent_circuit_images.pptx`: `completed`\n- 16:9・4スライド\n- SPEC指定4可視化: `4 / 4 PASS`\n  - トルク―すべり\n  - 出力―すべり\n  - 効率―負荷率\n  - 二次抵抗変更時の特性\n- LibreOffice全4スライド Visual QA: `4 / 4 PASS`\n- overflow: `0件 / PASS`\n- PowerPoint ZIP整合性: `PASS`\n- 固定一次3問＋二次2問・22答案要素: 維持\n- 固定EXAM_ALIGNMENT変更: `0件`\n- 固定範囲外追加: `0件`\n- Topic 11〜13先取り: `0件`\n- 未確認300系実車値追加: `0件`\n- Git blob SHA-1: `b06acd2542494d2c66783c2be3f3e8c3c39d465b`\n- SHA-256: `b88f4db3bb0d1864869a7bf1fc2323e24330c8cbf94374b02ffcfd615d155274`\n\n次工程はTopic 10の完成教材だけで固定一次3問＋二次2問・22答案要素を独立再解答する。'''
          if '## Topic 10 解説画像PowerPoint' not in s:
              if old_tail not in s:
                  raise SystemExit('STATUS tail marker not found')
              s = s.replace(old_tail, ppt_block)
          status.write_text(s, encoding='utf-8')

          h = handoff.read_text(encoding='utf-8')
          h = h.replace('現在地は `topic_10_practice_pdf_complete`。', '現在地は `topic_10_powerpoint_complete`。')
          marker = '固定5問・22答案要素へ `22 / 22` 接続し、固定範囲外追加・Topic 11〜13先取り・未確認300系実車値追加は `0件`。'
          addition = marker + ' 解説画像PowerPointは16:9・4スライド、SPEC指定4可視化 `4 / 4 PASS`、Visual QA `4 / 4 PASS`、overflow `0件`、PowerPoint ZIP整合性 `PASS`。固定EXAM_ALIGNMENT変更・固定範囲外追加・Topic 11〜13先取り・未確認300系実車値追加はいずれも `0件`。'
          if addition not in h:
              if marker not in h:
                  raise SystemExit('HANDOFF progress marker not found')
              h = h.replace(marker, addition, 1)
          old_next = '次工程はTopic 10の解説画像PowerPoint。SPEC指定4グラフ（トルク―すべり、出力―すべり、効率―負荷率、二次抵抗変更時の特性）を収録し、表示QA・overflow・PowerPoint ZIP整合性を確認する。'
          new_next = '次工程はTopic 10の完成教材だけで固定一次3問＋二次2問・22答案要素を独立再解答する。'
          h = h.replace(old_next, new_next)
          handoff.write_text(h, encoding='utf-8')

          q = source.read_text(encoding='utf-8')
          old_state = '制作前EXAM_ALIGNMENT、解説本文＋3段階例題、解説PDF、練習問題・完全解説source、練習PDFまで完成。PowerPointは未制作。'
          new_state = '制作前EXAM_ALIGNMENT、解説本文＋3段階例題、解説PDF、練習問題・完全解説source、練習PDF、解説画像PowerPointまで完成。完成後独立再解答は未実施。'
          if old_state not in q and new_state not in q:
              raise SystemExit('source state marker not found')
          q = q.replace(old_state, new_state)
          old_source_next = '解説画像PowerPointを作成し、SPEC指定4グラフ（トルク―すべり、出力―すべり、効率―負荷率、二次抵抗変更時の特性）を収録する。表示QA・overflow・PowerPoint ZIP整合性を行い、固定一次3問＋二次2問・22答案要素を維持する。'
          source_block = '''## 解説画像PowerPoint QA\n\n- `10_300series_induction_motor_equivalent_circuit_images.pptx`: `completed`\n- 16:9・4スライド\n- SPEC指定4可視化: `4 / 4 PASS`\n- LibreOffice全4スライド Visual QA: `4 / 4 PASS`\n- `slides_test.py` overflow: `0件 / PASS`\n- PowerPoint ZIP整合性: `PASS`\n- 固定一次3問＋二次2問・22答案要素: 維持\n- 固定EXAM_ALIGNMENT変更: `0件`\n- 固定範囲外追加: `0件`\n- Topic 11〜13先取り: `0件`\n- 未確認300系実車値追加: `0件`\n- Git blob SHA-1: `b06acd2542494d2c66783c2be3f3e8c3c39d465b`\n- SHA-256: `b88f4db3bb0d1864869a7bf1fc2323e24330c8cbf94374b02ffcfd615d155274`\n\n## 次工程\n\n完成教材だけで固定一次3問＋二次2問・22答案要素を独立再解答する。'''
          if '## 解説画像PowerPoint QA' not in q:
              if old_source_next not in q:
                  raise SystemExit('source next marker not found')
              q = q.replace('## 次工程\n\n' + old_source_next, source_block)
          source.write_text(q, encoding='utf-8')
      - name: Commit synced records
        run: |
          git config user.name "cureflash-automation"
          git config user.email "89366952+cureflash@users.noreply.github.com"
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md denken-shinkansen/05_shinkansen_vehicle_2/topics/10_300series_induction_motor_equivalent_circuit/10_300series_induction_motor_equivalent_circuit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "denken vehicle2 topic10: sync progress after PowerPoint"
          git push
