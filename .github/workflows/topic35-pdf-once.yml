name: Topic 35 PDF one-shot

on:
  push:
    branches: [main]
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_build/BUILD'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Reconstruct and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          pdf="$base/35_atc_track_circuit_analysis_explanation.pdf"
          cat "$base"/.pdf_build/part*.b64 | tr -d '\n\r' | base64 -d > "$pdf"
          header="$(head -c 5 "$pdf")"
          eof_count="$(grep -a -c '%%EOF' "$pdf" || true)"
          echo "header=$header eof_count=$eof_count bytes=$(wc -c < "$pdf")"
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          test "$header" = '%PDF-'
          test "$eof_count" -ge 1
          pdfinfo "$pdf" | tee /tmp/topic35.pdfinfo
          pages="$(awk '/^Pages:/ {print $2}' /tmp/topic35.pdfinfo)"
          test "$pages" = '10'
          read -r width height < <(awk '/^Page size:/ {print $3, $5}' /tmp/topic35.pdfinfo)
          awk -v w="$width" -v h="$height" 'BEGIN { exit !(w >= 595.2 && w <= 595.4 && h >= 841.8 && h <= 842.0) }'
          pdftotext "$pdf" /tmp/topic35.txt
          grep -q 'ATC' /tmp/topic35.txt
          mkdir -p /tmp/topic35-render
          pdftoppm -png -r 96 "$pdf" /tmp/topic35-render/page >/dev/null 2>&1
          render_count="$(find /tmp/topic35-render -name 'page-*.png' | wc -l)"
          test "$render_count" -eq 10
          sha256sum "$pdf" | tee /tmp/topic35.sha256
          echo "validated pages=$pages size=${width}x${height} render_count=$render_count"
          rm -rf "$base/.pdf_build"
          rm -f .github/workflows/topic35-pdf-once.yml
      - name: Commit generated PDF
        shell: bash
        run: |
          set -euo pipefail
          hash="$(cut -d' ' -f1 /tmp/topic35.sha256)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Add Topic 35 explanation PDF [sha256:$hash]"
          git push origin HEAD:main
