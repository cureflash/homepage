name: Power TOEIC iOS app build

on:
  pull_request:
    paths:
      - 'subjects/english/power-toeic-ios/**'
      - 'docs/power-toeic/**'
      - '.github/workflows/power-toeic-ios-app-build.yml'
  push:
    branches: [main]
    paths:
      - 'subjects/english/power-toeic-ios/**'
      - 'docs/power-toeic/**'
      - '.github/workflows/power-toeic-ios-app-build.yml'

jobs:
  build-app:
    runs-on: macos-latest
    env:
      PROJECT: subjects/english/power-toeic-ios/AppShell/PowerTOEICApp.xcodeproj
      SCHEME: PowerTOEICApp
      ARCHIVE_PATH: /tmp/PowerTOEICApp.xcarchive
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List project and shared scheme
        run: xcodebuild -project "$PROJECT" -list

      - name: Build Debug for iOS Simulator without signing
        run: >-
          xcodebuild
          -project "$PROJECT"
          -scheme "$SCHEME"
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build Release for generic iOS device without signing
        run: >-
          xcodebuild
          -project "$PROJECT"
          -scheme "$SCHEME"
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Create unsigned Release archive
        run: >-
          xcodebuild
          -project "$PROJECT"
          -scheme "$SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$ARCHIVE_PATH"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Verify archived app, privacy manifest, and audio resources
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/PowerTOEICApp.app"
          test -d "$ARCHIVE_PATH"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -p "$APP_PATH/Info.plist"

          for audio in otologic_correct.mp3 otologic_incorrect.mp3 otologic_inspiration.mp3; do
            match="$(find "$APP_PATH" -type f -name "$audio" -print -quit)"
            if [ -z "$match" ]; then
              echo "Missing archived audio resource: $audio" >&2
              find "$APP_PATH" -maxdepth 4 -type f | sort
              exit 1
            fi
            echo "Archived audio resource: $match"
          done
