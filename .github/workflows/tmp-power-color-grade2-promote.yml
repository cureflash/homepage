name: Temporary Power Color Grade 2 promotion

on:
  push:
    branches:
      - power-color-g2-landscape-elements-promote-20260903

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-g2-landscape-elements-promote-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate record-identical runtime promotion
        run: node tools/tmp-promote-power-color-g2-landscape-elements.mjs
      - name: Commit generated promotion
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qualifications/color-certification/data/grade2-runtime.json qualifications/color-certification/tests/grade2-runtime-promotion.test.js
          git commit -m "Promote Grade 2 landscape element examples"
          git push origin HEAD:power-color-g2-landscape-elements-promote-20260903
