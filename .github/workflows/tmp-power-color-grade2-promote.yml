name: Temporary Power Color Grade 2 promotion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-power-color-grade2-promote.yml'
      - 'qualifications/color-certification/data/grade2-runtime.json'
      - 'qualifications/color-certification/data/grade2-authoring-tonal-0001-0012.json'
      - 'qualifications/color-certification/data/grade2-authoring-camaieu-faux-camaieu-0001-0012.json'

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Grade 2 runtime from verified authoring batches
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'qualifications/color-certification/data';
          const files = [
            'grade2-authoring-official-sample-facts-0001-0012.json',
            'grade2-authoring-triad-hue-positions-0001-0012.json',
            'grade2-authoring-munsell-notation-components-0001-0012.json',
            'grade2-authoring-natural-complex-harmony-0001-0012.json',
            'grade2-authoring-dominant-color-tone-0001-0012.json',
            'grade2-authoring-tone-on-tone-0001-0012.json',
            'grade2-authoring-tone-in-tone-0001-0012.json',
            'grade2-authoring-tonal-0001-0012.json',
            'grade2-authoring-camaieu-faux-camaieu-0001-0012.json'
          ];
          const batches = files.map((f) => JSON.parse(fs.readFileSync(`${root}/${f}`, 'utf8')));
          for (const batch of batches) {
            if (batch.qaSummary?.pending !== 0 || batch.qaSummary?.verified !== batch.questions.length) {
              throw new Error(`unverified batch: ${batch.skill?.id}`);
            }
            for (const q of batch.questions) {
              if (q.validationStatus !== 'verified') throw new Error(`unverified record: ${q.id}`);
            }
          }
          const runtime = {
            format: 'power-color-grade2-runtime-v1',
            grade: 2,
            productionApproved: false,
            notice: '色彩検定2級の現行一次資料から、画像色を読み取らず独立QAできる非visual問題を収録。',
            skills: batches.map((b) => b.skill),
            questions: batches.flatMap((b) => b.questions)
          };
          fs.writeFileSync(`${root}/grade2-runtime.json`, JSON.stringify(runtime, null, 2) + '\n');
          NODE
      - name: Commit generated runtime when needed
        run: |
          if git diff --quiet -- qualifications/color-certification/data/grade2-runtime.json; then
            echo 'runtime already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualifications/color-certification/data/grade2-runtime.json
          git commit -m 'power-color: promote tonal and camaieu to Grade 2 runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
