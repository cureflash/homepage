name: Publish junior-high grade 2 physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-jh2-publish.yml'
      - 'scripts/science_physics_jh2_topics.py'
      - 'scripts/science_physics_jh2_mixed_review.py'
      - 'scripts/publish_science_physics_jh2.py'
      - 'tests/test_science_physics_jh2.py'

permissions:
  contents: write

concurrency:
  group: worksheet-catalog-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and JH2 physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh2.py

      - name: Generate and register JH2 electricity batch
        run: python scripts/publish_science_physics_jh2.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh2.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog
          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [
              x for x in catalog
              if x.get('subject') == '理科'
              and x.get('science_field') == 'physics'
              and x.get('school_level') == 'junior-high'
              and x.get('grade') == 2
          ]
          assert len(rows) == 120, len(rows)
          assert all(x['answer_type'] == 'numeric' for x in rows)
          series = Counter(x['worksheet_series'] for x in rows)
          assert series['focused'] == 90, series
          assert series['mixed'] == 15, series
          assert series['review'] == 15, series
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes['calculation-basic'] == 70, modes
          assert modes['calculation-reverse'] == 20, modes
          assert modes['calculation-mixed'] == 15, modes
          assert modes['calculation-review'] == 15, modes
          skills = Counter(x['skill'] for x in rows)
          assert skills['ohms-law'] == 30, skills
          assert skills['series-circuit-voltage'] == 10, skills
          assert skills['parallel-circuit-current'] == 10, skills
          assert skills['series-combined-resistance'] == 10, skills
          assert skills['electric-power'] == 10, skills
          assert skills['electric-energy'] == 10, skills
          assert skills['heat-quantity'] == 10, skills
          assert skills['electricity-cumulative'] == 30, skills
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('JH2 physics 120-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/junior-high/grade-02/physics/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; JH2 physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish 30 JH2 mixed and review worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
