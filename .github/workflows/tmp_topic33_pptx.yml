name: Build Topic 33 PowerPoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_topic33_pptx.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install slide and render dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-pptx pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk

      - name: Generate Topic 33 PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx.enum.text import PP_ALIGN, MSO_ANCHOR
          from pptx.enum.shapes import MSO_SHAPE, MSO_CONNECTOR
          from pptx.dml.color import RGBColor

          base=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance')
          out=base/'33_hvac_thermal_balance_images.pptx'
          prs=Presentation()
          prs.slide_width=Inches(13.333333)
          prs.slide_height=Inches(7.5)
          blank=prs.slide_layouts[6]
          FONT='Noto Sans CJK JP'
          NAVY=RGBColor(31,55,84)
          MID=RGBColor(68,84,106)
          LIGHT=RGBColor(242,245,248)
          WHITE=RGBColor(255,255,255)
          BLACK=RGBColor(20,24,28)
          GREY=RGBColor(110,118,128)
          ACCENT=RGBColor(36,124,168)
          WARM=RGBColor(184,95,64)
          GREEN=RGBColor(63,128,91)

          def text(slide, x,y,w,h, value, size=18, bold=False, color=BLACK, align=PP_ALIGN.LEFT, font=FONT):
              box=slide.shapes.add_textbox(Inches(x),Inches(y),Inches(w),Inches(h))
              tf=box.text_frame; tf.clear(); tf.word_wrap=True; tf.vertical_anchor=MSO_ANCHOR.TOP
              p=tf.paragraphs[0]; p.alignment=align
              r=p.add_run(); r.text=value; r.font.name=font; r.font.size=Pt(size); r.font.bold=bold; r.font.color.rgb=color
              return box

          def title(slide, s, sub=None):
              text(slide,0.55,0.32,12.2,0.55,s,25,True,NAVY)
              line=slide.shapes.add_shape(MSO_SHAPE.RECTANGLE,Inches(0.55),Inches(0.92),Inches(12.2),Inches(0.035))
              line.fill.solid(); line.fill.fore_color.rgb=ACCENT; line.line.fill.background()
              if sub: text(slide,0.6,0.98,12.0,0.36,sub,10,False,GREY)

          def box(slide,x,y,w,h,head,body,accent=ACCENT,head_size=15,body_size=12.5):
              shp=slide.shapes.add_shape(MSO_SHAPE.ROUNDED_RECTANGLE,Inches(x),Inches(y),Inches(w),Inches(h))
              shp.fill.solid(); shp.fill.fore_color.rgb=LIGHT; shp.line.color.rgb=RGBColor(205,213,221)
              text(slide,x+0.18,y+0.12,w-0.36,0.35,head,head_size,True,accent)
              text(slide,x+0.18,y+0.56,w-0.36,h-0.68,body,body_size,False,BLACK)
              return shp

          def footer(slide,n):
              text(slide,0.58,7.12,8.7,0.22,'電験×新幹線 / Topic 33 空調・電熱の熱収支',7,False,GREY)
              text(slide,12.1,7.08,0.65,0.25,str(n),8,False,GREY,PP_ALIGN.RIGHT)

          # 1: scope and energy flow
          s=prs.slides.add_slide(blank); title(s,'Topic 33 空調・電熱の熱収支','一次「機械」の電熱・熱移動・ヒートポンプを、熱収支で一つにまとめる')
          box(s,0.7,1.45,3.55,2.0,'電気 → 熱','Q = Pt\nP = I²R\nQ = I²Rt\n電力[W] × 時間[s] = 熱量[J]',WARM,16,15)
          box(s,4.88,1.45,3.55,2.0,'熱の移動','伝導: kAΔT/L\n対流: hAΔT\n放射: εσS₁F₁₂(T₁⁴−T₂⁴)',ACCENT,16,14.5)
          box(s,9.05,1.45,3.55,2.0,'空調・ヒートポンプ','QH = QL + W\nCOPC = QL/W\nCOPH = QH/W',GREEN,16,15)
          text(s,0.86,4.0,11.6,0.55,'試験で見る順序: 既知量 → 単位統一 → 熱収支 → 公式選択 → 数値代入 → 物理的検算',17,True,NAVY,PP_ALIGN.CENTER)
          box(s,1.0,4.85,5.35,1.3,'固定EXAM_ALIGNMENT','R8問6 / R3問7 / R1問7(ヒートポンプ行) / H30問4 / H27問4',MID,14,12)
          box(s,6.95,4.85,5.35,1.3,'二次の扱い','公式「機械・制御」の範囲に電熱を含まないため、件数合わせの二次問題は追加しない。',MID,14,12)
          footer(s,1)

          # 2: electric heat, sensible heat, conduction
          s=prs.slides.add_slide(blank); title(s,'1. 電熱・顕熱・伝導','R8 / R3 の計算を式の意味から選ぶ')
          box(s,0.7,1.35,3.7,2.0,'ジュール熱','P = I²R\nQ = I²Rt\n\nR[Ω], I[A], t[s]\n1 hなら3600 sに直す。',WARM,15,14)
          box(s,4.82,1.35,3.7,2.0,'物体の温度上昇','Q = mcΔT\n\n質量m[kg]、比熱c[J/(kg·K)]。\n効率ηがあれば Quse = ηPt。',ACCENT,15,13.5)
          box(s,8.94,1.35,3.7,2.0,'一次元定常熱伝導','Q̇cond = kAΔT/L\n\nk[W/(m·K)]、A[m²]、L[m]。\n厚いほど熱流率は小さい。',GREEN,15,13.5)
          text(s,0.85,3.85,2.4,0.35,'熱平衡',15,True,NAVY)
          text(s,0.85,4.25,5.3,0.55,'定常なら ΣQ̇in = ΣQ̇out',22,True,ACCENT)
          box(s,6.45,3.75,5.8,1.65,'頻出ミス','W=J/sなのに min・hをそのまま代入 / ηを分母に置く / 熱量[J]と熱流率[W]を混同 / ΔTと絶対温度を混同',MID,14,12.5)
          footer(s,2)

          # 3: convection/radiation/control
          s=prs.slides.add_slide(blank); title(s,'2. 対流・放射と電熱制御','H30の伝導・対流・赤外放射・位相制御・高調波を接続')
          box(s,0.75,1.35,3.8,2.05,'対流','Q̇conv = hA(Tf−Ts)\n\n流体が必要。真空中では対流しない。\n熱流束は簡略化すれば温度差に比例。',ACCENT,15,13)
          box(s,4.78,1.35,3.8,2.05,'放射','Q̇rad = εσS₁F₁₂(T₁⁴−T₂⁴)\n\nTは絶対温度[K]。\nσはStefan–Boltzmann定数。',WARM,15,13)
          box(s,8.81,1.35,3.8,2.05,'伝導との区別','伝導: 物質内部の温度勾配\n対流: 流体運動＋熱伝達\n放射: 電磁波。真空でも生じる。',GREEN,15,13)
          box(s,1.15,4.05,5.25,1.55,'位相制御で電熱を調整','交流電熱負荷の電力を位相制御で変える場合、波形は正弦波から崩れ、高調波を含む。平均的な発熱だけでなく電源側波形にも注意。',WARM,14,12)
          box(s,6.9,4.05,5.25,1.55,'問題文の言い換えに対応','「赤外線」「電磁波」→放射 / 「流体と表面」→対流 / 「厚さ・熱伝導率」→伝導、と物理モデルへ戻す。',ACCENT,14,12)
          footer(s,3)

          # 4: heat pump/COP
          s=prs.slides.add_slide(blank); title(s,'3. ヒートポンプとCOP','H27 / R1：圧縮機・凝縮器・膨張弁・逆サイクルを熱収支で読む')
          # diagram
          box(s,0.8,2.05,2.75,1.35,'低温側','吸収熱 QL',ACCENT,16,16)
          box(s,5.28,1.65,2.78,2.15,'圧縮機','入力仕事 W\n電動機で駆動',WARM,16,15)
          box(s,9.75,2.05,2.75,1.35,'高温側','放出熱 QH',GREEN,16,16)
          text(s,3.58,2.42,1.45,0.4,'→',28,True,NAVY,PP_ALIGN.CENTER)
          text(s,8.2,2.42,1.45,0.4,'→',28,True,NAVY,PP_ALIGN.CENTER)
          text(s,4.05,4.18,5.2,0.45,'QH = QL + W',24,True,NAVY,PP_ALIGN.CENTER)
          box(s,1.1,4.85,5.15,1.2,'冷房COP','COPC = QL / W',ACCENT,15,18)
          box(s,7.05,4.85,5.15,1.2,'暖房COP','COPH = QH / W = COPC + 1',GREEN,15,17)
          text(s,1.15,6.35,11.0,0.38,'COP>1は「効率100%超」ではない。外部から熱を移送するため。HFCはH27過去問固有知識として扱い、現行実車の冷媒仕様へ一般化しない。',10.5,False,GREY,PP_ALIGN.CENTER)
          footer(s,4)

          # 5: HVAC load
          s=prs.slides.add_slide(blank); title(s,'4. 空調負荷を熱収支で分解する','実車値を推測せず、一般設計式として新幹線の車室へ接続')
          box(s,0.75,1.3,3.72,1.55,'外皮・貫流負荷','Q̇trans = UAΔT\nU: 熱貫流率, A: 面積',ACCENT,14,15)
          box(s,4.8,1.3,3.72,1.55,'換気顕熱負荷','Q̇vent = ṁcpΔT\nṁ: 質量流量',GREEN,14,15)
          box(s,8.85,1.3,3.72,1.55,'車内負荷','乗客・照明・機器などの発熱を Q̇internal として加える。',WARM,14,13)
          text(s,1.25,3.42,10.8,0.48,'Q̇load = Q̇outside + Q̇vent + Q̇internal',22,True,NAVY,PP_ALIGN.CENTER)
          text(s,1.85,4.15,9.6,0.46,'Pelec = Q̇target / COP',21,True,ACCENT,PP_ALIGN.CENTER)
          box(s,1.1,4.95,5.2,1.2,'車両への接続','車室を一つの制御体積として、外から入る熱・換気・内部発熱を合計し、必要な冷房能力と電力へ落とす。',MID,13,11.5)
          box(s,7.0,4.95,5.2,1.2,'品質境界','空調能力、COP、換気量、U値、乗客発熱などの未確認実車値は真値化しない。教材例は仮定値と明示する。',MID,13,11.5)
          footer(s,5)

          # 6: algorithm / mapping
          s=prs.slides.add_slide(blank); title(s,'5. 本試験での解法フローと品質境界')
          steps=[('1','既知量を抽出'),('2','J / W / kW・秒へ単位統一'),('3','伝導・対流・放射・ヒートポンプを判定'),('4','熱収支を立てる'),('5','公式を選び、求める量へ変形'),('6','数値代入 → 桁・単位・物理的妥当性を検算')]
          y=1.35
          for num,label in steps:
              c=s.shapes.add_shape(MSO_SHAPE.OVAL,Inches(0.85),Inches(y),Inches(0.55),Inches(0.55)); c.fill.solid(); c.fill.fore_color.rgb=ACCENT; c.line.fill.background()
              text(s,0.85,y+0.07,0.55,0.3,num,12,True,WHITE,PP_ALIGN.CENTER)
              text(s,1.55,y+0.05,5.0,0.42,label,13.3,False,BLACK)
              y+=0.78
          box(s,7.05,1.35,5.25,2.25,'固定過去問への接続','R8問6: 電熱・熱伝導・水加熱・放射\nR3問7: 熱平衡・伝導・対流・放射\nR1問7: 圧縮機駆動・凝縮器側加熱\nH30問4: 位相制御・高調波・伝導・放射・対流\nH27問4: 冷凍サイクル・COP・HFC過去問固有知識',NAVY,14,11.3)
          box(s,7.05,4.0,5.25,1.55,'SPEC 7項目','熱量 / 熱収支 / COP / 消費電力 / 外気負荷 / 車内負荷 / 効率',GREEN,14,13)
          text(s,7.18,5.92,4.95,0.7,'固定EXAM_ALIGNMENT変更 0件\n未確認実車値の真値化 0件\nTopic 21一般式変更 0件',10.5,False,GREY,PP_ALIGN.CENTER)
          footer(s,6)

          prs.save(out)
          print('saved', out, out.stat().st_size)
          PY

      - name: Render QA and write QA record
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance'
          PPTX="$BASE/33_hvac_thermal_balance_images.pptx"
          OUT=/tmp/topic33_pptx_render
          rm -rf "$OUT" && mkdir -p "$OUT"
          libreoffice --headless --convert-to pdf --outdir "$OUT" "$PPTX" >/tmp/lo.txt 2>&1
          PDF="$OUT/33_hvac_thermal_balance_images.pdf"
          test -f "$PDF"
          pdftoppm -png -r 160 "$PDF" "$OUT/slide" >/dev/null 2>&1
          pdftotext -layout "$PDF" "$OUT/text.txt"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pptx import Presentation
          import hashlib

          base=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance')
          pptx=base/'33_hvac_thermal_balance_images.pptx'
          qa=base/'33_hvac_thermal_balance_images_qa.md'
          render=Path('/tmp/topic33_pptx_render')
          prs=Presentation(str(pptx))
          assert len(prs.slides)==6, len(prs.slides)
          W,H=prs.slide_width,prs.slide_height
          for si,slide in enumerate(prs.slides,1):
              for shape in slide.shapes:
                  assert shape.left >= 0 and shape.top >= 0, (si,shape.name)
                  assert shape.left + shape.width <= W, (si,shape.name,'right overflow')
                  assert shape.top + shape.height <= H, (si,shape.name,'bottom overflow')

          imgs=sorted(render.glob('slide-*.png'))
          assert len(imgs)==6, len(imgs)
          blank=edge=0
          for p in imgs:
              im=Image.open(p).convert('L')
              mask=im.point(lambda v: 0 if v>=248 else 255)
              bbox=mask.getbbox()
              if bbox is None:
                  blank += 1; continue
              l,t,r,b=bbox
              if l<5 or t<5 or r>im.width-5 or b>im.height-5:
                  edge += 1
          assert blank==0, blank
          assert edge==0, edge

          txtp=render/'text.txt'
          txt=txtp.read_text(encoding='utf-8',errors='replace')
          assert '\ufffd' not in txt
          required=['I²R','kAΔT/L','hA','Stefan','COP','QH','QL','UAΔT','SPEC 7項目','R8問6','R3問7','R1問7','H30問4','H27問4']
          for token in required:
              assert token in txt, token

          sha=hashlib.sha256(pptx.read_bytes()).hexdigest()
          size=pptx.stat().st_size
          tbytes=txtp.stat().st_size
          lines=[
              '# Topic 33 PowerPoint QA — 空調・電熱の熱収支','',
              '更新日: 2026-09-20','',
              '判定: `PASS / POWERPOINT_COMPLETE`','',
              '## reconcile','',
              '最新main、`MASTER_SPEC.md`、`EXAM_ALIGNMENT_SPEC.md`、系列`SPEC.md`、`STATUS.md` / `HANDOFF.md`、Topic 33の固定EXAM_ALIGNMENT、解説source/PDF、練習source/PDFと各QAをreconcileし、未完了だった解説画像PowerPointのみを作成した。固定EXAM_ALIGNMENT・問題・正答は変更していない。','',
              '## canonical artifact','',
              '- path: `33_hvac_thermal_balance_images.pptx`',
              f'- file size: `{size} bytes`',
              f'- SHA-256: `{sha}`',
              '- 16:9 / `6 slides`',
              '- python-pptx open / geometry bounds: `6 / 6 PASS`',
              '- LibreOffice PDF変換: `6 / 6 pages PASS`',
              f'- `pdftotext -layout`: `PASS ({tbytes} bytes)`',
              '- 置換文字 `�`: `0件`',
              '- PNG render: `6 / 6 PASS`',
              '- blank render: `0件`',
              '- ページ端越え: `0件`','',
              '## slide構成','',
              '1. 試験範囲と電気→熱→空調の全体像',
              '2. ジュール熱・顕熱・一次元定常熱伝導・熱平衡',
              '3. 対流・放射・伝導の識別、位相制御と高調波',
              '4. ヒートポンプ熱収支、冷房/暖房COP、圧縮機・HFC過去問固有境界',
              '5. 外気/換気/車内負荷、空調消費電力、新幹線への一般設計接続',
              '6. 本試験解法フロー、固定5問マッピング、SPEC 7項目、品質境界','',
              '## 固定過去問接続','',
              '- R8 一次「機械」問6: `5 / 5 PASS`',
              '- R3 一次「機械」問7: `5 / 5 PASS`',
              '- R1 一次「機械」問7 ヒートポンプ行: `2 / 2 PASS`',
              '- H30 一次「機械」問4: `5 / 5 PASS`',
              '- H27 一次「機械」問4: `5 / 5 PASS`',
              '- 一次合計: `22 / 22 connected`',
              '- 二次: `対象外（公式「機械・制御」試験範囲に電熱なし）`','',
              '## SPEC gate','',
              '- 熱量: `PASS`',
              '- 熱収支: `PASS`',
              '- COP: `PASS`',
              '- 消費電力: `PASS`',
              '- 外気負荷: `PASS`',
              '- 車内負荷: `PASS`',
              '- 効率: `PASS`',
              '- SPEC固定7項目: `7 / 7 PASS`','',
              '## 境界確認','',
              '- 二次問題の件数合わせ採用: `0件`',
              '- COPと電熱器効率の混同: `0件`',
              '- HFC過去問固有知識を現行実車仕様へ一般化: `0件`',
              '- 未確認実車値の真値化: `0件`',
              '- 固定EXAM_ALIGNMENT変更: `0件`',
              '- Topic 21一般式変更: `0件`',
              '- exact blocker: `0件`','',
              'Topic 33は教材成果物一式が揃った。次工程はanswer-bearing資料を先に開かないfresh workerによるclean blind candidate固定。本runはanswer-bearing資料を確認済みのためcandidate作成へ進まない。',''
          ]
          qa.write_text('\n'.join(lines),encoding='utf-8')
          print('slides',len(prs.slides),'sha256',sha)
          PY

      - name: Commit PowerPoint and QA; remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE='denken-shinkansen/05_shinkansen_vehicle_2/topics/33_hvac_thermal_balance'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f '.github/workflows/tmp_topic33_pptx.yml'
          git add -A
          git commit -m 'Add Topic 33 PowerPoint and QA'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
