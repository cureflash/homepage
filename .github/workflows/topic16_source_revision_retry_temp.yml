name: Topic 16 source revision retry

on:
  push:
    paths:
      - '.github/workflows/topic16_source_revision_retry_temp.yml'

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize current handoff tail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 次工程\n'
          head, sep, _ = text.rpartition(marker)
          if not sep:
              raise SystemExit('HANDOFF final next-step section not found')
          expected = '固定範囲を広げず、R7一次「機械」問4 (3) に必要な自己消弧形スイッチング素子の最小説明をmain sourceへ補い、練習sourceの当該EXAM_ALIGNMENT対応を修正する。必要なPDF・PowerPointにも同じ最小補正を同期する。その後、公式解答と本QAを先読み対象から外す再解答ゲートを作り直す。\n'
          p.write_text(head + sep + expected, encoding='utf-8')
          PY
      - name: Apply verified source correction
        run: python denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/_revise_topic16_sources.py
      - name: Commit corrected sources and progress
        shell: bash
        run: |
          set -euo pipefail
          OLD_SCRIPT='denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/_revise_topic16_sources.py'
          OLD_WORKFLOW='.github/workflows/topic16_source_revision_temp.yml'
          RETRY_WORKFLOW='.github/workflows/topic16_source_revision_retry_temp.yml'
          git rm "$OLD_SCRIPT" "$OLD_WORKFLOW" "$RETRY_WORKFLOW"
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md \
                  denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md \
                  denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/16_700series_multilevel_converter_pwm.md \
                  denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/16_700series_multilevel_converter_pwm_practice_source.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'denken: correct Topic 16 blind QA source gap'
          for try in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
