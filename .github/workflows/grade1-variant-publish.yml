name: Grade 1 worksheet variant publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grade1-variant-publish.yml'
      - 'scripts/worksheet_factory.py'
      - 'tests/test_grade1_variant_publisher.py'
      - 'tests/test_grade1_multi_page_renderer.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Reconcile latest main and validate grade 1 factory
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_worksheet_factory.py')
          text = path.read_text(encoding='utf-8')
          old = "assert 'draw_numbered_problem(c, x, y, i+1, p, answer_text(p))' in renderer_source"
          new = "assert 'draw_numbered_problem' in renderer_source\nassert 'problem_page_chunks' in renderer_source"
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
            python scripts/publish_grade1_variants.py . --seeds 202 303
            python tests/test_grade1_variant_publisher.py
            python tests/test_grade1_remaining_skills.py
            python tests/test_grade1_multi_page_renderer.py
            python tests/test_worksheet_factory.py
            before=$(git rev-parse origin/main)
            git fetch origin main
            after=$(git rev-parse origin/main)
            if [ "$before" = "$after" ]; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo 'main kept moving; aborting rather than validating stale state' >&2
              exit 1
            fi
          done
      - name: Commit validated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worksheet-factory-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add tests/test_worksheet_factory.py worksheets/catalog.json materials/worksheets/elementary/grade-01/
          if git diff --cached --quiet; then
            echo 'No grade-1 checkpoint changes to publish.'
            exit 0
          fi
          git commit -m 'Update grade 1 factory validation checkpoint'
          git push origin HEAD:main
