name: Validate formal Physics capacitor candidate

on:
  push:
    branches:
      - automation/science-physics-capacitors-20260829
    paths:
      - '.github/workflows/science-physics-capacitor-candidate.yml'
      - 'scripts/science_physics_capacitors.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_physics_capacitors.py'
      - '.github/workflows/science-physics-publish.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/science-physics-capacitors-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check reportlab
      - name: Run full formal Physics regression
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py
          python tests/test_science_physics_waves.py
          python tests/test_science_physics_sound.py
          python tests/test_science_physics_light.py
          python tests/test_science_physics_light_numeric.py
          python tests/test_science_physics_electric_field_potential.py
          python tests/test_science_physics_capacitors.py
      - name: Generate prospective 120 PDFs and validate catalog
        run: |
          python scripts/publish_science_physics.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog
          root=Path('.')
          catalog=json.loads((root/'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows=[x for x in catalog if x.get('id','').startswith('science-physics-motion-')]
          assert len(rows)==2280, len(rows)
          assert len({x['content_hash'] for x in rows})==2280
          assert Counter(x['answer_type'] for x in rows)==Counter({'numeric':1600,'accepted-set':680})
          assert Counter(x['unit'] for x in rows)['電気と磁気：コンデンサー']==120
          for entry in rows:
              p=root/entry['url']; data=p.read_bytes()
              assert data.startswith(b'%PDF') and p.stat().st_size>1000 and b'/Count 2' in data
          print('Candidate 2280-row catalog/PDF validation: OK')
          PY
