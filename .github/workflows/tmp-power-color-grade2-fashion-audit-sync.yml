name: Temporary Power Color Grade 2 fashion audit sync

on:
  push:
    branches:
      - power-color-grade2-fashion-classification-audit-20260902-1620

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-fashion-classification-audit-20260902-1620
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync canonical Grade 2 docs after source audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p,v) => fs.writeFileSync(p, JSON.stringify(v,null,2)+'\n');

          const statusPath='docs/power-color/STATUS.json';
          const handoffPath='docs/power-color/90_HANDOFF.md';
          const planPath='docs/power-color/50_GRADE2_EXECUTION_PLAN.md';
          const invPath='docs/power-color/51_GRADE2_CONCEPT_SOURCE_INVENTORY.md';

          const status=readJson(statusPath);
          assert.equal(status.grade2.runtime_questions.verified,192);
          assert.equal(status.grade3.complete,false);
          assert.equal(status.grade3.source_display_gates_relaxed,false);
          status.grade2.next='Acquire an explicit auditable nonvisual answer rule for the next official-text topic, ファッションの配色 p.095. ファッションの分類 p.091 is source-blocked.';
          status.current_run={
            checkpoints_completed:2,
            generated:0,
            checked:12,
            verified:12,
            revision_events:0,
            needs_revision:0,
            rejected:0,
            pending:0,
            checkpoint_breakdown:[
              'Promoted the previously independently verified pc2.fashion.basic_trend_color_classification 12-question batch record-identically into Grade 2 runtime 180 to 192 and extended exact-equality/full-fingerprint/shared Power TOEIC engine gates to all sixteen promoted skills.',
              'Audited the next official-text topic ファッションの分類 p.091. Current public first-party material confirms scope/order but no sufficiently explicit deterministic nonvisual classification rule was found, so authoring is source-blocked rather than inferred; continue at ファッションの配色 p.095.'
            ]
          };
          status.next='Source-acquire ファッションの配色 p.095; do not author until an explicit auditable nonvisual rule is fixed.';
          writeJson(statusPath,status);

          let handoff=fs.readFileSync(handoffPath,'utf8');
          assert.ok(handoff.includes('Grade 2 runtime is 192 verified / pending 0 across sixteen promoted skills.'));
          handoff=handoff.replace(
            'Visual Design remains source-blocked because reviewed public first-party material confirms scope/order but does not expose a sufficiently explicit nonvisual answer rule.\n\nGrade 3 runtime remains 223 verified / pending 0 and incomplete.',
            'Visual Design remains source-blocked because reviewed public first-party material confirms scope/order but does not expose a sufficiently explicit nonvisual answer rule.\n\nThe next official-text topic `ファッションの分類` p.091 was separately audited. Public first-party material confirms the topic/order, and current preparation material corroborates the lesson name, but no sufficiently explicit auditable deterministic classification mapping was exposed. Therefore p.091 authoring is source-blocked; do not infer categories from garments, silhouettes, photographs, RGB/HEX, swatches or unstated geometry. Audit: `docs/power-color/audits/2026-09-02-grade2-fashion-classification-source-audit.md`.\n\nGrade 3 runtime remains 223 verified / pending 0 and incomplete.'
          );
          handoff=handoff.replace(
            'Continue in current official Grade 2 text order after `ファッションカラーの分類`. Acquire explicit auditable authority for the next source-resolvable nonvisual topic before authoring. Keep Visual Design source-blocked and keep all existing source/display gates unchanged.',
            'Continue in current official Grade 2 text order at `ファッションの配色` p.095. Acquire an explicit auditable nonvisual answer rule before authoring. Keep `ファッションの分類` p.091 and Visual Design source-blocked, and keep all existing source/display gates unchanged.'
          );
          fs.writeFileSync(handoffPath,handoff);

          let plan=fs.readFileSync(planPath,'utf8');
          assert.ok(plan.includes('Grade 2 runtime is 192 verified / pending 0 across sixteen promoted skills.'));
          const exact='## Exact next start point\n\nContinue current official Grade 2 text order after `ファッションカラーの分類`. Acquire explicit auditable authority for the next source-resolvable nonvisual topic before authoring. Visual Design remains source-blocked.';
          assert.ok(plan.includes(exact));
          const section='## Fashion — classification p.091 source audit\n\n- [x] Current official Grade 2 TOC places `ファッションの分類` at p.091 after `ファッションカラーの分類` p.090 and before `ファッションの配色` p.095.\n- [x] Audit current public first-party material and current auditable preparation material for an explicit deterministic nonvisual classification rule.\n- [x] Record blocker: reviewed sources expose scope/topic naming but not a sufficiently explicit auditable category-membership rule; do not infer from garments, silhouettes, photographs, current trends, RGB/HEX, swatches or unstated geometry.\n- [x] Record audit in `docs/power-color/audits/2026-09-02-grade2-fashion-classification-source-audit.md`.\n- [ ] Authoring remains blocked unless a future explicit auditable rule source is acquired.\n\n';
          plan=plan.replace('## Exact next start point\n',section+'## Exact next start point\n');
          plan=plan.replace(exact,'## Exact next start point\n\nContinue current official Grade 2 text order at `ファッションの配色` p.095. Acquire an explicit auditable nonvisual answer rule before authoring. `ファッションの分類` p.091 and Visual Design remain source-blocked.');
          fs.writeFileSync(planPath,plan);

          let inv=fs.readFileSync(invPath,'utf8');
          assert.ok(inv.includes('All sixteen skills are runtime-promoted record-identically. Grade 2 runtime frontier is 192 verified / pending 0.'));
          inv=inv.replace(
            '- Fashion: `ファッションカラーの分類` has a narrow source-resolved basic/trend text-only slice; later fashion classification/配色 material remains unresolved until separately sourced.',
            '- Fashion: `ファッションカラーの分類` narrow basic/trend slice is promoted; `ファッションの分類` p.091 is source-blocked after explicit audit; next source-acquisition frontier is `ファッションの配色` p.095.'
          );
          const start=inv.indexOf('## Exact next order');
          assert.ok(start>=0);
          inv=inv.slice(0,start)+`## Exact next order\n\n1. Grade 2 runtime frontier is 192 verified / pending 0 across sixteen promoted skills.\n2. Keep \`ファッションの分類\` p.091 source-blocked unless a future explicit auditable deterministic classification rule is acquired.\n3. Continue source acquisition at \`ファッションの配色\` p.095.\n4. Author only after fixing an explicit nonvisual answer rule; then use pending-first → independent QA → schema/full-fingerprint/coverage/answer-position/shared-renderer gates → record-identical promotion.\n5. Keep Visual Design source-blocked and all Grade 3 source/display gates unchanged.\n`;
          fs.writeFileSync(invPath,inv);
          NODE

          cd qualifications/color-certification
          npm test
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/power-color/STATUS.json docs/power-color/90_HANDOFF.md docs/power-color/50_GRADE2_EXECUTION_PLAN.md docs/power-color/51_GRADE2_CONCEPT_SOURCE_INVENTORY.md docs/power-color/audits/2026-09-02-grade2-fashion-classification-source-audit.md
          git commit -m 'Power Color Grade 2: record fashion classification source blocker'
          git push origin HEAD:power-color-grade2-fashion-classification-audit-20260902-1620
