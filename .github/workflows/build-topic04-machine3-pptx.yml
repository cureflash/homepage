name: Build Machine 3 Topic 04 PowerPoint

on:
  push:
    branches: [main]
    paths:
      - '.github/automation/topic04_machine3_pptx.py'
      - '.github/workflows/build-topic04-machine3-pptx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-pptx==1.0.2
      - name: Generate PowerPoint
        run: python .github/automation/topic04_machine3_pptx.py
      - name: Validate PowerPoint archive
        run: unzip -t denken-shinkansen/03_shinkansen_machine_3/topics/04_induction_motor/04_induction_motor_images.pptx
      - name: Commit generated PowerPoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add denken-shinkansen/03_shinkansen_machine_3/topics/04_induction_motor/04_induction_motor_images.pptx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "機械三種 Topic 04 PowerPointを再生成"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
