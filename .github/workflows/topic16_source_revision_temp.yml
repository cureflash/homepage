name: Topic 16 source revision

on:
  push:
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/_revise_topic16_sources.py'

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified source correction
        run: python denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/_revise_topic16_sources.py
      - name: Commit corrected sources and progress
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/_revise_topic16_sources.py'
          WORKFLOW='.github/workflows/topic16_source_revision_temp.yml'
          git rm "$SCRIPT" "$WORKFLOW"
          git add denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md \
                  denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md \
                  denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/16_700series_multilevel_converter_pwm.md \
                  denken-shinkansen/05_shinkansen_vehicle_2/topics/16_700series_multilevel_converter_pwm/16_700series_multilevel_converter_pwm_practice_source.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'denken: correct Topic 16 blind QA source gap'
          for try in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
