name: Topic 30 practice PDF diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic30-practice-pdf-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect text mapping
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils >/dev/null
          python -m pip install -q markdown weasyprint
          SRC='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice_source.md'
          PDF='/tmp/topic30-practice.pdf'
          test "$(git hash-object "$SRC")" = '4a9b6c802a9182225594b4ce7274d98c931d120a'
          python - <<'PY'
          from pathlib import Path
          import markdown
          from weasyprint import HTML
          src=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice_source.md')
          body=markdown.markdown(src.read_text(encoding='utf-8'), extensions=['tables','fenced_code','sane_lists'])
          css='''@page{size:A4 portrait;margin:13mm 13mm 15mm 13mm}html,body{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;font-size:9.4pt;line-height:1.42}code,pre{font-family:"Noto Sans Mono CJK JP","Noto Sans Mono",monospace}table{width:100%;border-collapse:collapse}th,td{border:.45pt solid #888;padding:3pt;overflow-wrap:anywhere}'''
          HTML(string=f'<!doctype html><html lang="ja"><meta charset="utf-8"><style>{css}</style><body>{body}</body></html>', base_url=str(src.parent)).write_pdf('/tmp/topic30-practice.pdf')
          PY
          pdftotext -layout "$PDF" /tmp/topic30-practice.txt
          python - <<'PY'
          from pathlib import Path
          t=Path('/tmp/topic30-practice.txt').read_text(encoding='utf-8',errors='replace')
          pos=[i for i,c in enumerate(t) if c=='\ufffd']
          print('REPLACEMENT_COUNT=',len(pos))
          for n,i in enumerate(pos[:50],1):
              print(f'REPLACEMENT_{n}_INDEX={i} CONTEXT={t[max(0,i-80):i+81]!r}')
          if not pos:
              print('NO_REPLACEMENTS')
          PY
