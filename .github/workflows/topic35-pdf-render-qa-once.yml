name: Topic 35 PDF render QA one-shot

on:
  push:
    branches:
      - main
    paths:
      - denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_render_qa/BUILD

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF QA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install -q pypdfium2 pillow
      - name: Run renderer QA
        run: |
          set -euo pipefail
          python .github/scripts/topic35_pdf_qa.py
      - name: Commit QA result and remove temporary files
        run: |
          set -euo pipefail
          rm -rf denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_render_qa
          rm -f .github/scripts/topic35_pdf_qa.py
          rm -f .github/workflows/topic35-pdf-render-qa-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Topic 35 PDF renderer QA result'
          git push origin HEAD:main
