name: tmp-machine2-topic21-powerpoint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-machine2-topic21-powerpoint.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile current state
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          STATUS='denken-shinkansen/07_shinkansen_machine_2/STATUS.md'
          HANDOFF='denken-shinkansen/07_shinkansen_machine_2/HANDOFF.md'
          TARGET='denken-shinkansen/07_shinkansen_machine_2/topics/21_readhesion_control/21_readhesion_control_images.pptx'
          grep -Fq 'current_status: `topic_21_practice_pdf_complete / IN_PROGRESS`' "$STATUS" || { echo 'BLOCKER: Topic 21 state already advanced'; exit 21; }
          test ! -e "$TARGET" || { echo 'BLOCKER: Topic 21 PowerPoint already exists'; exit 22; }
          test "$(git rev-parse HEAD:$STATUS)" = 'bc8e503860b4fe219aa54a9aa2c0b38558bb4ed6' || { echo 'BLOCKER: STATUS.md changed'; exit 23; }
          test "$(git rev-parse HEAD:$HANDOFF)" = '5211bf0107532848d7e1dbfe7ef1bb3107ce18d6' || { echo 'BLOCKER: HANDOFF.md changed'; exit 24; }
      - name: Restore canonical PowerPoint bytes
        shell: bash
        run: |
          set -euo pipefail
          TARGET='denken-shinkansen/07_shinkansen_machine_2/topics/21_readhesion_control/21_readhesion_control_images.pptx'
          cat .github/tmp/machine2_topic21_pptx/part{0,1,2,3,4}.b64 | base64 -d > "$TARGET"
          test "$(stat -c%s "$TARGET")" = '23504'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = 'b9e6ea2ba9b9e777c83a228f37083a0e851ad5ee2e116cceef2715c410dcca6b'
          test "$(git hash-object "$TARGET")" = '7ffe275cd71f0e4bc77b3bec80ada187487dab09'
      - name: Structural and render QA
        shell: bash
        run: |
          set -euo pipefail
          TARGET='denken-shinkansen/07_shinkansen_machine_2/topics/21_readhesion_control/21_readhesion_control_images.pptx'
          unzip -t "$TARGET" >/dev/null
          python -m pip install --quiet python-pptx
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/07_shinkansen_machine_2/topics/21_readhesion_control/21_readhesion_control_images.pptx'
          r=Presentation(p)
          assert len(r.slides)==4
          assert abs((r.slide_width/r.slide_height)-(16/9)) < 1e-4
          for slide in r.slides:
              for sh in slide.shapes:
                  assert sh.left >= 0 and sh.top >= 0
                  assert sh.left + sh.width <= r.slide_width + 2
                  assert sh.top + sh.height <= r.slide_height + 2
          PY
          if ! command -v libreoffice >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils >/dev/null
          fi
          mkdir -p /tmp/topic21_render
          libreoffice --headless --convert-to pdf --outdir /tmp/topic21_render "$TARGET" >/tmp/topic21_lo.txt 2>&1
          PDF='/tmp/topic21_render/21_readhesion_control_images.pdf'
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = '4'
          pdftoppm -png -scale-to-x 1600 -scale-to-y 900 "$PDF" /tmp/topic21_render/slide >/dev/null 2>&1
          test "$(find /tmp/topic21_render -maxdepth 1 -name 'slide-*.png' | wc -l)" = '4'
          pdftotext "$PDF" /tmp/topic21_render/text.txt
          ! grep -Fq '�' /tmp/topic21_render/text.txt
          ! grep -Fq '(cid:' /tmp/topic21_render/text.txt
      - name: Finalize QA and progress
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp/finalize_machine2_topic21_pptx.py
      - name: Commit canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HIkaru Furuta'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add \
            denken-shinkansen/07_shinkansen_machine_2/topics/21_readhesion_control/21_readhesion_control_images.pptx \
            denken-shinkansen/07_shinkansen_machine_2/topics/21_readhesion_control/21_readhesion_control_powerpoint_qa.md \
            denken-shinkansen/07_shinkansen_machine_2/STATUS.md \
            denken-shinkansen/07_shinkansen_machine_2/HANDOFF.md
          git commit -m 'denken machine2: complete Topic 21 PowerPoint'
          git pull --rebase origin main
          git push origin HEAD:main
