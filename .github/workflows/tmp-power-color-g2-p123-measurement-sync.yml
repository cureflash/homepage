name: Temporary Power Color Grade 2 p123 measurement sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation-trigger-power-color-g2-p123-measurement-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/power-color-g2-p123-measurement-sync-20260903'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize canonical Power Color state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const statusPath = 'docs/power-color/STATUS.json';
          const handoffPath = 'docs/power-color/90_HANDOFF.md';
          const plan20Path = 'docs/power-color/20_EXECUTION_PLAN.md';
          const plan50Path = 'docs/power-color/50_GRADE2_EXECUTION_PLAN.md';

          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          status.checked_on = '2026-09-03';
          status.grade2.runtime_questions = {verified: 336, pending: 0, needs_revision: 0, rejected: 0};
          if (!status.grade2.runtime_skills.includes('pc2.landscape.surrounding_environment_measurement')) status.grade2.runtime_skills.push('pc2.landscape.surrounding_environment_measurement');
          status.grade2.active_skill = null;
          status.grade2.active_authoring = null;
          status.grade2.active_authoring_qa = null;
          status.grade2.latest_authoring_gate = {status:'passed', workflow_run:33678931801, head:'8bc7cbce1d44fc6123e6462d077103ada61521ce', pr:584, merge_commit:'abda2407f0f9339948b12a8b9017a9f78f2b3c4c'};
          status.grade2.latest_promotion_gate = {status:'passed', workflow_run:33679550547, head:'a20c86ce0bf6929b2542ed6821536e4c059b147f', pr:586, merge_commit:'c2aa6a4384d5a3dc7b967bf932b2486795cadbba'};
          status.grade2.next = 'Continue official Grade 2 text order at Landscape p.124 配色計画. Source-resolve a distinct deterministic nonvisual boundary before authoring; otherwise record source-blocked.';
          status.current_run = {
            checkpoints_completed: 4,
            generated: 12,
            checked: 12,
            verified: 12,
            revision_events: 0,
            needs_revision: 0,
            rejected: 0,
            pending: 0,
            checkpoint_breakdown: [
              'Reconciled latest main/open PRs/branches and found PR #584 already covering the exact p.123 surrounding-environment-measurement checkpoint; no duplicate source investigation or authoring was performed.',
              'Verified PR #584 authoring CI 33678931801 success and merged it as abda2407f0f9339948b12a8b9017a9f78f2b3c4c. The batch contains 12 independently rechecked verified records with A/B/C/D=3/3/3/3 and narrow nonvisual source boundaries.',
              'Promoted pc2.landscape.surrounding_environment_measurement record-identically: runtime 324 -> 336 and skills 27 -> 28. Dedicated exact-equality/full-fingerprint/shared-engine tests passed in temporary promotion run 33679550547; PR #586 merged as c2aa6a4384d5a3dc7b967bf932b2486795cadbba.',
              'Synchronized STATUS/HANDOFF/20_EXECUTION_PLAN/50_GRADE2_EXECUTION_PLAN and removed temporary promotion machinery.'
            ]
          };
          status.next = 'Landscape p.124 配色計画 source acquisition/audit. Do not author until a distinct auditable deterministic nonvisual rule set is source-confirmed.';
          fs.writeFileSync(statusPath, JSON.stringify(status, null, 2) + '\n');

          let handoff = fs.readFileSync(handoffPath, 'utf8');
          handoff = handoff.replace('Grade 2 runtime is 324 verified / pending 0 across twenty-seven promoted skills.', 'Grade 2 runtime is 336 verified / pending 0 across twenty-eight promoted skills.');
          const handoffInsert = `\nLandscape p.123 \`色を測ることによる周辺環境の把握\` is source-resolved under \`docs/power-color/audits/2026-09-03-grade2-landscape-p123-surrounding-measurement-source-audit.md\`. The accepted boundary is text-only: current Grade 2 scope/order, surrounding-environment survey by visual colorimetry, Munsell hue/value/chroma representation, paper/JIS Munsell comparison charts, and the distinction between quantitative color-value review and qualitative surrounding-landscape harmony. No RGB/HEX/display inference, place-specific measured values, local color-limit generalization, unstated geometry/lighting/tolerances or image-derived answers are authorized.\n\nAll 12 \`pc2.landscape.surrounding_environment_measurement\` records were independently rechecked and promoted record-identically. Runtime 324 → 336 and twenty-seven → twenty-eight skills. Authoring CI \`33678931801\` passed and PR #584 merged as \`abda2407f0f9339948b12a8b9017a9f78f2b3c4c\`; promotion gate \`33679550547\` passed and PR #586 merged as \`c2aa6a4384d5a3dc7b967bf932b2486795cadbba\`.\n`;
          if (!handoff.includes('pc2.landscape.surrounding_environment_measurement')) {
            handoff = handoff.replace('\nVisual Design, Fashion p.091/p.095/p.096, Interior p.104, p.107 and p.111 remain source-blocked.', handoffInsert + '\nVisual Design, Fashion p.091/p.095/p.096, Interior p.104, p.107 and p.111 remain source-blocked.');
          }
          handoff = handoff.replace(/## Exact next start point[\s\S]*?Keep all Grade 3 blockers and source\/display gates unchanged\./, `## Exact next start point\n\nContinue current official Grade 2 text order at Landscape p.124 \`配色計画\`. Acquire a distinct auditable deterministic nonvisual source boundary before authoring. Do not infer fixed palette values, RGB/HEX/display attributes, image appearance, unstated geometry, or local regulatory limits. If current public authority is insufficient, record the topic source-blocked rather than manufacturing a 12-question batch.\n\nKeep all Grade 3 blockers and source/display gates unchanged.`);
          fs.writeFileSync(handoffPath, handoff);

          let p20 = fs.readFileSync(plan20Path, 'utf8');
          p20 = p20.replace('runtime frontier is 324 verified / pending 0 across twenty-seven promoted skills.', 'runtime frontier is 336 verified / pending 0 across twenty-eight promoted skills.');
          p20 = p20.replace('- [ ] Continue official Grade 2 text order at Landscape p.123 `色を測ることによる周辺環境の把握`; source-resolve a distinct deterministic nonvisual rule set before any authoring, or record source-blocked if public authority is insufficient.', '- [x] Source-resolve Landscape p.123 `色を測ることによる周辺環境の把握` to a narrow deterministic nonvisual visual-colorimetry/Munsell/JIS representation boundary.\n- [x] Create `pc2.landscape.surrounding_environment_measurement` pending-first and independently QA every record: 12/12 verified, pending 0, A/B/C/D=3/3/3/3.\n- [x] Add and pass the dedicated source/full-fingerprint/nonvisual/shared-renderer pre-promotion gate and normal Power Color regression; workflow run `33678931801`, PR #584 merged as `abda2407f0f9339948b12a8b9017a9f78f2b3c4c`.\n- [x] Promote the 12 verified `pc2.landscape.surrounding_environment_measurement` records record-identically; runtime 324 → 336 and twenty-seven → twenty-eight skills.\n- [x] Extend exact-equality/full-fingerprint/shared Power TOEIC engine coverage to twenty-eight promoted skills; promotion run `33679550547` succeeded and PR #586 merged as `c2aa6a4384d5a3dc7b967bf932b2486795cadbba`.\n- [ ] Continue official Grade 2 text order at Landscape p.124 `配色計画`; source-resolve a distinct deterministic nonvisual rule set before any authoring, or record source-blocked if public authority is insufficient.');
          fs.writeFileSync(plan20Path, p20);

          let p50 = fs.readFileSync(plan50Path, 'utf8');
          p50 = p50.replace('Grade 2 runtime is 324 verified / pending 0 across twenty-seven promoted skills.', 'Grade 2 runtime is 336 verified / pending 0 across twenty-eight promoted skills.');
          p50 = p50.replace('All twenty-seven promoted skills are covered by exact-equality/full-fingerprint/shared-engine gates. The latest promotion passed Power Color CI run `33678211235`; PR #582 merged as `6d64629b0bd8f5c5f305fce21f1d1d48c3a4234a`.', 'All twenty-eight promoted skills are covered by exact-equality/full-fingerprint/shared-engine gates. The latest promotion passed deterministic promotion run `33679550547`; PR #586 merged as `c2aa6a4384d5a3dc7b967bf932b2486795cadbba`.');
          const section = `\n## Landscape p.123 \`色を測ることによる周辺環境の把握\` — promoted\n\nAudit: \`docs/power-color/audits/2026-09-03-grade2-landscape-p123-surrounding-measurement-source-audit.md\`.\n\nAccepted boundary for \`pc2.landscape.surrounding_environment_measurement\` is text-only/nonvisual:\n- the current official Grade 2 scope includes understanding surrounding-environment color by measuring color;\n- current professional training explicitly describes actual surrounding-environment color investigation as visual colorimetry (\`視感測色\`);\n- landscape review may use quantitative Munsell values while separately evaluating qualitative harmony with surrounding landscape;\n- Munsell representation uses hue, value/lightness and chroma (\`色相・明度・彩度\`);\n- standardized physical/JIS color charts based on the Munsell system support visual comparison.\n\nDo not infer RGB/HEX/display values, monitor swatches, place-specific measured values, local color limits, fixed palette recommendations, image appearance, unstated observation geometry/lighting/tolerances, or numerical-compliance-equals-harmony claims.\n\nState: 12/12 independently verified and promoted record-identically; runtime 324 → 336 and twenty-seven → twenty-eight skills. Authoring CI \`33678931801\` passed; PR #584 merged as \`abda2407f0f9339948b12a8b9017a9f78f2b3c4c\`. Promotion run \`33679550547\` passed; PR #586 merged as \`c2aa6a4384d5a3dc7b967bf932b2486795cadbba\`.\n`;
          if (!p50.includes('## Landscape p.123 `色を測ることによる周辺環境の把握` — promoted')) p50 = p50.replace('\n## Exact next start point', section + '\n## Exact next start point');
          p50 = p50.replace(/## Exact next start point[\s\S]*$/, `## Exact next start point\n\nContinue official Grade 2 text order at Landscape p.124 \`配色計画\`. Acquire a distinct auditable deterministic nonvisual source boundary before authoring. Do not infer fixed palette values, RGB/HEX/display attributes, image appearance, unstated geometry, or local regulatory limits. If current public authority is insufficient, record the topic source-blocked rather than manufacturing a 12-question batch.\n\nKeep all Grade 3 blockers and source/display gates unchanged.`);
          fs.writeFileSync(plan50Path, p50);
          NODE
          rm -f .automation-trigger-power-color-g2-p123-measurement
          rm -f .github/workflows/tmp-power-color-g2-p123-measurement-pr-promote.yml
          rm -f .github/workflows/tmp-power-color-g2-p123-measurement-sync.yml
          rm -f .automation-trigger-power-color-g2-p123-measurement-sync
          node --test qualifications/color-certification/tests/grade2-landscape-surrounding-environment-measurement-authoring.test.js qualifications/color-certification/tests/grade2-runtime-promotion.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync Power Color Grade 2 p123 measurement promotion state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
