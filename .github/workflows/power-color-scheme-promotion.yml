name: Power Color scheme promotion

on:
  push:
    branches:
      - automation/power-color-scheme-runtime-20260831-2250
    paths:
      - 'qualifications/color-certification/**'
      - '.github/workflows/power-color-scheme-promotion.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified duplicate revision
        working-directory: qualifications/color-certification
        run: node tools/revise-scheme-duplicate.mjs
      - name: Apply verified promotion request when present
        working-directory: qualifications/color-certification
        run: node tools/promote-verified-authoring.mjs
      - name: Run Power Color tests
        working-directory: qualifications/color-certification
        run: npm test
      - name: Commit promotion result when tests pass
        shell: bash
        run: |
          if [ -n "$(git status --porcelain qualifications/color-certification)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A qualifications/color-certification
            git commit -m "Power Color: revise and promote scheme identification [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
