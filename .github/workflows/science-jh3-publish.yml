name: Publish junior-high grade 3 physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-jh3-publish.yml'
      - 'scripts/science_physics_jh3_topics.py'
      - 'scripts/science_physics_jh3_mixed_review.py'
      - 'scripts/science_physics_jh3_retrieval.py'
      - 'scripts/publish_science_physics_jh3.py'
      - 'tests/test_science_physics_jh3.py'

permissions:
  contents: write

concurrency:
  group: worksheet-catalog-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and JH3 physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh3.py

      - name: Generate and register complete JH3 physics batch
        run: python scripts/publish_science_physics_jh3.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_physics_jh3.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog
          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [
              x for x in catalog
              if x.get('subject') == '理科'
              and x.get('science_field') == 'physics'
              and x.get('school_level') == 'junior-high'
              and x.get('grade') == 3
          ]
          assert len(rows) == 120, len(rows)
          series = Counter(x['worksheet_series'] for x in rows)
          assert series['focused'] == 90, series
          assert series['mixed'] == 15, series
          assert series['review'] == 15, series
          answers = Counter(x['answer_type'] for x in rows)
          assert answers['numeric'] == 90, answers
          assert answers['accepted-set'] == 30, answers
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes['calculation-basic'] == 40, modes
          assert modes['calculation-reverse'] == 20, modes
          assert modes['calculation-mixed'] == 15, modes
          assert modes['calculation-review'] == 15, modes
          assert modes['retrieval-forward'] == 10, modes
          assert modes['retrieval-reverse'] == 10, modes
          assert modes['retrieval-fill'] == 10, modes
          assert all(x['problem_count'] == (10 if x['answer_type'] == 'accepted-set' else 20) for x in rows)
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('JH3 physics 120-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/junior-high/grade-03/physics/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; JH3 physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish JH3 mixed review and concept worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
