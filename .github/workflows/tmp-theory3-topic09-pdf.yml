name: Temporary Theory3 Topic09 PDF Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-theory3-topic09-pdf.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical Topic 09 explanation PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null
          target='denken-shinkansen/04_shinkansen_theory_3/topics/09_hokuriku_frequency_rlc/09_hokuriku_frequency_rlc_explanation.pdf'
          test -s "$target"
          test "$(pdfinfo "$target" | awk '/^Pages:/ {print $2}')" = '4'
          pdftotext -layout "$target" /tmp/topic09.txt
          test "$(grep -o $'\357\277\275' /tmp/topic09.txt | wc -l)" -eq 0
          for key in 'Topic 09' '50Hz' '60Hz' 'XL = 2πfL' 'XC = 1/(2πfC)' 'f0 = 1/(2π√LC)' '例題1' '例題2' '例題3' 'R8上 理論 問8' 'R7下 理論 問8' 'R6下 理論 問9' 'R6上 理論 問8' 'R5下 理論 問8' 'R5上 理論 問8'; do grep -Fq "$key" /tmp/topic09.txt; done
          mkdir -p /tmp/render
          pdftoppm -r 200 -png "$target" /tmp/render/page >/dev/null 2>&1
          test "$(find /tmp/render -maxdepth 1 -name 'page-*.png' | wc -l)" -eq 4
          for p in /tmp/render/page-{1,2,3,4}.png; do test -s "$p"; done
      - name: Sync progress records and clean temporary build files
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/finalize.py
          python /tmp/finalize.py
          git rm -f .tmp_theory3_topic09/topic09.html.gz.b64
          git rm -f .github/workflows/tmp-theory3-topic09-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denken-shinkansen/04_shinkansen_theory_3/STATUS.md denken-shinkansen/04_shinkansen_theory_3/HANDOFF.md denken-shinkansen/04_shinkansen_theory_3/topics/09_hokuriku_frequency_rlc/09_hokuriku_frequency_rlc.md denken-shinkansen/04_shinkansen_theory_3/topics/09_hokuriku_frequency_rlc/09_hokuriku_frequency_rlc_explanation_qa.md
          git commit -m 'Complete Topic 09 theory explanation PDF stage'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
