name: Topic34 explanation PDF final temporary QA
on:
  push:
    paths:
      - '.github/workflows/topic34-explanation-pdf-finalqa-temp.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk
          pip install 'pypdfium2==4.30.0' 'Pillow==11.3.0'
      - name: Verify PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,hashlib,json
          from PIL import Image,ImageChops
          import pypdfium2 as pdfium
          p=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/34_compressor_pump_fan_load_characteristics/34_compressor_pump_fan_load_characteristics_explanation.pdf')
          t=Path('/tmp/t34'); (t/'pop').mkdir(parents=True); (t/'pui').mkdir()
          info=subprocess.check_output(['pdfinfo',str(p)],text=True,errors='replace')
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1)); s=re.search(r'^Page size:\s+([0-9.]+) x ([0-9.]+) pts',info,re.M); w,h=map(float,s.groups()); a4=abs(w-595.276)<1 and abs(h-841.89)<1
          subprocess.run(['pdftotext','-layout',str(p),str(t/'x.txt')],check=True); text=(t/'x.txt').read_text(encoding='utf-8',errors='replace').replace('\u0332','_'); compact=re.sub(r'\s+','',text)
          q=['3V_1^2','s>0','停動トルク','二次抵抗','T∝s','誘導電動機','s<0','ブラシ','IGBT','V/f','回転角速度','過負荷耐量','定常状態','トルク成分','滑り角周波数','N_s=120f/p','すべり','定格トルク','P_c2','固定損','小すべり','E_d=1.35V_LL','I_d=P_d/E_d','I_1=P_d/(sqrt(3)V_LL)','V_ph,peak=mE_d/2','V_LL,rms','V/f']
          fixed=sum(re.sub(r'\s+','',x) in compact for x in q)
          specs=['電動機出力','負荷トルク','ポンプ動力','ファン動力','回転速度','効率','インバータ制御']; spec=sum(x in text for x in specs)
          ex=['95.5N·m','1500min^-1','4.0%','199N·m','33.3kW','7.59kW','8.63kW','0.75']; examples=sum(re.sub(r'\s+','',x) in compact for x in ex)
          subprocess.run(['pdftoppm','-png','-r','160',str(p),str(t/'pop/p')],check=True,stdout=subprocess.DEVNULL)
          d=pdfium.PdfDocument(str(p)); scale=160/72
          for i in range(len(d)): d[i].render(scale=scale).to_pil().convert('RGB').save(t/f'pui/p-{i+1:02d}.png')
          A=sorted((t/'pop').glob('p-*.png')); B=sorted((t/'pui').glob('p-*.png')); blank=edge=parity_bad=0; parity=[]; bounds=[]
          for a,b in zip(A,B):
              x=Image.open(a).convert('L'); y=Image.open(b).convert('L'); bb=y.point(lambda v:255 if v<245 else 0).getbbox(); bounds.append(bb)
              if not bb: blank+=1
              else:
                  l,top,r,bot=bb; W,H=y.size; edge+=int(l<12 or top<12 or r>W-12 or bot>H-12)
              if x.size!=y.size: x=x.resize(y.size)
              hist=ImageChops.difference(x,y).histogram(); pct=sum(hist[35:])/(y.size[0]*y.size[1])*100; parity.append(round(pct,4)); parity_bad+=int(pct>5.0)
          m={'a4':a4,'pages':pages,'text_chars':len(text),'urep':text.count('\ufffd'),'fixed':fixed,'spec':spec,'examples':examples,'pdfium':len(B),'poppler':len(A),'blank':blank,'edge':edge,'parity_bad_gt5pct':parity_bad,'parity_pct':parity,'bounds':bounds,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}; print('TOPIC34_FINAL_QA='+json.dumps(m,ensure_ascii=False))
          if not (a4 and pages>0 and text.count('\ufffd')==0 and fixed==27 and spec==7 and examples==8 and len(A)==pages and len(B)==pages and blank==0 and edge==0 and parity_bad==0): raise SystemExit(1)
          PY
