name: Topic 30 practice PDF build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic30-practice-pdf-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build practice PDF from canonical source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils >/dev/null
          python -m pip install -q markdown weasyprint pypdfium2 pillow
          SRC='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice_source.md'
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf'
          test "$(git hash-object "$SRC")" = '4a9b6c802a9182225594b4ce7274d98c931d120a'
          python - <<'PY'
          from pathlib import Path
          import markdown
          from weasyprint import HTML

          src = Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice_source.md')
          out = Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf')
          text = src.read_text(encoding='utf-8')
          body = markdown.markdown(text, extensions=['tables', 'fenced_code', 'sane_lists'])
          css = r'''
          @page {
            size: A4 portrait;
            margin: 13mm 13mm 15mm 13mm;
            @bottom-center { content: counter(page); font-size: 8pt; color: #555; }
          }
          html, body { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 9.4pt; line-height: 1.42; color: #111; }
          h1 { font-size: 17pt; margin: 0 0 8pt; line-height: 1.25; }
          h2 { font-size: 13pt; margin: 11pt 0 5pt; line-height: 1.3; break-after: avoid; }
          h3 { font-size: 11pt; margin: 8pt 0 4pt; line-height: 1.3; break-after: avoid; }
          p { margin: 3pt 0 5pt; }
          ul, ol { margin: 3pt 0 5pt 1.3em; padding: 0; }
          li { margin: 1.5pt 0; }
          code { font-family: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace; font-size: 8.8pt; background: #f3f3f3; padding: 0.4pt 1.3pt; overflow-wrap: anywhere; }
          pre { font-family: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace; font-size: 8.2pt; line-height: 1.34; white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f5f5; padding: 5pt; border: 0.4pt solid #ccc; }
          table { width: 100%; border-collapse: collapse; margin: 5pt 0 7pt; font-size: 8.2pt; }
          th, td { border: 0.45pt solid #888; padding: 3pt; vertical-align: top; overflow-wrap: anywhere; }
          th { background: #eee; }
          blockquote { margin: 4pt 0 6pt 10pt; padding-left: 7pt; border-left: 2pt solid #aaa; }
          hr { border: 0; border-top: 0.6pt solid #aaa; margin: 8pt 0; }
          a { color: #111; text-decoration: none; overflow-wrap: anywhere; }
          strong { font-weight: 700; }
          '''
          doc = f'<!doctype html><html lang="ja"><meta charset="utf-8"><style>{css}</style><body>{body}</body></html>'
          HTML(string=doc, base_url=str(src.parent)).write_pdf(str(out))
          PY
          test -s "$PDF"

      - name: Render and text QA
        shell: bash
        run: |
          set -euo pipefail
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf'
          mkdir -p /tmp/topic30_practice_pdfium /tmp/topic30_practice_poppler
          python - <<'PY'
          import pypdfium2 as pdfium
          p = pdfium.PdfDocument('denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf')
          assert len(p) >= 8
          for i, page in enumerate(p):
              page.render(scale=1.35).to_pil().save(f'/tmp/topic30_practice_pdfium/{i+1:02}.png')
          print(len(p))
          PY
          PAGES=$(find /tmp/topic30_practice_pdfium -name '*.png' | wc -l)
          pdftoppm -png -r 110 "$PDF" /tmp/topic30_practice_poppler/page >/dev/null
          test "$(find /tmp/topic30_practice_poppler -name '*.png' | wc -l)" = "$PAGES"
          pdftotext -layout "$PDF" /tmp/topic30_practice.txt
          python - <<'PY'
          import re, unicodedata
          from pathlib import Path
          from PIL import Image, ImageChops

          t = Path('/tmp/topic30_practice.txt').read_text(encoding='utf-8', errors='replace')
          assert '\ufffd' not in t
          n = ''.join(ch for ch in unicodedata.normalize('NFD', t) if not unicodedata.combining(ch))
          c = re.sub(r'\s+', '', n).replace('_', '')
          required = [
              '一次試験型', '二次試験型',
              '25/25', '7/7covered', '3/3aligned',
              'k=M/sqrt(L1L2)', '|E2|=ωM|I1|',
              'Zref=(ωM)^2/Z2', 'η=Pout/Pin',
              'ω0=1/sqrt(LC)', 'αmax=sqrt(Pi/Pc,n)',
              '0.500', '11.3V', '159.15Hz', '20mH', '5.0mH',
              '14.804W', '1.60kW', '1.20kvar', '188.50V',
              '60.0%', '61.0%', '98.34%', '97.66%'
          ]
          for s in required:
              assert s in c, s
          for q in range(1, 13):
              assert f'問{q}' in t, q

          for folder in ['/tmp/topic30_practice_pdfium', '/tmp/topic30_practice_poppler']:
              for p in sorted(Path(folder).glob('*.png')):
                  im = Image.open(p).convert('RGB')
                  bg = Image.new('RGB', im.size, 'white')
                  diff = ImageChops.difference(im, bg)
                  bbox = diff.getbbox()
                  assert bbox is not None, f'blank page {p}'
                  x0, y0, x1, y1 = bbox
                  # Content must not touch the physical page edge; catches clipping/overflow.
                  assert x0 >= 3 and y0 >= 3 and x1 <= im.width-3 and y1 <= im.height-3, (p, bbox, im.size)
          PY

      - name: Write QA
        shell: bash
        run: |
          set -euo pipefail
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice_pdf_qa.md'
          PAGES=$(find /tmp/topic30_practice_pdfium -name '*.png' | wc -l)
          SIZE=$(stat -c%s "$PDF")
          BLOB=$(git hash-object "$PDF")
          SHA256=$(sha256sum "$PDF" | awk '{print $1}')
          TEXT_BYTES=$(stat -c%s /tmp/topic30_practice.txt)
          cat > "$QA" <<EOF
          # Topic 30 練習PDF QA

          更新日: 2026-09-20

          判定: \`PASS / PRACTICE_PDF_COMPLETE\`

          ## reconcile

          最新main、\`MASTER_SPEC.md\`、\`EXAM_ALIGNMENT_SPEC.md\`、系列\`SPEC.md\`、\`STATUS.md\`、\`HANDOFF.md\`、直近の車両二種worker成果をreconcileした。Topic 30は解説PDF・練習sourceまで完了していたため、重複作業をせず、canonical練習sourceから練習PDF生成＋PDF QAのみ実施した。

          ## canonical PDF

          - path: \`30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf\`
          - canonical blob SHA: \`$BLOB\`
          - source blob SHA: \`4a9b6c802a9182225594b4ce7274d98c931d120a\`
          - file size: \`$SIZE bytes\`
          - SHA-256: \`$SHA256\`
          - A4縦: \`$PAGES pages\`

          ## render / text QA

          - PDFium render: \`$PAGES / $PAGES PASS\`
          - Poppler render: \`$PAGES / $PAGES PASS\`
          - page-edge overflow / blank-page check: \`$PAGES / $PAGES PASS\` in both renderers
          - \`pdftotext -layout\`: \`PASS ($TEXT_BYTES bytes)\`
          - 置換文字 \`�\`: \`0件\`
          - 一次8問＋二次4問: \`12 / 12収録 PASS\`

          ## 問題・解説収録

          - 一次試験型: \`8 / 8 PASS\`（全問五肢択一、正答・完全解説を収録）
          - 二次試験型: \`4 / 4 PASS\`（途中式・前提・単位・理由説明を収録）
          - source QA済み数値・論理: \`12 / 12 PASS\` をPDF転記確認
          - 一次正答一意性: \`8 / 8 PASS\` を維持

          ## 過去問対応品質ゲート

          - 固定5問・25答案要素: \`25 / 25 connected\`
          - 一次: \`20 / 20 connected\`
          - 二次: \`5 / 5 connected\`
          - SPEC必須7項目: \`7 / 7 covered\`
          - 指定3可視化の計算接続: \`3 / 3 aligned\`
          - 固定EXAM_ALIGNMENT変更: \`0件\`
          - Topic 31範囲先取り: \`0件\`
          - 未確認L0系実車値の真値化: \`0件\`
          - exact blocker: \`0件\`

          教材用 \`k\`,\`L\`,\`M\`,\`R\`,\`C\`,\`f\`,伝送電力、効率はL0系実車値ではない。直列補償回路もL0系実機構成として扱わない。

          本判定は練習PDF工程のPASSであり、Topic 30最終clean blind PASSを意味しない。

          ## Topic 21 H26二次 問1(4)

          \`48.1 N·m / 48.0 N·m\` 差は、公式標準解答が \`π=3.14\` 相当の数値処理を用いた過去問固有丸め差として維持する。一般式 \`P=Tω\`、\`ω=2πN/60\` は変更しない。
          EOF

      - name: Commit canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice.pdf'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/30_l0_inductive_power_collection_contactless_power_transfer/30_l0_inductive_power_collection_contactless_power_transfer_practice_pdf_qa.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PDF" "$QA"
          git commit -m 'denken: add Topic 30 practice PDF and QA'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
