name: Topic 39 PowerPoint one-shot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/topic39_powerpoint_factory.js'
      - '.github/workflows/topic39-powerpoint-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topic39-powerpoint-one-shot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Install PowerPoint dependency
        run: npm install --no-save pptxgenjs@4.0.0
      - name: Generate compact PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data
          node scripts/topic39_powerpoint_factory.js
          target='denken-shinkansen/05_shinkansen_vehicle_2/topics/39_cosmos_integrated_monitoring_scada_reliability/39_cosmos_integrated_monitoring_scada_reliability_powerpoint.pptx'
          tmpdir=$(mktemp -d)
          unzip -q /mnt/data/39_cosmos_integrated_monitoring_scada_reliability_powerpoint.pptx -d "$tmpdir"
          rm -f "$target"
          (cd "$tmpdir" && zip -qr9 "$GITHUB_WORKSPACE/$target" .)
          unzip -t "$target" >/dev/null
          echo "sha256=$(sha256sum "$target" | awk '{print $1}')"
          echo "size=$(stat -c '%s' "$target")"
      - name: Commit PowerPoint
        shell: bash
        run: |
          set -euo pipefail
          target='denken-shinkansen/05_shinkansen_vehicle_2/topics/39_cosmos_integrated_monitoring_scada_reliability/39_cosmos_integrated_monitoring_scada_reliability_powerpoint.pptx'
          git config user.name 'denken-artifact-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'
          git add "$target"
          git commit -m 'denken: add Topic 39 PowerPoint'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'push failed after 3 attempts' >&2
          exit 1
