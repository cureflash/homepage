name: Record Plarail build status

on:
  workflow_run:
    workflows:
      - Build Plarail universal IPA
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record build result
        run: |
          set -euxo pipefail
          printf '%s,%s,%s\n' \
            '${{ github.event.workflow_run.id }}' \
            '${{ github.event.workflow_run.conclusion }}' \
            '${{ github.event.workflow_run.head_sha }}' \
            > plarail-ios/latest-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plarail-ios/latest-build-status.txt
          git commit -m "Record Plarail build status [skip ci]" || exit 0
          git push
