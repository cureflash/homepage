name: Topic 29 practice PDF resync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic29-practice-resync.yml'

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build practice PDF from canonical source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils >/dev/null
          python -m pip install -q markdown weasyprint pypdfium2 pillow
          SRC='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice_source.md'
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice.pdf'
          test "$(git hash-object "$SRC")" = '604fcd377c8db66799c4b8938d7a815305405f8d'
          python - <<'PY'
          from pathlib import Path
          import markdown
          from weasyprint import HTML

          src = Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice_source.md')
          out = Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice.pdf')
          text = src.read_text(encoding='utf-8')
          body = markdown.markdown(text, extensions=['tables', 'fenced_code', 'sane_lists'])
          css = r'''
          @page {
            size: A4 portrait;
            margin: 13mm 13mm 15mm 13mm;
            @bottom-center { content: counter(page); font-size: 8pt; color: #555; }
          }
          html, body { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 9.4pt; line-height: 1.42; color: #111; }
          h1 { font-size: 17pt; margin: 0 0 8pt; line-height: 1.25; }
          h2 { font-size: 13pt; margin: 11pt 0 5pt; line-height: 1.3; break-after: avoid; }
          h3 { font-size: 11pt; margin: 8pt 0 4pt; line-height: 1.3; break-after: avoid; }
          p { margin: 3pt 0 5pt; }
          ul, ol { margin: 3pt 0 5pt 1.3em; padding: 0; }
          li { margin: 1.5pt 0; }
          code { font-family: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace; font-size: 8.8pt; background: #f3f3f3; padding: 0.4pt 1.3pt; overflow-wrap: anywhere; }
          pre { font-family: "Noto Sans Mono CJK JP", "Noto Sans Mono", monospace; font-size: 8.2pt; line-height: 1.34; white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f5f5; padding: 5pt; border: 0.4pt solid #ccc; }
          table { width: 100%; border-collapse: collapse; margin: 5pt 0 7pt; font-size: 8.2pt; }
          th, td { border: 0.45pt solid #888; padding: 3pt; vertical-align: top; }
          th { background: #eee; }
          blockquote { margin: 4pt 0 6pt 10pt; padding-left: 7pt; border-left: 2pt solid #aaa; }
          hr { border: 0; border-top: 0.6pt solid #aaa; margin: 8pt 0; }
          a { color: #111; text-decoration: none; overflow-wrap: anywhere; }
          strong { font-weight: 700; }
          '''
          doc = f'<!doctype html><html lang="ja"><meta charset="utf-8"><style>{css}</style><body>{body}</body></html>'
          HTML(string=doc, base_url=str(src.parent)).write_pdf(str(out))
          PY
          test -s "$PDF"

      - name: Render and text QA
        shell: bash
        run: |
          set -euo pipefail
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice.pdf'
          mkdir -p /tmp/topic29_practice_pdfium /tmp/topic29_practice_poppler
          python - <<'PY'
          import pypdfium2 as pdfium
          p = pdfium.PdfDocument('denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice.pdf')
          assert len(p) >= 7
          for i, page in enumerate(p):
              page.render(scale=1.35).to_pil().save(f'/tmp/topic29_practice_pdfium/{i+1:02}.png')
          print(len(p))
          PY
          PAGES=$(find /tmp/topic29_practice_pdfium -name '*.png' | wc -l)
          test "$PAGES" -ge 7
          pdftoppm -png -r 110 "$PDF" /tmp/topic29_practice_poppler/page >/dev/null
          test "$(find /tmp/topic29_practice_poppler -name '*.png' | wc -l)" = "$PAGES"
          pdftotext -layout "$PDF" /tmp/topic29_practice.txt
          python - <<'PY'
          import re, unicodedata
          t = open('/tmp/topic29_practice.txt', encoding='utf-8', errors='replace').read()
          assert '\ufffd' not in t
          n = ''.join(ch for ch in unicodedata.normalize('NFD', t) if not unicodedata.combining(ch))
          c = re.sub(r'\s+', '', n).replace('_', '')
          required = [
              '一次試験型', '二次試験型',
              'V1=VL/sqrt(3)', "I'2=V1/sqrt((r1+r'2/s)^2+(x1+x'2)^2)",
              "smax=r'2/sqrt(r1^2+(x1+x'2)^2)", 'sp=2-s', '1<=sp<=2',
              '393N・m', '0.294', '停止直前側'
          ]
          for s in required:
              assert s in c, s
          for q in range(1, 13):
              assert f'問{q}' in t, q
          PY

      - name: Write QA
        shell: bash
        run: |
          set -euo pipefail
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice.pdf'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice_pdf_qa.md'
          PAGES=$(find /tmp/topic29_practice_pdfium -name '*.png' | wc -l)
          SIZE=$(stat -c%s "$PDF")
          BLOB=$(git hash-object "$PDF")
          SHA256=$(sha256sum "$PDF" | awk '{print $1}')
          TEXT_BYTES=$(stat -c%s /tmp/topic29_practice.txt)
          cat > "$QA" <<EOF
          # Topic 29 練習PDF 再同期QA

          更新日: 2026-09-20

          判定: \`PASS / PRACTICE_ARTIFACT_RESYNC_COMPLETE\`

          ## reconcile

          最新main、\`MASTER_SPEC.md\`、\`EXAM_ALIGNMENT_SPEC.md\`、系列\`SPEC.md\`、\`STATUS.md\`、\`HANDOFF.md\`、直近の車両二種worker成果をreconcileした。解説PDF再同期済み成果を重複実施せず、remediation済み練習sourceを正本として練習PDFのみ再生成・QAした。

          ## canonical PDF

          - path: \`29_l0_superconducting_magnetic_levitation_force_practice.pdf\`
          - canonical blob SHA: \`$BLOB\`
          - source blob SHA: \`604fcd377c8db66799c4b8938d7a815305405f8d\`
          - file size: \`$SIZE bytes\`
          - SHA-256: \`$SHA256\`
          - A4縦: \`$PAGES pages\`

          ## render / text QA

          - PDFium render: \`$PAGES / $PAGES PASS\`
          - Poppler render: \`$PAGES / $PAGES PASS\`
          - \`pdftotext -layout\`: \`PASS ($TEXT_BYTES bytes)\`
          - 置換文字 \`�\`: \`0件\`
          - 一次8問＋二次4問: \`12 / 12収録 PASS\`

          ## H23二次 remediation反映

          - \`V_1=V_L/sqrt(3)\`
          - \`I'_2=V_1/sqrt((r_1+r'_2/s)^2+(x_1+x'_2)^2)\`
          - \`T=3I'^2_2(r'_2/s)/ω_s\`
          - \`s_max=r'_2/sqrt(r_1^2+(x_1+x'_2)^2)\`
          - 逆相制動 \`s_p=2-s\`
          - 実通過区間 \`1<=s_p<=2\`
          - 問12: \`T≈393 N・m\`, \`s_max≈0.294\`, 区間最大は停止直前側 — \`PASS\`
          - \`r_1\`, \`x_1\` が残る場合は簡略条件 \`s_m=r'_2/x'_2\` を使わない

          ## 過去問対応品質ゲート

          - 固定5問・24答案要素: \`24 / 24 connected\`
          - 一次: \`20 / 20 connected\`
          - 二次: \`4 / 4 connected\`
          - SPEC必須8項目: \`8 / 8 covered\`
          - 指定3可視化の計算接続: \`3 / 3 aligned\`
          - 固定EXAM_ALIGNMENT変更: \`0件\`
          - L0系未確認実車値の真値化: \`0件\`
          - Topic 30先取り: \`0件\`
          - exact blocker: \`0件\`

          本判定は練習PDF再同期工程のPASSであり、Topic 29最終clean blind PASSを意味しない。

          ## Topic 21 H26二次 問1(4)

          \`48.1 N·m / 48.0 N·m\` 差は、公式標準解答が \`π=3.14\` 相当の数値処理を用いた過去問固有丸め差として維持する。一般式 \`P=Tω\`、\`ω=2πN/60\` は変更しない。
          EOF

      - name: Commit canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          PDF='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice.pdf'
          QA='denken-shinkansen/05_shinkansen_vehicle_2/topics/29_l0_superconducting_magnetic_levitation_force/29_l0_superconducting_magnetic_levitation_force_practice_pdf_qa.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PDF" "$QA"
          git commit -m 'denken: resync Topic 29 practice artifact'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
