name: Temporary Topic 19 Explanation PDF Assembly
# Publish verified PDF and remove temporary assembly files.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-topic19-explanation-pdf.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp_topic19_pdf/{00,01,02,03,04,05,06}.b64 | tr -d '\r\n' | base64 -d > /tmp/topic19.pdf
          echo "size=$(wc -c < /tmp/topic19.pdf)"
          echo "sha256=$(sha256sum /tmp/topic19.pdf | awk '{print $1}')"
          echo "blob=$(git hash-object /tmp/topic19.pdf)"
          test "$(wc -c < /tmp/topic19.pdf)" -eq 19195
          test "$(sha256sum /tmp/topic19.pdf | awk '{print $1}')" = 'c5a13d36ebbdc37ba4fcc4d74be70af7e5aa63488c1de570c60751f7ee3a23c1'
          test "$(git hash-object /tmp/topic19.pdf)" = 'bbbe79949058c62725f644236b78f8c961365291'
      - name: Commit PDF and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git pull --rebase origin main
          target='denken-shinkansen/07_shinkansen_machine_2/topics/19_pid_speed_control/19_pid_speed_control_explanation.pdf'
          cp /tmp/topic19.pdf "$target"
          git add "$target"
          git rm -r .tmp_topic19_pdf .github/workflows/tmp-topic19-explanation-pdf.yml
          git commit -m 'denken machine2: add Topic 19 explanation PDF'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
