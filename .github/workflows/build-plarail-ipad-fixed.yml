name: Build Plarail universal IPA

on:
  push:
    paths:
      - '.github/workflows/build-plarail-ipad-fixed.yml'
      - 'plarail-ios/apply-ipad-fullscreen-layout.py'
      - 'plarail-ios/apply-time-based-audio.py'
      - 'plarail-ios/apply-train-selector.py'
      - 'plarail-ios/generate-train-assets.py'
      - 'plarail-ios/PlarailController.swiftpm.zip'
      - 'plarail-ios/icon-b64/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail
          ACTIVE_DEVELOPER="$(xcode-select -p)"
          ACTIVE_XCODE="${ACTIVE_DEVELOPER%/Contents/Developer}"
          ACTIVE_REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$ACTIVE_XCODE")"
          for xcode in /Applications/Xcode*.app; do
            [ -e "$xcode" ] || continue
            REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$xcode")"
            if [ "$REAL" != "$ACTIVE_REAL" ]; then sudo rm -rf "$xcode"; fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          brew cleanup -s || true
          df -h /

      - name: Restore app
        run: |
          set -euxo pipefail
          rm -rf plarail-ios/work
          mkdir -p plarail-ios/work
          unzip -q plarail-ios/PlarailController.swiftpm.zip -d plarail-ios/work
          APP_DIR="$(find plarail-ios/work -maxdepth 2 -type d -name '*.swiftpm' | head -1)"
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Apply audio, layout and train selector fixes
        run: |
          set -euxo pipefail
          python3 plarail-ios/apply-time-based-audio.py "$APP_DIR"
          python3 plarail-ios/apply-ipad-fullscreen-layout.py "$APP_DIR"
          python3 plarail-ios/apply-train-selector.py "$APP_DIR"
          python3 -m pip install --quiet pillow
          python3 plarail-ios/generate-train-assets.py "$APP_DIR/Resources/shinkansen"
          grep -q 'designWidth: CGFloat = 1366' "$APP_DIR/MyApp.swift"
          grep -q 'persistentSystemOverlays(.hidden)' "$APP_DIR/MyApp.swift"
          grep -q 'selectedTrainSeries' "$APP_DIR/RunningScenePanel.swift"
          test -f "$APP_DIR/Resources/shinkansen/train0.png"
          test -f "$APP_DIR/Resources/shinkansen/train100.png"
          test -f "$APP_DIR/Resources/shinkansen/train300.png"
          test -f "$APP_DIR/Resources/shinkansen/train500.png"
          test -f "$APP_DIR/Resources/shinkansen/train700.png"
          test -f "$APP_DIR/Resources/shinkansen/trainRailStar.png"
          test -f "$APP_DIR/Resources/shinkansen/trainN700S.png"
          test -f "$APP_DIR/Resources/shinkansen/trainT4.png"
          ! grep -R 'MIN_BUSY_MS' "$APP_DIR"/*.swift

      - name: Compile universal executable directly
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          OUT="$APP_DIR/direct-build"
          APP="$OUT/Payload/PlarailController.app"
          rm -rf "$OUT"
          mkdir -p "$APP"
          SOURCES=()
          while IFS= read -r -d '' file; do SOURCES+=("$file"); done < <(find "$APP_DIR" -maxdepth 1 -type f -name '*.swift' ! -name 'Package.swift' -print0 | sort -z)
          xcrun --sdk iphoneos swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -module-name PlarailController \
            -parse-as-library \
            -emit-executable \
            -Onone -gnone -j 1 -disable-batch-mode \
            -framework SwiftUI -framework UIKit -framework Foundation \
            -framework CoreBluetooth -framework AVFoundation -framework Combine \
            -o "$APP/PlarailController" \
            "${SOURCES[@]}"
          chmod +x "$APP/PlarailController"

      - name: Assemble universal app bundle
        run: |
          set -euxo pipefail
          APP="$APP_DIR/direct-build/Payload/PlarailController.app"
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>ja</string>
            <key>CFBundleDisplayName</key><string>PlarailController</string>
            <key>CFBundleExecutable</key><string>PlarailController</string>
            <key>CFBundleIdentifier</key><string>com.cureflash.plarailcontroller</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>PlarailController</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>7</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>NSBluetoothAlwaysUsageDescription</key><string>プラレール車両との接続にBluetoothを使用します。</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIRequiresFullScreen</key><true/>
            <key>UIStatusBarHidden</key><true/>
            <key>UIViewControllerBasedStatusBarAppearance</key><false/>
            <key>UILaunchScreen</key><dict/>

            <key>CFBundleIconFiles</key><array>
              <string>AppIcon20</string><string>AppIcon29</string><string>AppIcon40</string><string>AppIcon60</string>
            </array>
            <key>CFBundleIcons</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array>
              <string>AppIcon20</string><string>AppIcon29</string><string>AppIcon40</string><string>AppIcon60</string>
            </array></dict></dict>

            <key>CFBundleIconFiles~ipad</key><array>
              <string>AppIcon20</string><string>AppIcon29</string><string>AppIcon40</string><string>AppIcon76</string><string>AppIcon83.5</string>
            </array>
            <key>CFBundleIcons~ipad</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array>
              <string>AppIcon20</string><string>AppIcon29</string><string>AppIcon40</string><string>AppIcon76</string><string>AppIcon83.5</string>
            </array></dict></dict>

            <key>UISupportedInterfaceOrientations</key><array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key><array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          cp -R "$APP_DIR/Resources/shinkansen" "$APP/shinkansen"

          ICON_SOURCE="$RUNNER_TEMP/plarail-app-icon.jpg"
          cat plarail-ios/icon-b64/part*.txt | tr -d '\r\n' | /usr/bin/base64 -D > "$ICON_SOURCE"
          ACTUAL_SHA256="$(shasum -a 256 "$ICON_SOURCE" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "f19c59cecf1a158e4b1b31dafff48c6692871a8ea639863b22666d8fc3a886a3"
          sips -g pixelWidth -g pixelHeight "$ICON_SOURCE"

          # iPhone + shared sizes
          sips -s format png -z 40 40 "$ICON_SOURCE" --out "$APP/AppIcon20@2x.png" >/dev/null
          sips -s format png -z 60 60 "$ICON_SOURCE" --out "$APP/AppIcon20@3x.png" >/dev/null
          sips -s format png -z 58 58 "$ICON_SOURCE" --out "$APP/AppIcon29@2x.png" >/dev/null
          sips -s format png -z 87 87 "$ICON_SOURCE" --out "$APP/AppIcon29@3x.png" >/dev/null
          sips -s format png -z 80 80 "$ICON_SOURCE" --out "$APP/AppIcon40@2x.png" >/dev/null
          sips -s format png -z 120 120 "$ICON_SOURCE" --out "$APP/AppIcon40@3x.png" >/dev/null
          sips -s format png -z 120 120 "$ICON_SOURCE" --out "$APP/AppIcon60@2x.png" >/dev/null
          sips -s format png -z 180 180 "$ICON_SOURCE" --out "$APP/AppIcon60@3x.png" >/dev/null

          # iPad sizes
          sips -s format png -z 152 152 "$ICON_SOURCE" --out "$APP/AppIcon76@2x.png" >/dev/null
          sips -s format png -z 167 167 "$ICON_SOURCE" --out "$APP/AppIcon83.5@2x.png" >/dev/null
          file "$APP"/AppIcon*.png

      - name: Package universal IPA
        run: |
          set -euxo pipefail
          cd "$APP_DIR/direct-build"
          /usr/bin/zip -qry PlarailController-Universal-unsigned.ipa Payload
          test -s PlarailController-Universal-unsigned.ipa
          ls -lh PlarailController-Universal-unsigned.ipa

      - name: Publish universal IPA to repository
        run: |
          set -euxo pipefail
          cp "$APP_DIR/direct-build/PlarailController-Universal-unsigned.ipa" \
             plarail-ios/PlarailController-Universal-unsigned.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plarail-ios/PlarailController-Universal-unsigned.ipa
          if git diff --cached --quiet; then
            echo "IPA unchanged"
          else
            git commit -m "Publish universal Plarail IPA [skip ci]"
            git push
          fi

      - name: Upload universal IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlarailController-Universal-unsigned-ipa
          path: ${{ env.APP_DIR }}/direct-build/PlarailController-Universal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
