name: One-shot formal Physics projectile patch

on:
  push:
    branches:
      - automation/science-physics-projectile-peak-range-20260827

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/science-physics-projectile-peak-range-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Apply safe projectile checkpoints
        run: python scripts/_automation_patch_science_projectile_next.py
      - name: Run regression tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_physics_projectile.py
      - name: Commit patched implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-science-physics-projectile-next.yml scripts/_automation_patch_science_projectile_next.py
          git add scripts/science_worksheet_helpers.py scripts/science_physics_projectile.py tests/test_science_formula_relations.py tests/test_science_physics_projectile.py .github/workflows/science-physics-publish.yml
          git commit -m 'Add formal Physics projectile peak and range checkpoints'
          git push origin HEAD:automation/science-physics-projectile-peak-range-20260827
