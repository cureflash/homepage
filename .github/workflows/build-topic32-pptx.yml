name: Build Topic 32 PowerPoint

on:
  push:
    paths:
      - '.github/workflows/build-topic32-pptx.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pptxgenjs
        run: npm install --no-save pptxgenjs
      - name: Generate PowerPoint
        run: node denken-shinkansen/01_shinkansen_vehicle_3/topics/32_atc_speed_brake_control/build_topic32_pptx.js
      - name: Commit PowerPoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add denken-shinkansen/01_shinkansen_vehicle_3/topics/32_atc_speed_brake_control/32_atc_speed_brake_control_images.pptx
          git commit -m "Add Topic 32 explanation PowerPoint" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
