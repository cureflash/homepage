name: Topic 35 PDF repair one-shot

on:
  push:
    branches: [main]
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_repair/BUILD'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
      - name: Normalize and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          pdf="$base/35_atc_track_circuit_analysis_explanation.pdf"
          qpdf --warning-exit-0 --object-streams=generate "$pdf" /tmp/topic35-repaired.pdf 2>/tmp/qpdf-repair.err
          mv /tmp/topic35-repaired.pdf "$pdf"
          qpdf --check "$pdf" | tee /tmp/qpdf-check.txt
          pdfinfo "$pdf" >/tmp/topic35.pdfinfo 2>/tmp/pdfinfo.err
          if grep -q 'Syntax Error' /tmp/pdfinfo.err; then cat /tmp/pdfinfo.err; exit 1; fi
          pages="$(awk '/^Pages:/ {print $2}' /tmp/topic35.pdfinfo)"
          test "$pages" = '10'
          read -r width height < <(awk '/^Page size:/ {print $3, $5}' /tmp/topic35.pdfinfo)
          awk -v w="$width" -v h="$height" 'BEGIN { exit !(w >= 595.2 && w <= 595.4 && h >= 841.8 && h <= 842.0) }'
          pdftotext "$pdf" /tmp/topic35.txt 2>/tmp/pdftotext.err
          if grep -q 'Syntax Error' /tmp/pdftotext.err; then cat /tmp/pdftotext.err; exit 1; fi
          grep -q 'ATC' /tmp/topic35.txt
          mkdir -p /tmp/topic35-render
          pdftoppm -png -r 96 "$pdf" /tmp/topic35-render/page >/dev/null 2>/tmp/pdftoppm.err
          if grep -q 'Syntax Error' /tmp/pdftoppm.err; then cat /tmp/pdftoppm.err; exit 1; fi
          render_count="$(find /tmp/topic35-render -name 'page-*.png' | wc -l)"
          test "$render_count" -eq 10
          sha256sum "$pdf" | tee /tmp/topic35.sha256
          echo "validated pages=$pages size=${width}x${height} render_count=$render_count"
          rm -rf "$base/.pdf_repair"
          rm -f .github/workflows/topic35-pdf-repair-once.yml
      - name: Commit repaired PDF
        shell: bash
        run: |
          set -euo pipefail
          hash="$(cut -d' ' -f1 /tmp/topic35.sha256)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Normalize Topic 35 explanation PDF [sha256:$hash]"
          git push origin HEAD:main
