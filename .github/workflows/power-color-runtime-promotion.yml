name: Power Color runtime promotion

on:
  push:
    branches:
      - power-color/promote-grade3-conventional-runtime
    paths:
      - 'qualifications/color-certification/scripts/promote-grade3-conventional-runtime.mjs'
      - 'qualifications/color-certification/data/grade3-authoring-*.json'
      - 'qualifications/color-certification/data/grade3-runtime.json'
      - '.github/workflows/power-color-runtime-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color/promote-grade3-conventional-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified conventional-color authoring records
        run: node qualifications/color-certification/scripts/promote-grade3-conventional-runtime.mjs
      - name: Commit generated runtime only when changed
        run: |
          if git diff --quiet -- qualifications/color-certification/data/grade3-runtime.json; then
            echo 'Runtime already promoted; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualifications/color-certification/data/grade3-runtime.json
          git commit -m 'Power Color: promote conventional questions to runtime'
          git push origin HEAD:power-color/promote-grade3-conventional-runtime
