name: Publish formal Physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-physics-publish.yml'
      - 'scripts/science_worksheet_helpers.py'
      - 'scripts/science_physics_projectile.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_formula_relations.py'
      - 'tests/test_science_physics_projectile.py'

permissions:
  contents: write

concurrency:
  group: science-physics-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and formal Physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_physics_projectile.py

      - name: Generate and register formal Physics batch
        run: python scripts/publish_science_physics.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_physics_projectile.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog

          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [x for x in catalog if x.get('id', '').startswith('science-physics-motion-')]
          assert len(rows) == 330, len(rows)
          assert all(x['school_level'] == 'high-school' for x in rows)
          assert all(x.get('formal_course') == '物理' for x in rows)
          assert all(x.get('grade') is None for x in rows)
          assert all(x['subject'] == '理科' and x['science_field'] == 'physics' for x in rows)
          assert all(x['worksheet_series'] == 'focused' for x in rows)
          assert Counter(x['answer_type'] for x in rows) == Counter({'numeric': 330})
          assert all(x['problem_count'] == 20 for x in rows)
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes == Counter({'calculation-reverse': 190, 'calculation-basic': 140}), modes
          skills = Counter(x['skill'] for x in rows)
          assert skills == Counter({
              'horizontal-projectile-horizontal-motion': 30,
              'horizontal-projectile-vertical-displacement': 30,
              'horizontal-projectile-vertical-velocity': 30,
              'oblique-projectile-initial-horizontal-component': 30,
              'oblique-projectile-initial-vertical-component': 30,
              'oblique-projectile-vertical-velocity': 30,
              'oblique-projectile-vertical-displacement': 30,
              'oblique-projectile-time-to-highest-point': 30,
              'oblique-projectile-maximum-height': 30,
              'oblique-projectile-same-height-flight-time': 30,
              'oblique-projectile-same-height-horizontal-range': 30,
          }), skills
          units = Counter(x['unit'] for x in rows)
          assert units == Counter({'様々な運動：平面運動と放物運動': 330}), units
          assert len({x['content_hash'] for x in rows}) == 330
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('Formal Physics 330-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/high-school/physics/motion/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; formal Physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish 90 formal Physics oblique-projectile worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
