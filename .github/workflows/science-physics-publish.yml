name: Publish formal Physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-physics-publish.yml'
      - 'scripts/science_worksheet_helpers.py'
      - 'scripts/science_physics_*.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_formula_relations.py'
      - 'tests/test_science_product_over_divisor.py'
      - 'tests/test_science_physics_*.py'

permissions:
  contents: write

concurrency:
  group: worksheet-catalog-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and formal Physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python -m unittest discover -s tests -p 'test_science_physics_*.py'

      - name: Generate and register formal Physics batch
        run: python scripts/publish_science_physics.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python -m unittest discover -s tests -p 'test_science_physics_*.py'
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog

          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [x for x in catalog if x.get('id', '').startswith('science-physics-motion-')]
          assert len(rows) == 3000, len(rows)
          assert all(x['school_level'] == 'high-school' for x in rows)
          assert all(x.get('formal_course') == '物理' for x in rows)
          assert all(x.get('grade') is None for x in rows)
          assert all(x['subject'] == '理科' and x['science_field'] == 'physics' for x in rows)
          assert all(x['worksheet_series'] == 'focused' for x in rows)
          assert Counter(x['answer_type'] for x in rows) == Counter({'numeric': 2080, 'accepted-set': 920})
          assert all(x['problem_count'] == 20 for x in rows)
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes == Counter({
              'calculation-reverse': 1330,
              'calculation-basic': 750,
              'retrieval-forward': 230,
              'retrieval-reverse': 230,
              'retrieval-fill': 230,
              'retrieval-tf': 230,
          }), modes
          skills = Counter(x['skill'] for x in rows)
          assert skills['induction-faraday-average-emf-numeric'] == 40
          assert skills['induction-motional-emf-perpendicular-numeric'] == 40
          assert skills['induction-core-concepts'] == 40
          assert skills['induction-self-inductance-numeric'] == 40
          assert skills['induction-mutual-inductance-numeric'] == 40
          assert skills['induction-followup-concepts'] == 40
          assert skills['ac-sinusoidal-rms-voltage-numeric'] == 20
          assert skills['ac-resistor-ohm-rms-numeric'] == 30
          assert skills['ac-resistor-average-power-numeric'] == 30
          assert skills['ac-core-concepts'] == 40
          assert skills['ac-inductive-reactance-numeric'] == 30
          assert skills['ac-capacitive-reactance-numeric'] == 20
          assert skills['ac-series-rlc-reactance-difference-numeric'] == 30
          assert skills['ac-reactance-rlc-concepts'] == 40
          units = Counter(x['unit'] for x in rows)
          assert units['電気と磁気：電磁誘導'] == 240
          assert units['電気と磁気：交流の基本'] == 240
          assert len({x['content_hash'] for x in rows}) == 3000
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('Formal Physics 3000-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/high-school/physics/motion/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; formal Physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish 120 formal Physics AC reactance worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
