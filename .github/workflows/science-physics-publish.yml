name: Publish formal Physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-physics-publish.yml'
      - 'scripts/science_worksheet_helpers.py'
      - 'scripts/science_physics_projectile.py'
      - 'scripts/science_physics_rigid_body.py'
      - 'scripts/science_physics_momentum.py'
      - 'scripts/science_physics_circular_motion.py'
      - 'scripts/science_physics_circular_period.py'
      - 'scripts/science_physics_centrifugal_shm.py'
      - 'scripts/science_physics_shm_periods.py'
      - 'scripts/science_physics_gravitation.py'
      - 'scripts/science_physics_gravitation_energy_gas.py'
      - 'scripts/science_physics_ideal_gas.py'
      - 'scripts/science_physics_thermal_gas.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_formula_relations.py'
      - 'tests/test_science_product_over_divisor.py'
      - 'tests/test_science_physics_projectile.py'
      - 'tests/test_science_physics_rigid_body.py'
      - 'tests/test_science_physics_momentum.py'
      - 'tests/test_science_physics_circular_motion.py'
      - 'tests/test_science_physics_circular_period.py'
      - 'tests/test_science_physics_centrifugal_shm.py'
      - 'tests/test_science_physics_shm_periods.py'
      - 'tests/test_science_physics_gravitation.py'
      - 'tests/test_science_physics_gravitation_energy_gas.py'
      - 'tests/test_science_physics_ideal_gas.py'
      - 'tests/test_science_physics_thermal_gas.py'

permissions:
  contents: write

concurrency:
  group: worksheet-catalog-publish-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and formal Physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py

      - name: Generate and register formal Physics batch
        run: python scripts/publish_science_physics.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog

          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [x for x in catalog if x.get('id', '').startswith('science-physics-motion-')]
          assert len(rows) == 1610, len(rows)
          assert all(x['school_level'] == 'high-school' for x in rows)
          assert all(x.get('formal_course') == '物理' for x in rows)
          assert all(x.get('grade') is None for x in rows)
          assert all(x['subject'] == '理科' and x['science_field'] == 'physics' for x in rows)
          assert all(x['worksheet_series'] == 'focused' for x in rows)
          assert Counter(x['answer_type'] for x in rows) == Counter({'numeric': 1250, 'accepted-set': 360})
          assert all(x['problem_count'] == 20 for x in rows)
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes == Counter({
              'calculation-reverse': 800,
              'calculation-basic': 450,
              'retrieval-forward': 90,
              'retrieval-reverse': 90,
              'retrieval-fill': 90,
              'retrieval-tf': 90,
          }), modes
          skills = Counter(x['skill'] for x in rows)
          expected_skills = {
              'horizontal-projectile-horizontal-motion': 30,
              'horizontal-projectile-vertical-displacement': 30,
              'horizontal-projectile-vertical-velocity': 30,
              'oblique-projectile-initial-horizontal-component': 30,
              'oblique-projectile-initial-vertical-component': 30,
              'oblique-projectile-vertical-velocity': 30,
              'oblique-projectile-vertical-displacement': 30,
              'oblique-projectile-time-to-highest-point': 30,
              'oblique-projectile-maximum-height': 30,
              'oblique-projectile-same-height-flight-time': 30,
              'oblique-projectile-same-height-horizontal-range': 30,
              'rigid-body-force-moment': 30,
              'rigid-body-weight-moment': 30,
              'rigid-body-couple-moment': 30,
              'rigid-body-signed-net-moment': 30,
              'rigid-body-two-force-moment-balance': 40,
              'rigid-body-two-mass-center-of-gravity': 40,
              'momentum-one-dimensional': 30,
              'impulse-one-dimensional': 30,
              'momentum-change-from-impulse': 30,
              'momentum-conservation-total-before-after': 30,
              'momentum-conservation-final-object': 30,
              'momentum-conservation-two-body-velocity': 40,
              'collision-coefficient-of-restitution': 30,
              'collision-kinetic-energy-loss': 30,
              'circular-linear-speed-angular-speed-radius': 30,
              'circular-angular-displacement': 30,
              'circular-centripetal-acceleration': 30,
              'circular-centripetal-force': 30,
              'circular-period-angular-speed': 20,
              'circular-centrifugal-frame-concepts': 40,
              'simple-harmonic-core-concepts': 40,
              'simple-harmonic-spring-restoring-force': 30,
              'simple-harmonic-acceleration-displacement-magnitude': 30,
              'spring-pendulum-period-concepts': 40,
              'simple-pendulum-period-concepts': 40,
              'spring-pendulum-period-numeric': 10,
              'simple-pendulum-period-numeric': 10,
              'universal-gravitation-force': 30,
              'universal-gravitation-core-concepts': 40,
              'kepler-laws-core-concepts': 40,
              'gravitational-potential-energy': 30,
              'gravitational-potential-energy-concepts': 40,
              'gas-molecular-motion-core-concepts': 40,
              'ideal-gas-state-equation-numeric': 40,
              'boyle-law-numeric': 40,
              'charles-law-numeric': 40,
              'molecular-mean-kinetic-energy-numeric': 10,
              'ideal-gas-internal-energy-numeric': 30,
              'thermal-gas-core-concepts': 40,
              'thermodynamics-first-law-numeric': 30,
          }
          assert skills == Counter(expected_skills), skills
          units = Counter(x['unit'] for x in rows)
          assert units == Counter({
              '様々な運動：平面運動と放物運動': 330,
              '様々な運動：剛体のつり合い': 200,
              '様々な運動：運動量と力積': 250,
              '様々な運動：円運動と単振動': 380,
              '様々な運動：万有引力': 180,
              '様々な運動：気体分子の運動': 270,
          }), units
          assert len({x['content_hash'] for x in rows}) == 1610
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('Formal Physics 1610-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/high-school/physics/motion/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; formal Physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish 110 formal Physics thermal-gas worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
