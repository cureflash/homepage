name: Publish formal Physics worksheets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/science-physics-publish.yml'
      - 'scripts/science_worksheet_helpers.py'
      - 'scripts/science_physics_projectile.py'
      - 'scripts/science_physics_rigid_body.py'
      - 'scripts/science_physics_momentum.py'
      - 'scripts/science_physics_circular_motion.py'
      - 'scripts/science_physics_circular_period.py'
      - 'scripts/science_physics_centrifugal_shm.py'
      - 'scripts/science_physics_shm_periods.py'
      - 'scripts/science_physics_gravitation.py'
      - 'scripts/science_physics_gravitation_energy_gas.py'
      - 'scripts/science_physics_ideal_gas.py'
      - 'scripts/science_physics_thermal_gas.py'
      - 'scripts/science_physics_waves.py'
      - 'scripts/science_physics_sound.py'
      - 'scripts/science_physics_light.py'
      - 'scripts/science_physics_light_numeric.py'
      - 'scripts/science_physics_electric_field_potential.py'
      - 'scripts/science_physics_capacitors.py'
      - 'scripts/science_physics_circuits.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_formula_relations.py'
      - 'tests/test_science_product_over_divisor.py'
      - 'tests/test_science_physics_projectile.py'
      - 'tests/test_science_physics_rigid_body.py'
      - 'tests/test_science_physics_momentum.py'
      - 'tests/test_science_physics_circular_motion.py'
      - 'tests/test_science_physics_circular_period.py'
      - 'tests/test_science_physics_centrifugal_shm.py'
      - 'tests/test_science_physics_shm_periods.py'
      - 'tests/test_science_physics_gravitation.py'
      - 'tests/test_science_physics_gravitation_energy_gas.py'
      - 'tests/test_science_physics_ideal_gas.py'
      - 'tests/test_science_physics_thermal_gas.py'
      - 'tests/test_science_physics_waves.py'
      - 'tests/test_science_physics_sound.py'
      - 'tests/test_science_physics_light.py'
      - 'tests/test_science_physics_light_numeric.py'
      - 'tests/test_science_physics_electric_field_potential.py'
      - 'tests/test_science_physics_capacitors.py'
      - 'tests/test_science_physics_circuits.py'

permissions:
  contents: write

concurrency:
  group: worksheet-catalog-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Confirm latest main before validation
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run shared and formal Physics tests
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py
          python tests/test_science_physics_waves.py
          python tests/test_science_physics_sound.py
          python tests/test_science_physics_light.py
          python tests/test_science_physics_light_numeric.py
          python tests/test_science_physics_electric_field_potential.py
          python tests/test_science_physics_capacitors.py
          python tests/test_science_physics_circuits.py

      - name: Generate and register formal Physics batch
        run: python scripts/publish_science_physics.py

      - name: Re-run validation after publication
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py
          python tests/test_science_physics_waves.py
          python tests/test_science_physics_sound.py
          python tests/test_science_physics_light.py
          python tests/test_science_physics_light_numeric.py
          python tests/test_science_physics_electric_field_potential.py
          python tests/test_science_physics_capacitors.py
          python tests/test_science_physics_circuits.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog

          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [x for x in catalog if x.get('id', '').startswith('science-physics-motion-')]
          assert len(rows) == 2400, len(rows)
          assert all(x['school_level'] == 'high-school' for x in rows)
          assert all(x.get('formal_course') == '物理' for x in rows)
          assert all(x.get('grade') is None for x in rows)
          assert all(x['subject'] == '理科' and x['science_field'] == 'physics' for x in rows)
          assert all(x['worksheet_series'] == 'focused' for x in rows)
          assert Counter(x['answer_type'] for x in rows) == Counter({'numeric': 1680, 'accepted-set': 720})
          assert all(x['problem_count'] == 20 for x in rows)
          modes = Counter(x['worksheet_mode'] for x in rows)
          assert modes == Counter({
              'calculation-reverse': 1050,
              'calculation-basic': 630,
              'retrieval-forward': 180,
              'retrieval-reverse': 180,
              'retrieval-fill': 180,
              'retrieval-tf': 180,
          }), modes
          skills = Counter(x['skill'] for x in rows)
          assert skills['capacitor-charge-voltage-numeric'] == 30
          assert skills['capacitor-parallel-plate-capacitance-numeric'] == 30
          assert skills['capacitor-stored-energy-numeric'] == 20
          assert skills['capacitor-core-concepts'] == 40
          assert skills['circuit-resistivity-geometry-numeric'] == 30
          assert skills['circuit-internal-resistance-numeric'] == 30
          assert skills['circuit-kirchhoff-junction-numeric'] == 20
          assert skills['circuit-core-concepts'] == 40
          units = Counter(x['unit'] for x in rows)
          assert units['電気と磁気：コンデンサー'] == 120
          assert units['電気と磁気：電場・電位'] == 120
          assert units['電気と磁気：電気回路'] == 120
          assert len({x['content_hash'] for x in rows}) == 2400
          for entry in rows:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('Formal Physics 2400-PDF catalog validation: OK')
          PY

      - name: Commit generated PDFs and catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/science/high-school/physics/motion/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes; formal Physics worksheets are already current.'
            exit 0
          fi
          git commit -m 'Publish 120 formal Physics electric-circuit worksheets'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
