name: Power Color Grade 2 temporary image-keyword authoring
on:
  push:
    branches:
      - power-color-grade2-image-keywords
permissions:
  contents: write
jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-image-keywords
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate independently checked image-keyword batch and sync docs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('qualifications/color-certification/data/grade2-authoring-image-scheme-keywords-0001-0012.json')
          test_path = Path('qualifications/color-certification/tests/grade2-image-scheme-keywords-authoring.test.js')
          audit_path = Path('docs/power-color/audits/2026-09-02-grade2-image-scheme-keywords.md')
          status_path = Path('docs/power-color/STATUS.json')
          plan_path = Path('docs/power-color/50_GRADE2_EXECUTION_PLAN.md')
          handoff_path = Path('docs/power-color/90_HANDOFF.md')
          inventory_path = Path('docs/power-color/51_GRADE2_CONCEPT_SOURCE_INVENTORY.md')

          mappings = {
            'エレガント': '女性的な・気品のある・優雅な',
            'カジュアル': '明るい・活発な・親しみやすい',
            'クラシック': '伝統的な・重厚な・円熟した',
            'クリア': '明るい・爽やかな・透明感のある',
            'シック': '渋い・大人っぽい・洗練された',
            'ダイナミック': '強い・はっきりした・派手な',
            'ウォームナチュラル': '温もりのある・素朴な・穏やかな',
            'フレッシュナチュラル': '若々しい・新鮮な・爽やかな',
            'モダン': '現代的・人工的',
            'ロマンチック': 'かわいい・可憐な・愛らしい',
          }
          specs = [
            ('「エレガント」の代表的なイメージ語の組み合わせはどれですか。', ['女性的な・気品のある・優雅な','明るい・活発な・親しみやすい','渋い・大人っぽい・洗練された','現代的・人工的'], 0, 'エレガント'),
            ('「カジュアル」の代表的なイメージ語の組み合わせはどれですか。', ['伝統的な・重厚な・円熟した','明るい・活発な・親しみやすい','かわいい・可憐な・愛らしい','強い・はっきりした・派手な'], 1, 'カジュアル'),
            ('「クラシック」の代表的なイメージ語の組み合わせはどれですか。', ['明るい・爽やかな・透明感のある','若々しい・新鮮な・爽やかな','伝統的な・重厚な・円熟した','温もりのある・素朴な・穏やかな'], 2, 'クラシック'),
            ('「クリア」の代表的なイメージ語の組み合わせはどれですか。', ['現代的・人工的','渋い・大人っぽい・洗練された','女性的な・気品のある・優雅な','明るい・爽やかな・透明感のある'], 3, 'クリア'),
            ('「シック」の代表的なイメージ語の組み合わせはどれですか。', ['渋い・大人っぽい・洗練された','強い・はっきりした・派手な','明るい・活発な・親しみやすい','かわいい・可憐な・愛らしい'], 0, 'シック'),
            ('「ダイナミック」の代表的なイメージ語の組み合わせはどれですか。', ['温もりのある・素朴な・穏やかな','強い・はっきりした・派手な','現代的・人工的','明るい・爽やかな・透明感のある'], 1, 'ダイナミック'),
            ('「ウォームナチュラル」の代表的なイメージ語の組み合わせはどれですか。', ['女性的な・気品のある・優雅な','伝統的な・重厚な・円熟した','温もりのある・素朴な・穏やかな','若々しい・新鮮な・爽やかな'], 2, 'ウォームナチュラル'),
            ('「フレッシュナチュラル」の代表的なイメージ語の組み合わせはどれですか。', ['かわいい・可憐な・愛らしい','明るい・活発な・親しみやすい','現代的・人工的','若々しい・新鮮な・爽やかな'], 3, 'フレッシュナチュラル'),
            ('「現代的・人工的」というイメージ語に対応する配色イメージはどれですか。', ['モダン','シック','クリア','クラシック'], 0, 'モダン'),
            ('「かわいい・可憐な・愛らしい」というイメージ語に対応する配色イメージはどれですか。', ['エレガント','ロマンチック','カジュアル','フレッシュナチュラル'], 1, 'ロマンチック'),
            ('色彩検定協会の現行1級2次出題例で、「強い」「はっきりした」「派手な」に対応する配色イメージとして示されているものはどれですか。', ['モダン','カジュアル','ダイナミック','シック'], 2, 'ダイナミック'),
            ('「女性的な・気品のある・優雅な」というイメージ語に対応する配色イメージはどれですか。', ['ロマンチック','クリア','シック','エレガント'], 3, 'エレガント'),
          ]

          questions = []
          for i, (prompt, choices, correct, concept) in enumerate(specs, 1):
            answer = choices[correct]
            if concept in mappings and '代表的なイメージ語' in prompt:
              assert answer == mappings[concept]
            if concept in mappings and prompt.startswith('「') and '対応する配色イメージ' in prompt:
              assert answer == concept
            refs = ['aft_grade2_current_toc_2026', 'pluscolors_color_scheme_image_2024']
            if i in (6, 11):
              refs.append('aft_grade1_second_current_sample_2026')
            questions.append({
              'id': f'pc2-image-scheme-keywords-{i:04d}',
              'version': 1,
              'grade': 2,
              'taxonomyPath': 'grade2/image/image_scheme_keywords',
              'skillId': 'pc2.image.image_scheme_keywords',
              'categoryId': 'pc2.image',
              'questionType': 'text_choice',
              'prompt': prompt,
              'sentence': prompt,
              'choices': choices,
              'proposedAnswer': answer,
              'correctIndex': correct,
              'explanation': f'確認済みのイメージ別配色法では、「{concept}」は「{mappings[concept]}」に対応します。' if concept in mappings else '',
              'sourceRefs': refs,
              'difficulty': 'foundation' if i <= 10 else 'standard',
              'validationStatus': 'verified',
              'qa': {
                'generatedAs': 'pending_validation',
                'independentRecheck': f're-read the explicit text mapping for {concept} independently of proposedAnswer, then matched the keyword set to the ten current official Grade 2 image-scheme labels',
                'checkedOn': '2026-09-02'
              }
            })

          assert [sum(q['correctIndex'] == x for q in questions) for x in range(4)] == [3,3,3,3]
          assert len({(q['sentence'], tuple(q['choices'])) for q in questions}) == 12
          batch = {
            'format': 'power-color-grade2-authoring-v1',
            'grade': 2,
            'skill': {'id':'pc2.image.image_scheme_keywords','label':'イメージ別配色法のイメージ語','categoryId':'pc2.image'},
            'sourceContract': 'docs/power-color/50_GRADE2_EXECUTION_PLAN.md',
            'derivationRule': 'Current official Grade 2 text TOC explicitly places image-based color schemes immediately after hue-circle division and lists the ten image-scheme labels. Plus Colors, supervised by a Color Certification Level 1 coordinator and citing the 2020 revised official text, explicitly maps those ten labels to characteristic image words. The current official Level 1 second-stage sample independently confirms Dynamic = strong / clear-cut / flashy. This batch tests only label-to-keyword or keyword-to-label text mappings; no color appearance, RGB/HEX, monitor value, swatch, screenshot, or inferred geometry is used.',
            'qaSummary': {'generated':12,'checked':12,'verified':12,'needsRevision':0,'rejected':0,'pending':0,'correctIndexDistribution':{'A':3,'B':3,'C':3,'D':3}},
            'questions': questions
          }
          data_path.write_text(json.dumps(batch, ensure_ascii=False, indent=2) + '\n')

          test_path.write_text("""import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';
import { getAnswerFeedbackModel } from '../js/color-choice-renderer.js';

const batch = JSON.parse(await readFile(new URL('../data/grade2-authoring-image-scheme-keywords-0001-0012.json', import.meta.url), 'utf8'));
const runtime = JSON.parse(await readFile(new URL('../data/grade2-runtime.json', import.meta.url), 'utf8'));

function fingerprint(q) { return JSON.stringify([q.sentence, q.choices]); }

test('Grade 2 image-scheme keyword authoring batch is independently verified, nonvisual, balanced, and runtime-distinct', () => {
  assert.equal(batch.grade, 2);
  assert.equal(batch.skill.id, 'pc2.image.image_scheme_keywords');
  assert.equal(batch.questions.length, 12);
  assert.deepEqual(batch.qaSummary, {
    generated: 12, checked: 12, verified: 12, needsRevision: 0, rejected: 0, pending: 0,
    correctIndexDistribution: { A: 3, B: 3, C: 3, D: 3 }
  });
  const runtimeFp = new Set(runtime.questions.map(fingerprint));
  const positions = [0,0,0,0];
  for (const q of batch.questions) {
    assert.equal(q.validationStatus, 'verified');
    assert.equal(q.qa.generatedAs, 'pending_validation');
    assert.equal(q.questionType, 'text_choice');
    assert.equal(q.taxonomyPath, 'grade2/image/image_scheme_keywords');
    assert.equal(q.choices.length, 4);
    assert.equal(new Set(q.choices).size, 4);
    assert.equal(q.proposedAnswer, q.choices[q.correctIndex]);
    assert.ok(q.sourceRefs.includes('aft_grade2_current_toc_2026'));
    assert.ok(q.sourceRefs.includes('pluscolors_color_scheme_image_2024'));
    assert.equal(runtimeFp.has(fingerprint(q)), false);
    assert.equal('presentation' in q, false);
    assert.equal('colorRefs' in q, false);
    positions[q.correctIndex] += 1;
    const feedback = getAnswerFeedbackModel(q, new Map());
    assert.equal(feedback.kind, 'text');
    assert.equal(feedback.showSwatch, false);
  }
  assert.deepEqual(positions, [3,3,3,3]);
  assert.equal(new Set(batch.questions.map(fingerprint)).size, 12);
});
""")

          audit_path.write_text("""# Grade 2 source audit — image-scheme keywords

Checked: 2026-09-02

## Scope authority

- Color Certification Association current Grade 2 official-text TOC: https://www.aft.or.jp/images/text_of-2st-grade_mokuji.pdf
  - places `配色イメージ / イメージ別配色法` immediately after hue-circle-division schemes;
  - lists ten labels: エレガント、カジュアル、クラシック、クリア、シック、ダイナミック、ウォームナチュラル、フレッシュナチュラル、モダン、ロマンチック.

## Explicit text rule

- Plus Colors, `普遍的な基本の配色イメージ`: https://pluscolors.net/color_knowledge/colorscheme_image/
  - supervised by a Color Certification Level 1 coordinator;
  - cites the 2020 revised Color Certification official text;
  - explicitly maps all ten current labels to characteristic image words.
- Color Certification Association current Level 1 second-stage sample: https://www.aft.or.jp/pages/feature/exam1-second
  - explicitly asks which image scheme corresponds to `強い / はっきりした / 派手な` and gives `ダイナミック` as the answer.

## Retained rule boundary

This batch retains only text-semantic label↔keyword mappings. Color ranges and tone ranges are deliberately not required for an answer in this batch. No question derives an answer from image appearance, sample pixels, RGB/HEX, monitor values, screenshots or unstated geometry.

## Independent QA

All 12 records were created pending-first, then each mapping was re-read independently before comparison with the proposed answer. Result: 12 checked / 12 verified / 0 needs_revision / 0 rejected / 0 pending. Correct positions A/B/C/D = 3/3/3/3. Runtime full-fingerprint overlap = 0.
""")

          status = json.loads(status_path.read_text())
          assert status['grade2']['runtime_questions']['verified'] == 132
          status['grade2']['active_skill'] = 'pc2.image.image_scheme_keywords'
          status['grade2']['active_authoring'] = {'generated':12,'checked':12,'verified':12,'pending':0}
          status['grade2']['next'] = 'Promote pc2.image.image_scheme_keywords record-identically into Grade 2 runtime 132 to 144 after exact-equality/full-fingerprint/shared-engine gates pass.'
          status['current_run']['checkpoints_completed'] = 2
          status['current_run']['generated'] = 12
          status['current_run']['checked'] = 24
          status['current_run']['verified'] = 24
          status['current_run']['checkpoint_breakdown'].append('Source-resolved pc2.image.image_scheme_keywords at the next official-text-order topic and generated 12 pending-first text questions; independent QA verified 12/12 with A/B/C/D = 3/3/3/3 and zero runtime fingerprint overlap.')
          status['next'] = 'Promote pc2.image.image_scheme_keywords record-identically into Grade 2 runtime 132 to 144.'
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')

          plan = plan_path.read_text()
          section = """
## Image-based scheme keywords

- [x] Current official Grade 2 TOC confirms `配色イメージ / イメージ別配色法` as the next topic and lists all ten labels.
- [x] Fix a text-only label↔image-keyword rule from Plus Colors, supervised by a Color Certification Level 1 coordinator and citing the 2020 revised official text.
- [x] Independently corroborate `ダイナミック = 強い・はっきりした・派手な` against the current Color Certification Association Level 1 second-stage official sample.
- [x] Generate 12 pending-first text questions; 12 checked / 12 verified / 0 needs_revision / 0 rejected / 0 pending; A/B/C/D = 3/3/3/3; zero runtime fingerprint overlap.
- [ ] Promote `pc2.image.image_scheme_keywords` record-identically; target runtime 132 → 144 after exact-equality/full-fingerprint/shared-engine gates.

"""
          marker = '## Exact next start point\n\nContinue source acquisition at the next official-text-order topic after hue-circle division schemes. Author only if an explicit auditable nonvisual rule can be fixed without image appearance, RGB/HEX, monitor values or unstated geometry.\n'
          assert marker in plan
          plan = plan.replace(marker, section + '## Exact next start point\n\nPromote `grade2-authoring-image-scheme-keywords-0001-0012.json` record-identically into `grade2-runtime.json`, extend the runtime gate to twelve batches / 144 verified questions, and require exact record equality, zero full-fingerprint duplicates and shared Power TOEIC engine execution before continuing to Visual Design.\n')
          plan_path.write_text(plan)

          handoff = handoff_path.read_text()
          handoff = handoff.replace('Continue source acquisition at the next official-text-order topic after hue-circle division schemes. Do not author a new batch unless an explicit auditable nonvisual rule is fixed; retain all monitor/display and image-inference prohibitions.', 'The next official topic, `配色イメージ / イメージ別配色法`, is source-resolved as a text-only label↔keyword micro-skill. `pc2.image.image_scheme_keywords` has 12 independently checked questions: 12 verified / pending 0, A/B/C/D = 3/3/3/3, zero runtime fingerprint overlap. Audit: `docs/power-color/audits/2026-09-02-grade2-image-scheme-keywords.md`.\n\nPromote `qualifications/color-certification/data/grade2-authoring-image-scheme-keywords-0001-0012.json` record-identically into runtime 132 → 144. Extend `grade2-runtime-promotion.test.js` to twelve batches and require exact equality, zero full-fingerprint duplicates and shared Power TOEIC engine execution before merge.')
          handoff_path.write_text(handoff)

          inv = inventory_path.read_text()
          addition = """
12. `pc2.image.image_scheme_keywords`
   - current official Grade 2 TOC confirms the ten image-scheme labels and exact scope/order;
   - Plus Colors explicitly maps the ten labels to characteristic image words and cites the 2020 revised official text under Level 1 coordinator supervision;
   - current official Level 1 second-stage sample independently confirms `ダイナミック = 強い・はっきりした・派手な`;
   - retained questions are text-semantic only; no color appearance, RGB/HEX, monitor value or inferred image geometry;
   - authoring 12/12 verified, pending 0, awaiting runtime promotion;
   - audit: `docs/power-color/audits/2026-09-02-grade2-image-scheme-keywords.md`.
"""
          assert '12. `pc2.image.image_scheme_keywords`' not in inv
          inv = inv.replace('\n## Current official-text scope inventory\n', addition + '\n## Current official-text scope inventory\n')
          old = 'The next current official Grade 2 TOC topics after hue-circle division include:\n- image-based schemes;\n- visual/media, fashion, interior and landscape color coordination;\n- conventional color names;\n- PCCS tone-by-value appendix.'
          new = 'The current official Grade 2 TOC frontier is now after image-based schemes. Remaining later topics include:\n- visual/media, fashion, interior and landscape color coordination;\n- conventional color names;\n- PCCS tone-by-value appendix.'
          assert old in inv
          inv = inv.replace(old, new)
          inv = inv.replace('1. Grade 2 runtime frontier is 132 verified / pending 0 across eleven skills.\n2. Continue to the next official-TOC topic after hue-circle division schemes and acquire an explicit auditable nonvisual rule before authoring.\n3. If no auditable rule can be fixed, record that blocker; do not infer from image appearance or unstated geometry.', '1. Grade 2 runtime frontier is 132 verified / pending 0 across eleven promoted skills.\n2. Promote the independently verified `pc2.image.image_scheme_keywords` 12-question batch record-identically, extending runtime 132 → 144 after gates pass.\n3. Then continue to Visual Design, without inferring answers from images, RGB/HEX or monitor values.')
          inventory_path.write_text(inv)
          PY
      - name: Run full Power Color tests
        run: node --test qualifications/color-certification/tests/*.test.js
      - name: Commit authoring checkpoint and remove temporary workflow
        run: |
          git config user.name "Power Color Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/power-color-grade2-image-keywords-temp.yml
          git add docs/power-color qualifications/color-certification/data/grade2-authoring-image-scheme-keywords-0001-0012.json qualifications/color-certification/tests/grade2-image-scheme-keywords-authoring.test.js
          git commit -m "power-color: author Grade 2 image-scheme keywords"
          git push origin HEAD:power-color-grade2-image-keywords
