name: Topic 22 sync simulation progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic22-progress-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize Topic 22 source, STATUS and HANDOFF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('denken-shinkansen/07_shinkansen_machine_2')
          source = root / 'topics/22_integrated_route_simulation/22_integrated_route_simulation.md'
          status = root / 'STATUS.md'
          handoff = root / 'HANDOFF.md'

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found: {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              source,
              '制作前 `EXAM_ALIGNMENT` と解説source本文を完了した。現在 `topic_22_explanation_source_complete / IN_PROGRESS`。',
              '制作前 `EXAM_ALIGNMENT`、解説source本文、総合シミュレーション計算プログラム・CSV・指定6グラフ・数値QAを完了した。現在 `topic_22_simulation_artifacts_complete / IN_PROGRESS`。',
          )
          replace_once(
              source,
              '解説source本文では固定16答案要素を全て対応節へ接続した。次工程は、このsourceの式・符号規約・仮定値に基づく総合シミュレーション計算プログラム、CSV、指定6グラフの作成と数値QA。',
              '解説source本文では固定16答案要素を全て対応節へ接続し、同じ式・符号規約・仮定値から総合シミュレーション計算プログラム、3301行のCSV、指定6グラフを生成して数値QAまで完了した。次工程はTopic 22 解説プリントPDF。',
          )
          replace_once(
              source,
              '- 判定: `PASS / topic_22_explanation_source_complete / IN_PROGRESS`',
              '- 判定: `PASS / topic_22_simulation_artifacts_complete / IN_PROGRESS`\n\n# 総合シミュレーション成果物品質ゲート\n\n- 計算プログラム: `22_integrated_route_simulation_calc.py` / PASS\n- CSV: `22_integrated_route_simulation_results.csv` / 3301行 / PASS\n- 系列SPECの8出力: `8 / 8 SAVED`\n- 指定グラフ: `6 / 6 GENERATED`\n- 数値式照合: 同期速度・滑り・速度換算・駆動力・加速度すべて PASS\n- 力行点: `1828` 点 / PASS\n- 回生点: `1149` 点 / PASS\n- 消費電力・回生電力の同時正値: `0` 点 / PASS\n- 速度負値: `0` 点 / PASS\n- SVG XML: `6 / 6 PASS`\n- 代表点独立再計算: `t=120 s` 力行、`t=210 s` 回生 / PASS\n- 詳細: `22_integrated_route_simulation_calculation_qa.md`\n- 固定EXAM_ALIGNMENT: 一次4問＋二次2問・16答案要素を変更なし\n- 未確認実車・実路線値の真値化: `0件 / PASS`\n- 系列SPEC外の新規制御方式・車両仕様追加: `0件 / PASS`\n- 独立過去問再解答: `NOT_RUN`（全成果物完成後）\n- 次工程: Topic 22 解説プリントPDF',
          )

          replace_once(
              status,
              '- current_status: `topic_22_explanation_source_complete / IN_PROGRESS`',
              '- current_status: `topic_22_simulation_artifacts_complete / IN_PROGRESS`',
          )
          replace_once(
              status,
              '- next_start: Topic 22 総合シミュレーション計算プログラム・CSV・指定6グラフ・数値QA',
              '- next_start: Topic 22 解説プリントPDF',
          )
          replace_once(
              status,
              '## 今回進めた内容\nTopic 22の解説source本文を完成させた。変圧器損失・効率、PWM/DCリンク/VVVF、誘導機の同期速度・滑り・等価回路・二次入力・トルク、歯車・車輪・走行力学、PI/PID・閉ループ応答、力行・回生を一つの計算系列へ接続した。東京―新大阪の実運転曲線や未確認実機定数は採用せず、総合シミュレーション条件は教材用仮定値として分離した。\n\n完成数は `21 / 22` のまま。\n\n## 次工程\nTopic 22 総合シミュレーション計算プログラム・CSV・指定6グラフ・数値QA。解説sourceで固定した式、符号規約、仮定値だけを使い、系列SPECの8出力と6グラフを再現可能な形で生成する。',
              '## Topic 22 総合シミュレーション成果物\n- 状態: `PASS / topic_22_simulation_artifacts_complete / IN_PROGRESS`\n- `topics/22_integrated_route_simulation/22_integrated_route_simulation_calc.py`\n- `topics/22_integrated_route_simulation/22_integrated_route_simulation_results.csv`: `3301` 行\n- 指定6グラフ: `6 / 6 GENERATED`\n- 数値式照合: 同期速度・滑り・速度換算・駆動力・加速度 `PASS`\n- 力行点: `1828` 点 / PASS\n- 回生点: `1149` 点 / PASS\n- 消費・回生同時正値: `0` 点 / PASS\n- 速度負値: `0` 点 / PASS\n- SVG XML: `6 / 6 PASS`\n- 代表点独立再計算: 力行・回生各1点 / PASS\n- 詳細QA: `topics/22_integrated_route_simulation/22_integrated_route_simulation_calculation_qa.md`\n- 未確認実車・実路線値の真値化: `0件 / PASS`\n- 固定EXAM_ALIGNMENT: 一次4問＋二次2問・16答案要素を変更なし\n- 独立過去問再解答: `NOT_RUN`\n\n## 今回進めた内容\nTopic 22の総合シミュレーション計算プログラムを作成し、sourceで固定済みの教材用仮定値から3301行のCSVと指定6グラフを生成した。同期速度・滑り・速度換算・駆動力・加速度を式で照合し、力行1828点、回生1149点、消費・回生同時正値0点、速度負値0点を確認した。代表点は力行・回生各1点を別計算し一致を確認した。\n\n完成数は `21 / 22` のまま。\n\n## 次工程\nTopic 22 解説プリントPDF。固定16答案要素、解説source、総合シミュレーション成果物を教材化し、試験論点・式・代表計算・6グラフへ接続する。',
          )

          replace_once(
              handoff,
              '- current status: `topic_22_explanation_source_complete / IN_PROGRESS`',
              '- current status: `topic_22_simulation_artifacts_complete / IN_PROGRESS`',
          )
          replace_once(
              handoff,
              '- 次工程: Topic 22 総合シミュレーション計算プログラム・CSV・指定6グラフ・数値QA',
              '- 次工程: Topic 22 解説プリントPDF',
          )
          replace_once(
              handoff,
              '## 次工程\nTopic 22の総合シミュレーション計算プログラムを作成し、同じ仮定値からCSVと指定6グラフを生成する。数値QAでは同期速度・滑り・速度変換・駆動力・加速度・力行/回生符号・CSV/グラフ整合を検証する。実車・実路線の未確認値へ置換しない。',
              '## Topic 22 総合シミュレーション成果物完了\n- 状態: `PASS / topic_22_simulation_artifacts_complete / IN_PROGRESS`\n- program: `topics/22_integrated_route_simulation/22_integrated_route_simulation_calc.py`\n- CSV: `topics/22_integrated_route_simulation/22_integrated_route_simulation_results.csv` / `3301` 行\n- 指定6グラフ: `6 / 6 GENERATED`\n- 数値式照合: 同期速度・滑り・速度換算・駆動力・加速度 `PASS`\n- 力行点: `1828` 点 / PASS\n- 回生点: `1149` 点 / PASS\n- 消費・回生同時正値: `0` 点 / PASS\n- 速度負値: `0` 点 / PASS\n- SVG XML: `6 / 6 PASS`\n- 代表点独立再計算: 力行・回生各1点 / PASS\n- QA: `topics/22_integrated_route_simulation/22_integrated_route_simulation_calculation_qa.md`\n- 固定EXAM_ALIGNMENT: 一次4問＋二次2問・16答案要素を変更なし\n- 未確認実車・実路線値の真値化: `0件 / PASS`\n- 独立過去問再解答: `NOT_RUN`\n\n## 次工程\nTopic 22 解説プリントPDF。固定EXAM_ALIGNMENT、解説source、総合シミュレーション結果を使い、二種一次・二次へ接続する解説プリントを作る。',
          )
          PY
      - name: Commit synchronized progress and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add denken-shinkansen/07_shinkansen_machine_2/STATUS.md \
                  denken-shinkansen/07_shinkansen_machine_2/HANDOFF.md \
                  denken-shinkansen/07_shinkansen_machine_2/topics/22_integrated_route_simulation/22_integrated_route_simulation.md
          git rm .github/workflows/topic22-progress-sync.yml
          git commit -m "Topic 22: sync simulation progress"
          git push origin HEAD:main
