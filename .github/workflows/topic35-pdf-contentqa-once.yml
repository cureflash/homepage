name: Topic 35 PDF content QA one-shot

on:
  push:
    branches: [main]
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis/.pdf_content_qa/BUILD'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Poppler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Check extracted PDF content
        shell: bash
        run: |
          set -euo pipefail
          base='denken-shinkansen/05_shinkansen_vehicle_2/topics/35_atc_track_circuit_analysis'
          pdf="$base/35_atc_track_circuit_analysis_explanation.pdf"
          pdftotext -layout "$pdf" /tmp/topic35.txt 2>/tmp/pdftotext.err
          test ! -s /tmp/pdftotext.err
          for term in '軌道回路' 'レールインピーダンス' '車軸短絡' '受信レベル' '信号電流' '回路条件' 'フェイルセーフ'; do grep -Fq "$term" /tmp/topic35.txt; done
          for term in 'R8一次' 'R7一次' 'R6一次' 'R5一次'; do grep -Fq "$term" /tmp/topic35.txt; done
          for term in '9.00' '9.78' '15.677' '2.683'; do grep -Fq "$term" /tmp/topic35.txt; done
          if LC_ALL=C grep -q $'\xEF\xBF\xBD' /tmp/topic35.txt; then exit 1; fi
          chars="$(wc -m < /tmp/topic35.txt | tr -d ' ')"
          echo "content_terms=7/7 exam_labels=4/4 example_values=4/4 replacement_chars=0 chars=$chars"
          grep -n -E 'R8一次|R7一次|R6一次|R5一次|固定答案' /tmp/topic35.txt | tail -40
          rm -rf "$base/.pdf_content_qa"
          rm -f .github/workflows/topic35-pdf-contentqa-once.yml
      - name: Remove one-shot content QA trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Topic 35 PDF content QA'
          git push origin HEAD:main
