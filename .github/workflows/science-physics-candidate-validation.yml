name: Validate formal Physics sound candidates

on:
  push:
    branches:
      - science-physics-sound-20260829
    paths:
      - '.github/workflows/science-physics-candidate-validation.yml'
      - 'scripts/science_physics_sound.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_physics_sound.py'
      - '.github/workflows/science-physics-publish.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: science-physics-sound-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Run shared and formal Physics regressions
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py
          python tests/test_science_physics_waves.py
          python tests/test_science_physics_sound.py

      - name: Render candidate batch without publication
        run: python scripts/publish_science_physics.py

      - name: Validate prospective catalog and PDFs
        run: |
          python tests/test_science_physics_sound.py
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.worksheet_factory import validate_catalog

          root = Path('.')
          catalog = json.loads((root / 'worksheets/catalog.json').read_text(encoding='utf-8'))
          validate_catalog(catalog, root)
          rows = [x for x in catalog if x.get('id', '').startswith('science-physics-motion-')]
          assert len(rows) == 1810, len(rows)
          assert len({x['content_hash'] for x in rows}) == 1810
          sound = [x for x in rows if x.get('unit') == '波：音']
          assert len(sound) == 80, len(sound)
          assert Counter(x['skill'] for x in sound) == Counter({
              'sound-interference-diffraction-concepts': 40,
              'sound-doppler-core-concepts': 40,
          })
          assert Counter(x['worksheet_mode'] for x in sound) == Counter({
              'retrieval-forward': 20,
              'retrieval-reverse': 20,
              'retrieval-fill': 20,
              'retrieval-tf': 20,
          })
          assert all(x['answer_type'] == 'accepted-set' for x in sound)
          for entry in sound:
              path = root / entry['url']
              data = path.read_bytes()
              assert data.startswith(b'%PDF')
              assert path.stat().st_size > 1000
              assert b'/Count 2' in data, entry['id']
          print('Formal Physics sound candidate validation: 80 PDFs / 1810 rows OK')
          PY
