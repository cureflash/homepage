name: Validate formal Physics candidate

on:
  push:
    branches:
      - science-physics-thermo-20260829
    paths:
      - '.github/workflows/science-physics-candidate-validation.yml'
      - 'scripts/science_physics_thermal_gas.py'
      - 'scripts/publish_science_physics.py'
      - 'tests/test_science_physics_thermal_gas.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-physics-thermo-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check reportlab
      - name: Run shared and formal Physics regressions
        run: |
          python tests/test_worksheet_factory.py
          python tests/test_science_formula_relations.py
          python tests/test_science_product_over_divisor.py
          python tests/test_science_physics_projectile.py
          python tests/test_science_physics_rigid_body.py
          python tests/test_science_physics_momentum.py
          python tests/test_science_physics_circular_motion.py
          python tests/test_science_physics_circular_period.py
          python tests/test_science_physics_centrifugal_shm.py
          python tests/test_science_physics_shm_periods.py
          python tests/test_science_physics_gravitation.py
          python tests/test_science_physics_gravitation_energy_gas.py
          python tests/test_science_physics_ideal_gas.py
          python tests/test_science_physics_thermal_gas.py
      - name: Dry-run 110-PDF candidate publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from scripts.publish_science_physics import build_batch
          from scripts.worksheet_factory import render_pdf, validate_catalog

          root = Path('.')
          _, _, _, pending, prospective = build_batch(root)
          assert len(pending) == 110, len(pending)
          validate_catalog(prospective)
          rows = [row for row in prospective if row.get('id', '').startswith('science-physics-motion-')]
          assert len(rows) == 1610, len(rows)
          assert len({row['content_hash'] for row in rows}) == 1610
          with tempfile.TemporaryDirectory() as tmp:
              out = Path(tmp)
              for item in pending:
                  path = out / item['filename']
                  render_pdf(path, item['title'], item['problems'])
                  data = path.read_bytes()
                  assert data.startswith(b'%PDF')
                  assert path.stat().st_size > 1000
                  assert b'/Count 2' in data, item['filename']
          print('Candidate 110-PDF dry-run validation: OK')
          PY
