name: Temp build Topic 17 PPTX

on:
  push:
    paths:
      - 'denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/_build_topic17_pptx.py'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-pptx
      - name: Build and validate
        run: python denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/_build_topic17_pptx.py
      - name: Commit generated PPTX
        shell: bash
        run: |
          set -euo pipefail
          GEN='denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/_build_topic17_pptx.py'
          PPTX='denken-shinkansen/10_electrical_math_2/topics/17_ode_numerical_methods/17_ode_numerical_methods_images.pptx'
          git rm "$GEN"
          git add "$PPTX"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'denken: rebuild Topic 17 PowerPoint artifact'
          for try in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
