name: Topic 35 progress sync

on:
  push:
    paths:
      - '.github/workflows/topic35-progress-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical progress records
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('denken-shinkansen/01_shinkansen_vehicle_3/STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status = status.replace(
              '- current_status: `topic_35_practice_pdf_complete`',
              '- current_status: `topic_35_powerpoint_complete`',
              1,
          )
          status = status.replace(
              '- next_start: Topic 35の解説画像PowerPoint。固定5過去問の要求事項を16:9で可視化し、表示QA・overflow検査・PPTX ZIP整合性・固定EXAM_ALIGNMENT `5 / 5` 接続を確認する',
              '- next_start: Topic 35の完成後blind独立再解答。固定5過去問を保存済み正答・完成済み最終導出を見ずに、完成教材だけで再解答する。全問の選択肢・根拠を確定してから公式解答と照合し、教材外知識補完0件を確認する。固定5問・教材成果物・EXAM_ALIGNMENTは変更しない',
              1,
          )
          ppt_block = '''## 35 PowerPoint QA
          - `topics/35_comtrac_disruption_management/35_comtrac_disruption_management_images.pptx`
          - 画面比率: `16:9`
          - スライド数: `3`
          - 固定EXAM_ALIGNMENT: `5 / 5問` 可視化
          - 180 dpi全スライド表示QA: `3 / 3 PASS`
          - overflow検査: `0件 / PASS`
          - PPTX ZIP整合性: PASS
          - 外部引用画像: `0件`
          - 固定範囲外追加: `0件`
          - Topic 36以降先取り: `0件`
          - Topic 34論理回路の再体系化: `0件`
          - 未確認COMTRAC内部仕様追加: `0件`
          - 機能分散と冗長化の混同: `0件`
          - QA記録: `topics/35_comtrac_disruption_management/35_comtrac_disruption_management_images_qa.md`

          '''.replace('          ', '')
          if '## 35 PowerPoint QA' not in status:
              status = status.replace('\n## 34 EXAM_ALIGNMENT\n', '\n' + ppt_block + '## 34 EXAM_ALIGNMENT\n', 1)
          status_path.write_text(status, encoding='utf-8')

          handoff_path = Path('denken-shinkansen/01_shinkansen_vehicle_3/HANDOFF.md')
          handoff = handoff_path.read_text(encoding='utf-8')
          start = handoff.index('## 今回進捗\n')
          end = handoff.index('\n## Topic 35 固定EXAM_ALIGNMENT', start)
          progress = '''## 今回進捗
          Topic 35の解説画像PowerPointを完成し、GitHub正本へ反映した。

          - 固定EXAM_ALIGNMENT 5問は変更なし
          - PowerPoint: `topics/35_comtrac_disruption_management/35_comtrac_disruption_management_images.pptx`
          - 画面比率: `16:9`
          - スライド数: `3`
          - 固定5過去問の要求事項: `5 / 5` 可視化
          - 180 dpi全スライド表示QA: `3 / 3 PASS`
          - overflow検査: `0件 / PASS`
          - PPTX ZIP整合性: PASS
          - 外部引用画像: `0件`
          - 固定範囲外追加: `0件`
          - Topic 36以降先取り: `0件`
          - Topic 34論理回路の再体系化: `0件`
          - 未確認COMTRAC内部仕様追加: `0件`
          - 機能分散と冗長化の混同: `0件`
          - QA記録: `topics/35_comtrac_disruption_management/35_comtrac_disruption_management_images_qa.md`
          '''.replace('          ', '')
          handoff = handoff[:start] + progress + handoff[end:]
          handoff = handoff.replace(
              '- `current_status`: `topic_35_practice_pdf_complete`',
              '- `current_status`: `topic_35_powerpoint_complete`',
              1,
          )
          handoff = handoff.replace(
              'Topic 35の解説画像PowerPoint。固定5過去問の要求事項を16:9で可視化し、表示QA、overflow検査、PPTX ZIP整合性、固定EXAM_ALIGNMENT `5 / 5` 接続を確認する。固定範囲外、Topic 36以降、未確認COMTRAC内部仕様は追加しない。',
              'Topic 35の完成後blind独立再解答。固定5過去問を保存済み正答・完成済み最終導出を見ずに、完成教材だけで再解答する。全問の選択肢・根拠を確定してから公式解答と照合し、教材外知識補完0件を確認する。固定5問・教材成果物・EXAM_ALIGNMENTは変更しない。',
              1,
          )
          handoff_path.write_text(handoff, encoding='utf-8')
      - name: Commit progress records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denken-shinkansen/01_shinkansen_vehicle_3/STATUS.md denken-shinkansen/01_shinkansen_vehicle_3/HANDOFF.md
          git diff --cached --quiet || git commit -m 'Sync Topic 35 PowerPoint progress'
          git push
