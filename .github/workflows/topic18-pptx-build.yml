name: Build Topic 18 PPTX

on:
  push:
    branches: [main]
    paths:
      - 'denken-shinkansen/05_shinkansen_vehicle_2/topics/18_e2series_50hz_60hz_flux/_build_topic18_pptx.py'
      - '.github/workflows/topic18-pptx-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install python-pptx==1.0.2 lxml==5.4.0
      - run: python denken-shinkansen/05_shinkansen_vehicle_2/topics/18_e2series_50hz_60hz_flux/_build_topic18_pptx.py
      - name: Commit generated PPTX and QA
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add denken-shinkansen/05_shinkansen_vehicle_2/topics/18_e2series_50hz_60hz_flux/18_e2series_50hz_60hz_flux_images.pptx
          git add denken-shinkansen/05_shinkansen_vehicle_2/topics/18_e2series_50hz_60hz_flux/18_e2series_50hz_60hz_flux_powerpoint_qa.md
          if ! git diff --cached --quiet; then
            git commit -m 'denken vehicle2: regenerate Topic 18 PowerPoint [skip actions]'
            git push
          fi
