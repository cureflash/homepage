name: Grade 5 worksheet factory checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_grade5_*.py'
      - 'tests/test_grade5_*_publisher.py'
      - '.github/workflows/grade5-core-publish.yml'
  workflow_dispatch:
permissions:
  contents: write

# All worksheet publishers that mutate worksheets/catalog.json share this
# repository-wide group so math and science cannot validate/publish stale
# catalog snapshots concurrently.
concurrency:
  group: worksheet-catalog-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Reconcile latest main and validate grade 5 batch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            python scripts/publish_grade5_first_four.py .
            python scripts/publish_grade5_number_properties_and_common_denominator.py .
            python scripts/publish_grade5_fraction_core.py .
            python scripts/publish_grade5_final_four.py .
            python tests/test_grade5_first_four_publisher.py
            python tests/test_grade5_number_properties_and_common_denominator_publisher.py
            python tests/test_grade5_fraction_core_publisher.py
            python tests/test_grade5_final_four_publisher.py
            python tests/test_worksheet_factory.py
            before=$(git rev-parse origin/main); git fetch origin main; after=$(git rev-parse origin/main)
            [ "$before" = "$after" ] && break
            [ "$attempt" = 3 ] && { echo 'main kept moving; aborting rather than validating stale state' >&2; exit 1; }
          done
      - name: Commit validated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worksheet-factory-bot'; git config user.email '89366952+cureflash@users.noreply.github.com'
          git add worksheets/catalog.json materials/worksheets/elementary/grade-05/
          if git diff --cached --quiet; then echo 'No grade-5 checkpoint changes to publish.'; exit 0; fi
          git commit -m 'Publish grade 5 worksheet checkpoint'; git push origin HEAD:main
