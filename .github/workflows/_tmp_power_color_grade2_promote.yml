name: tmp-power-color-grade2-promote
on:
  push:
    branches: [power-color-grade2-interior-promotion-20260902]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified Interior batches record-identically
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='qualifications/color-certification';
          const runtimePath=`${root}/data/grade2-runtime.json`;
          const aPath=`${root}/data/grade2-authoring-interior-color-planning-principles-0001-0012.json`;
          const zPath=`${root}/data/grade2-authoring-interior-zoning-classification-0001-0012.json`;
          const testPath=`${root}/tests/grade2-runtime-promotion.test.js`;
          const p105TestPath=`${root}/tests/grade2-interior-p105-authoring.test.js`;
          const runtime=JSON.parse(fs.readFileSync(runtimePath,'utf8'));
          const a=JSON.parse(fs.readFileSync(aPath,'utf8'));
          const z=JSON.parse(fs.readFileSync(zPath,'utf8'));
          for (const batch of [a,z]) {
            if (!runtime.skills.some(s=>s.id===batch.skill.id)) runtime.skills.push(batch.skill);
            for (const q of batch.questions) if (!runtime.questions.some(r=>r.id===q.id)) runtime.questions.push(q);
          }
          if (runtime.questions.length!==216) throw new Error(`runtime length ${runtime.questions.length}`);
          fs.writeFileSync(runtimePath, JSON.stringify(runtime,null,2)+'\n');
          let t=fs.readFileSync(testPath,'utf8');
          const anchor="const basicTrend = JSON.parse(await readFile(new URL('../data/grade2-authoring-basic-trend-color-classification-0001-0012.json', import.meta.url), 'utf8'));";
          if (!t.includes('const interiorColorPlanning')) t=t.replace(anchor, anchor+"\nconst interiorColorPlanning = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-color-planning-principles-0001-0012.json', import.meta.url), 'utf8'));\nconst interiorZoning = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-zoning-classification-0001-0012.json', import.meta.url), 'utf8'));");
          t=t.replace('imageBasics, basicTrend];','imageBasics, basicTrend, interiorColorPlanning, interiorZoning];');
          t=t.replace('runtime.questions.length, 192','runtime.questions.length, 216');
          t=t.replace("validationStatus === 'verified').length, 192","validationStatus === 'verified').length, 216");
          t=t.replace('totalCount: 48','totalCount: 54');
          t=t.replace(').length, 48',').length, 54');
          fs.writeFileSync(testPath,t);
          let p=fs.readFileSync(p105TestPath,'utf8');
          p=p.replace("const newFingerprints = [...colorPlanning.questions, ...zoning.questions].map(fingerprint);\n  assert.equal(new Set(newFingerprints).size, 24);\n  const runtimeFingerprints = new Set(runtime.questions.map(fingerprint));\n  assert.ok(newFingerprints.every((fp) => !runtimeFingerprints.has(fp)));","const promoted = [...colorPlanning.questions, ...zoning.questions];\n  const promotedIds = new Set(promoted.map((q) => q.id));\n  const runtimePromoted = runtime.questions.filter((q) => promotedIds.has(q.id));\n  assert.deepEqual(runtimePromoted, promoted);\n  assert.equal(new Set(promoted.map(fingerprint)).size, 24);");
          fs.writeFileSync(p105TestPath,p);
          fs.rmSync('.github/workflows/_tmp_power_color_grade2_promote.yml');
          NODE
      - name: Run Power Color tests
        run: node --test qualifications/color-certification/tests/*.test.js
      - name: Commit generated promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualifications/color-certification/data/grade2-runtime.json qualifications/color-certification/tests/grade2-runtime-promotion.test.js qualifications/color-certification/tests/grade2-interior-p105-authoring.test.js .github/workflows/_tmp_power_color_grade2_promote.yml
          git commit -m "Promote Grade 2 Interior p105 batches"
          git push origin HEAD:power-color-grade2-interior-promotion-20260902
