name: Temporary Power Color Grade 2 p128 sync

on:
  pull_request:
    branches: [main]
    paths:
      - .automation-trigger-power-color-g2-p128-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/power-color-g2-p128-sync-20260903'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize canonical Power Color docs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const statusPath = 'docs/power-color/STATUS.json';
          const handoffPath = 'docs/power-color/90_HANDOFF.md';
          const plan20Path = 'docs/power-color/20_EXECUTION_PLAN.md';
          const plan50Path = 'docs/power-color/50_GRADE2_EXECUTION_PLAN.md';

          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          status.checked_on = '2026-09-03';
          status.grade2.runtime_questions = { verified: 348, pending: 0, needs_revision: 0, rejected: 0 };
          if (!status.grade2.runtime_skills.includes('pc2.conventional.jis_name_structure')) status.grade2.runtime_skills.push('pc2.conventional.jis_name_structure');
          status.grade2.latest_promotion_gate = { status: 'passed', workflow_run: 33690978044, head: '564f92f57eb18e78c31ec39263259d243690cf93', pr: 599, merge_commit: '61508bbc0a214873d023fb3487e14affe2de3a13' };
          status.grade2.active_skill = null;
          status.grade2.active_authoring = null;
          status.grade2.active_authoring_qa = null;
          status.grade2.next = 'Source-acquire the individual Grade 2 p.128 和色名 boundary from current explicit auditable authority. Do not infer Grade 2 membership/readings from Grade 3, and do not infer RGB/HEX/display values or swatch appearance.';
          status.current_run = {
            checkpoints_completed: 2,
            generated: 0,
            checked: 0,
            verified: 0,
            revision_events: 0,
            needs_revision: 0,
            rejected: 0,
            pending: 0,
            checkpoint_breakdown: [
              'Reconciled merged PR #597 and promoted pc2.conventional.jis_name_structure record-identically after exact-equality/full-fingerprint/shared-engine verification.',
              'Grade 2 runtime advanced 336→348 verified and 28→29 skills; Power Color CI 33690978044 succeeded on exact promotion head before PR #599 merged.'
            ]
          };
          status.next = status.grade2.next;
          fs.writeFileSync(statusPath, JSON.stringify(status, null, 2) + '\n');

          let handoff = fs.readFileSync(handoffPath, 'utf8');
          handoff = handoff.replace('Grade 2 runtime is 336 verified / pending 0 across twenty-eight promoted skills.', 'Grade 2 runtime is 348 verified / pending 0 across twenty-nine promoted skills.');
          if (!handoff.includes('pc2.conventional.jis_name_structure')) {
            const marker = '\nVisual Design, Fashion p.091/p.095/p.096, Interior p.104, p.107 and p.111 remain source-blocked.';
            const block = '\n\np.128 `慣用色名（JISの慣用色名より）` narrow structure is source-resolved under `docs/power-color/audits/2026-09-03-grade2-p128-jis-conventional-name-structure-source-audit.md`. `pc2.conventional.jis_name_structure` contains 12 pending-first independently rechecked records, 12/12 verified with A/B/C/D=3/3/3/3, and is promoted record-identically. Runtime 336 → 348 and twenty-eight → twenty-nine skills. Exact-equality/full-fingerprint/shared Power TOEIC engine regression passed in Power Color CI `33690978044`; PR #599 merged as `61508bbc0a214873d023fb3487e14affe2de3a13`. This boundary authorizes only current AFT p.128/p.132 scope order and explicit JIS Z 8102:2001 structural definitions/classification. It does not authorize individual Grade 2 color-name membership, readings, Munsell values, RGB/HEX/display values, swatches, etymology, or Grade3→Grade2 inference.';
            if (!handoff.includes(marker)) throw new Error('handoff insertion marker missing');
            handoff = handoff.replace(marker, block + marker);
          }
          handoff = handoff.replace(/## Exact next start point[\s\S]*?Keep all Grade 3 blockers and source\/display gates unchanged\./, '## Exact next start point\n\nSource-acquire the individual Grade 2 p.128 `和色名` boundary from current explicit auditable authority. Do not infer the Grade 2 list or readings from Grade 3, and do not infer RGB/HEX/display values, swatches, Munsell values or appearance. If no sufficiently explicit auditable individual-name boundary is available, record p.128 `和色名` source-blocked rather than manufacturing questions.\n\nKeep all Grade 3 blockers and source/display gates unchanged.');
          fs.writeFileSync(handoffPath, handoff);

          let plan20 = fs.readFileSync(plan20Path, 'utf8');
          plan20 = plan20.replace('runtime frontier is 336 verified / pending 0 across twenty-eight promoted skills.', 'runtime frontier is 348 verified / pending 0 across twenty-nine promoted skills.');
          const oldNext20 = '- [ ] Continue from the current official Grade 2 TOC immediately after p.125: `慣用色名（JISの慣用色名より）` p.128, beginning with `和色名` p.128. Source-resolve an explicit auditable nonvisual name/fact boundary before authoring; do not infer monitor colors or unverified mappings.';
          const new20 = '- [x] Source-resolve the narrow p.128 JIS color-name structure boundary and author/independently QA `pc2.conventional.jis_name_structure`: 12/12 verified, pending 0, A/B/C/D=3/3/3/3; PR #597 merged.\n- [x] Promote `pc2.conventional.jis_name_structure` record-identically; runtime 336 → 348 and twenty-eight → twenty-nine skills; exact-equality/full-fingerprint/shared-engine CI `33690978044` succeeded; PR #599 merged.\n- [ ] Source-acquire the individual p.128 `和色名` boundary from explicit current auditable authority. Do not infer Grade 2 membership/readings from Grade 3 or infer monitor/display values.';
          if (!plan20.includes(new20)) {
            if (!plan20.includes(oldNext20)) throw new Error('20 plan next marker missing');
            plan20 = plan20.replace(oldNext20, new20);
          }
          fs.writeFileSync(plan20Path, plan20);

          let plan50 = fs.readFileSync(plan50Path, 'utf8');
          plan50 = plan50.replace('Grade 2 runtime is 336 verified / pending 0 across twenty-eight promoted skills.', 'Grade 2 runtime is 348 verified / pending 0 across twenty-nine promoted skills.');
          plan50 = plan50.replace('All twenty-eight promoted skills are covered by exact-equality/full-fingerprint/shared-engine gates. The latest promotion passed deterministic promotion run `33679550547`; PR #586 merged as `c2aa6a4384d5a3dc7b967bf932b2486795cadbba`.', 'All twenty-nine promoted skills are covered by exact-equality/full-fingerprint/shared-engine gates. The latest promotion passed Power Color CI `33690978044`; PR #599 merged as `61508bbc0a214873d023fb3487e14affe2de3a13`.');
          if (!plan50.includes('## p.128 `慣用色名（JISの慣用色名より）` — structure promoted')) {
            const marker = '## Exact next start point';
            const block = '## p.128 `慣用色名（JISの慣用色名より）` — structure promoted\n\nAudit: `docs/power-color/audits/2026-09-03-grade2-p128-jis-conventional-name-structure-source-audit.md`.\n\n`pc2.conventional.jis_name_structure` is limited to current AFT p.128/p.132 scope order and explicit JIS Z 8102:2001 structure: systematic versus conventional names and chromatic/achromatic systematic-name subdivision. Individual Grade 2 name membership, readings, Munsell values, RGB/HEX/display values, swatches, etymology and Grade3→Grade2 inference remain unauthorized. State: 12/12 independently verified and promoted record-identically; runtime 336 → 348 and twenty-eight → twenty-nine skills. Power Color CI `33690978044` passed; PR #599 merged as `61508bbc0a214873d023fb3487e14affe2de3a13`.\n\n';
            if (!plan50.includes(marker)) throw new Error('50 plan exact-next marker missing');
            plan50 = plan50.replace(marker, block + marker);
          }
          plan50 = plan50.replace(/## Exact next start point[\s\S]*?Keep all Grade 3 blockers and source\/display gates unchanged\./, '## Exact next start point\n\nSource-acquire the individual Grade 2 p.128 `和色名` boundary from current explicit auditable authority. Do not infer Grade 2 membership or readings from Grade 3, and do not infer RGB/HEX/display values, swatches, Munsell values or appearance. If no sufficiently explicit auditable boundary is available, record the topic source-blocked.\n\nKeep all Grade 3 blockers and source/display gates unchanged.');
          fs.writeFileSync(plan50Path, plan50);
          NODE
          node --test qualifications/color-certification/tests/grade2-conventional-jis-name-structure-authoring.test.js qualifications/color-certification/tests/grade2-runtime-promotion.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .automation-trigger-power-color-g2-p128-sync .github/workflows/tmp-power-color-g2-p128-sync.yml
          git add docs/power-color/STATUS.json docs/power-color/90_HANDOFF.md docs/power-color/20_EXECUTION_PLAN.md docs/power-color/50_GRADE2_EXECUTION_PLAN.md
          git commit -m "Sync Grade 2 p128 promotion state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
