name: Topic 22 generate simulation artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic22-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify Topic 22 artifacts
        run: |
          python3 denken-shinkansen/07_shinkansen_machine_2/topics/22_integrated_route_simulation/22_integrated_route_simulation_calc.py
      - name: Commit generated canonical artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=denken-shinkansen/07_shinkansen_machine_2/topics/22_integrated_route_simulation
          git add "$d/22_integrated_route_simulation_results.csv" \
                  "$d/22_time_speed.svg" \
                  "$d/22_time_acceleration.svg" \
                  "$d/22_time_current.svg" \
                  "$d/22_time_torque.svg" \
                  "$d/22_time_power.svg" \
                  "$d/22_time_regeneration_power.svg"
          git rm .github/workflows/topic22-generate.yml
          git commit -m "Topic 22: generate simulation CSV and graphs"
          git push origin HEAD:main
