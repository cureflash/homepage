name: Temporary Power Color Grade 2 p112 promotion

on:
  push:
    branches:
      - power-color-grade2-p112-promotion-20260902

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-p112-promotion-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified p112 records record-identically
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runtimePath = 'qualifications/color-certification/data/grade2-runtime.json';
          const batchPath = 'qualifications/color-certification/data/grade2-authoring-interior-style-name-inventory-0001-0012.json';
          const promotionTestPath = 'qualifications/color-certification/tests/grade2-runtime-promotion.test.js';
          const styleTestPath = 'qualifications/color-certification/tests/grade2-interior-style-name-inventory-authoring.test.js';
          const workflowPath = '.github/workflows/temp-power-color-grade2-p112-promotion.yml';

          const runtime = JSON.parse(fs.readFileSync(runtimePath, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
          if (batch.questions.length !== 12) throw new Error('expected 12 p112 questions');
          if (!batch.questions.every((q) => q.validationStatus === 'verified')) throw new Error('all p112 questions must be verified');
          if (runtime.questions.length !== 228 || runtime.skills.length !== 19) throw new Error(`unexpected runtime frontier ${runtime.questions.length}/${runtime.skills.length}`);
          if (runtime.skills.some((s) => s.id === batch.skill.id)) throw new Error('p112 skill already promoted');

          const fp = (q) => JSON.stringify([q.sentence, q.choices]);
          const existingIds = new Set(runtime.questions.map((q) => q.id));
          const existingFps = new Set(runtime.questions.map(fp));
          for (const q of batch.questions) {
            if (existingIds.has(q.id)) throw new Error(`duplicate id ${q.id}`);
            if (existingFps.has(fp(q))) throw new Error(`duplicate fingerprint ${q.id}`);
          }

          runtime.skills.push(batch.skill);
          runtime.questions.push(...batch.questions);
          if (runtime.questions.length !== 240 || runtime.skills.length !== 20) throw new Error('promotion count mismatch');
          fs.writeFileSync(runtimePath, JSON.stringify(runtime, null, 2) + '\n');

          let promotion = fs.readFileSync(promotionTestPath, 'utf8');
          promotion = promotion.replace(
            "const interiorElementColorRoles = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-element-color-roles-0001-0012.json', import.meta.url), 'utf8'));\n",
            "const interiorElementColorRoles = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-element-color-roles-0001-0012.json', import.meta.url), 'utf8'));\nconst interiorStyleNames = JSON.parse(await readFile(new URL('../data/grade2-authoring-interior-style-name-inventory-0001-0012.json', import.meta.url), 'utf8'));\n"
          );
          promotion = promotion.replace(
            'const batches = [foundation, triad, munsell, naturalComplex, dominant, toneOnTone, toneInTone, tonal, camaieu, bicolorTricolor, hueCircleDivision, imageSchemeKeywords, rgbCmykModels, colorManagementProfiles, imageBasics, basicTrend, interiorColorPlanning, interiorZoning, interiorElementColorRoles];',
            'const batches = [foundation, triad, munsell, naturalComplex, dominant, toneOnTone, toneInTone, tonal, camaieu, bicolorTricolor, hueCircleDivision, imageSchemeKeywords, rgbCmykModels, colorManagementProfiles, imageBasics, basicTrend, interiorColorPlanning, interiorZoning, interiorElementColorRoles, interiorStyleNames];'
          );
          promotion = promotion.replaceAll('228', '240').replaceAll('57', '60');
          if (!promotion.includes('interiorStyleNames') || !promotion.includes('runtime.questions.length, 240') || !promotion.includes('totalCount: 60')) throw new Error('promotion test rewrite failed');
          fs.writeFileSync(promotionTestPath, promotion);

          let style = fs.readFileSync(styleTestPath, 'utf8');
          style = style.replace('independently verified, inventory-only, balanced and not yet runtime-promoted', 'independently verified, inventory-only, balanced and runtime-promoted record-identically');
          const oldTail = `  const runtimeFingerprints = new Set(runtime.questions.map(fingerprint));\n  assert.equal(batchFingerprints.some((fp) => runtimeFingerprints.has(fp)), false);\n  assert.equal(runtime.questions.some((q) => q.skillId === batch.skill.id), false);`;
          const newTail = `  const runtimeQuestions = runtime.questions.filter((q) => q.skillId === batch.skill.id);\n  assert.deepEqual(runtimeQuestions, batch.questions);\n  assert.deepEqual(runtime.skills.find((skill) => skill.id === batch.skill.id), batch.skill);`;
          if (!style.includes(oldTail)) throw new Error('style test old promotion boundary not found');
          style = style.replace(oldTail, newTail);
          fs.writeFileSync(styleTestPath, style);

          fs.unlinkSync(workflowPath);
          NODE
      - name: Run Power Color gates
        run: node --test qualifications/color-certification/tests/*.test.js
      - name: Commit generated promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Promote Grade 2 interior style names to runtime"
          git push origin HEAD:power-color-grade2-p112-promotion-20260902
