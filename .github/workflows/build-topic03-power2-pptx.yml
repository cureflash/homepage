name: Build Topic 03 PowerPoint

on:
  push:
    branches: [main]
    paths:
      - '.github/automation/topic03_power2_pptx.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-pptx==1.0.2
      - name: Generate PowerPoint
        run: python .github/automation/topic03_power2_pptx.py
      - name: Commit generated PowerPoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add denken-shinkansen/06_shinkansen_power_2/topics/03_thermal_power/03_thermal_power_images.pptx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add Topic 03 thermal power images"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
