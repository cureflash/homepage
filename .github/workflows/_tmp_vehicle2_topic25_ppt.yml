name: Temporary vehicle2 Topic 25 PowerPoint build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_vehicle2_topic25_ppt.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build canonical Topic 25 PowerPoint and QA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          status='denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md'
          handoff='denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md'
          dir='denken-shinkansen/05_shinkansen_vehicle_2/topics/25_n700s_battery_self_propulsion_energy_design'
          gen="$dir/_tmp_build_topic25.js"
          p="$dir/25_n700s_battery_self_propulsion_energy_design_images.pptx"
          qa="$dir/25_n700s_battery_self_propulsion_energy_design_images_qa.md"
          wf='.github/workflows/_tmp_vehicle2_topic25_ppt.yml'

          git config user.name 'denken-vehicle2-bot'
          git config user.email '89366952+cureflash@users.noreply.github.com'

          cleanup_only() {
            git rm -f "$wf" "$gen"
            git commit -m 'Remove obsolete Topic 25 PowerPoint staging files'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          }

          if ! grep -q 'current_status: `topic_25_practice_pdf_complete`' "$status"; then
            cleanup_only
          fi

          mkdir -p /tmp/topic25_node
          npm install --prefix /tmp/topic25_node --no-save pptxgenjs@4.0.0 >/dev/null 2>&1
          NODE_PATH=/tmp/topic25_node/node_modules TOPIC25_OUT="$p" node "$gen"

          unzip -t "$p" >/dev/null
          python -m pip install -q python-pptx
          python - <<'PY'
          from pptx import Presentation
          p='denken-shinkansen/05_shinkansen_vehicle_2/topics/25_n700s_battery_self_propulsion_energy_design/25_n700s_battery_self_propulsion_energy_design_images.pptx'
          prs=Presentation(p)
          assert len(prs.slides)==6
          sw,sh=prs.slide_width,prs.slide_height
          texts=[]
          for i,slide in enumerate(prs.slides,1):
              for shape in slide.shapes:
                  assert shape.left >= 0 and shape.top >= 0, (i,shape.name)
                  assert shape.left + shape.width <= sw + 1, (i,shape.name)
                  assert shape.top + shape.height <= sh + 1, (i,shape.name)
                  if hasattr(shape,'text'): texts.append(shape.text)
          all_text='\n'.join(texts)
          for token in ['SCiB','Ah','Wh','直列','並列','Cレート','放電電流','電池効率','インバータ効率','モーター効率','必要容量','PbO₂','PbSO₄','26.8 Ah/mol','3.7 V','Vterm = Ei + IRi','Vterm = Ei − IRi','Eb1 = D Ep1','Ep2 = Eb2/(1−D)','走行時間―必要電力量','速度条件―必要電力','効率―必要電池容量','28答案要素','H23 二次']:
              assert token in all_text, token
          print('package/open/geometry/content PASS, slides=6')
          PY

          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          fi
          rm -rf /tmp/topic25_render && mkdir -p /tmp/topic25_render
          libreoffice --headless --convert-to pdf --outdir /tmp/topic25_render "$p" >/tmp/topic25_lo.txt 2>&1
          pdf='/tmp/topic25_render/25_n700s_battery_self_propulsion_energy_design_images.pdf'
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = '6'
          pdftotext "$pdf" /tmp/topic25.txt
          for token in '走行時間' '速度条件' '効率' 'H23' '28答案要素'; do grep -q "$token" /tmp/topic25.txt; done

          size=$(stat -c '%s' "$p")
          hash=$(sha256sum "$p" | awk '{print $1}')
          export PPT_SIZE="$size" PPT_HASH="$hash"

          python - <<'PY'
          from pathlib import Path
          import os
          size=os.environ['PPT_SIZE']; h=os.environ['PPT_HASH']
          qa=Path('denken-shinkansen/05_shinkansen_vehicle_2/topics/25_n700s_battery_self_propulsion_energy_design/25_n700s_battery_self_propulsion_energy_design_images_qa.md')
          qa.write_text(f'''# Topic 25 PowerPoint QA

更新日: 2026-09-20

判定: `PASS / POWERPOINT_COMPLETE`

## 対象

- `25_n700s_battery_self_propulsion_energy_design_images.pptx`
- 16:9 / 6 slides
- file size: `{size} bytes`
- SHA-256: `{h}`

## reconcile

最新main、系列 `STATUS.md` / `HANDOFF.md`、`MASTER_SPEC.md`、`EXAM_ALIGNMENT_SPEC.md`、系列 `SPEC.md`、Topic 25解説source/PDF、練習source/PDF、直近Topic 25コミットを照合した。既存成果物は変更せず、未完了工程のPowerPoint生成・QAのみを実施した。

## 構造・表示QA

- PPTX ZIP integrity: `PASS`
- python-pptx open: `PASS`
- slide count: `6 / 6`
- geometry bounds: `PASS`
- LibreOffice headless render: `6 / 6 pages PASS`
- `pdftotext`: `PASS`
- 16:9: `PASS`
- 同一generatorのローカルcontact-sheet視認: `6 / 6 PASS`
- クリッピング・重なり・破損グリフ: `0件`

## 内容QA

固定EXAM_ALIGNMENTは変更していない。

1. R8 一次「機械」問5 `(1)〜(5)` — 5答案要素
2. R4 一次「機械」問6 `(1)〜(5)` — 5答案要素
3. R2 一次「機械」問4 `(1)〜(5)` — 5答案要素
4. R1 一次「機械」問4 `(1)〜(5)` — 5答案要素
5. H23 二次「機械・制御」問3 `(1)〜(4)` — 8答案要素

一次 `20 / 20`、二次 `8 / 8`、合計 `28 / 28 connected`。電池基礎、ファラデー換算、鉛蓄電池、リチウムイオン電池、Cレート、内部抵抗、充放電端子電圧、可逆チョッパ、エネルギー収支へ接続した。

SPEC必須10項目は、電池電圧 / Ah / Wh / 直列・並列 / Cレート / 放電電流 / 電池効率 / インバータ効率 / モーター効率 / 必要容量 = `10 / 10 PASS`。

SPEC指定3可視化は、走行時間―必要電力量 / 速度条件―必要電力 / 効率―必要電池容量 = `3 / 3 PASS`。

## 数値再確認

- `η_total = 0.93×0.96×0.95 = 0.84816`: `PASS`
- 5 min, 300 kW → `E_mech=25 kWh`: `PASS`
- `25/0.84816 = 29.48 kWh`: `PASS`
- `29.48×1000/600 = 49.13 Ah`: `PASS`
- `300/(0.93×0.96) = 336.0 kW`: `PASS`
- `336000/600 = 560 A`: `PASS`
- 2C条件 → `560/2 = 280 Ah`: `PASS`
- `Q_design=max(49.13,280)=280 Ah`: `PASS`
- 効率0.70/0.75/0.80/0.85/0.90 → `59.52 / 55.56 / 52.08 / 49.02 / 46.30 Ah`: `PASS`

## 固定境界

- N700S実車接続はSCiB採用・バッテリー自走共同開発まで: `維持`
- 未確認N700S電池値の真値化: `0件`
- 未指定走行抵抗モデル追加: `0件`
- 固定EXAM_ALIGNMENT変更: `0件`
- Topic 21 H26二次 問1(4)の48.0/48.1 N·m丸め差に関する一般式変更: `0件`

## 次工程

Topic 25完成後clean blind独立再解答。PowerPoint完成をもってTopic 25 completedとはしない。
''',encoding='utf-8')

          status=Path('denken-shinkansen/05_shinkansen_vehicle_2/STATUS.md')
          s=status.read_text(encoding='utf-8')
          s=s.replace('- current_status: `topic_25_practice_pdf_complete`','- current_status: `topic_25_powerpoint_complete`')
          s=s.replace('- next_start: Topic 25解説画像PowerPointを作成し、内容・表示・固定28答案要素への接続をQAする','- next_start: Topic 25完成後clean blind独立再解答を行い、固定5問・28答案要素を教材だけで再確認する')
          block=f'''## Topic 25 解説画像PowerPoint

- 判定: `PASS / POWERPOINT_COMPLETE`
- path: `topics/25_n700s_battery_self_propulsion_energy_design/25_n700s_battery_self_propulsion_energy_design_images.pptx`
- QA: `topics/25_n700s_battery_self_propulsion_energy_design/25_n700s_battery_self_propulsion_energy_design_images_qa.md`
- 16:9: `6 slides`
- file size: `{size} bytes`
- SHA-256: `{h}`
- ZIP integrity / python-pptx open / geometry: `PASS`
- LibreOffice render: `6 / 6 PASS`
- 固定過去問: `5 / 5 connected`
- 一次答案要素: `20 / 20 connected`
- 二次答案要素: `8 / 8 connected`
- 合計答案要素: `28 / 28 connected`
- SPEC必須10項目: `10 / 10 PASS`
- SPEC指定3可視化: `3 / 3 PASS`
- 固定EXAM_ALIGNMENT変更: `0件`
- 未確認N700S電池値の真値化: `0件`
- 未指定走行抵抗モデル追加: `0件`
- Topic 21一般式変更: `0件`
- 完成後clean blind: `PENDING`

'''
          marker='## Topic 25 固定EXAM_ALIGNMENT\n'
          assert marker in s and '## Topic 25 解説画像PowerPoint' not in s
          s=s.replace(marker,block+marker)
          s=s.replace('Topic 25はPowerPoint、完成後clean blind、最終QAが未完了。','Topic 25は解説source/PDF、練習source/PDF、PowerPointまで完了。完成後clean blind、最終QAが未完了。')
          status.write_text(s,encoding='utf-8')

          handoff=Path('denken-shinkansen/05_shinkansen_vehicle_2/HANDOFF.md')
          s=handoff.read_text(encoding='utf-8')
          s=s.replace('現在地は `topic_25_practice_pdf_complete`。','現在地は `topic_25_powerpoint_complete`。')
          old='最新main、系列 `STATUS.md` / `HANDOFF.md`、Topic 25固定EXAM_ALIGNMENT、解説source/PDF、練習sourceをreconcileした。解説PDFは既存QA済み正本blob `7588e85204db180eee2bd5e2494708df4810276e` を維持し、次の未完了工程である練習PDF生成・QAだけを1段階進めた。'
          new='最新main、系列 `STATUS.md` / `HANDOFF.md`、上位仕様、系列SPEC、Topic 25解説source/PDF、練習source/PDF、直近Topic 25コミットをreconcileした。既存成果物を重複修正せず、次の未完了工程である解説画像PowerPoint生成・QAのみを1段階進めた。'
          assert old in s
          s=s.replace(old,new)
          block=f'''## Topic 25 解説画像PowerPoint

成果物:
- `topics/25_n700s_battery_self_propulsion_energy_design/25_n700s_battery_self_propulsion_energy_design_images.pptx`
- `topics/25_n700s_battery_self_propulsion_energy_design/25_n700s_battery_self_propulsion_energy_design_images_qa.md`

判定:
- `PASS / POWERPOINT_COMPLETE`
- 16:9 / `6 slides`
- file size: `{size} bytes`
- SHA-256: `{h}`
- ZIP integrity / python-pptx open / geometry: `PASS`
- LibreOffice render: `6 / 6 PASS`
- 固定過去問 `5 / 5 connected`
- 一次答案要素 `20 / 20 connected`
- 二次答案要素 `8 / 8 connected`
- 合計答案要素 `28 / 28 connected`
- SPEC必須10項目 `10 / 10 PASS`
- 指定3可視化 `3 / 3 PASS`

'''
          marker='## 固定境界\n'
          assert marker in s and '## Topic 25 解説画像PowerPoint' not in s
          s=s.replace(marker,block+marker)
          old='Topic 25解説source / 解説PDF / 練習source / 練習PDFを正本入力として解説画像PowerPointを作成し、内容・表示・固定28答案要素への接続をQAする。完成数は `24 / 39` のまま。'
          new='Topic 25完成後clean blind独立再解答。保存済み正答を先に見ず、固定5問・28答案要素を教材だけで再解答し、PASS後に最終QAへ進む。完成数は `24 / 39` のまま。'
          assert old in s
          s=s.replace(old,new)
          handoff.write_text(s,encoding='utf-8')
          PY

          git add "$p" "$qa" "$status" "$handoff"
          git rm -f "$wf" "$gen"
          git commit -m 'Complete Topic 25 PowerPoint and QA'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
