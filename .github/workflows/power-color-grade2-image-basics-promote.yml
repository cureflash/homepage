name: Power Color Grade 2 image-basics promotion

on:
  push:
    branches:
      - power-color-grade2-image-basics-promotion-20260902
    paths:
      - 'qualifications/color-certification/scripts/promote-grade2-image-basics.mjs'
      - '.github/workflows/power-color-grade2-image-basics-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-color-grade2-image-basics-promotion-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote verified image-basics batch
        run: node qualifications/color-certification/scripts/promote-grade2-image-basics.mjs
      - name: Commit generated runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qualifications/color-certification/data/grade2-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m "Power Color: promote Grade 2 image basics to runtime"
          git push origin HEAD:power-color-grade2-image-basics-promotion-20260902
