name: PlarailController

options:
  deploymentTarget:
    iOS: "16.0"

targets:
  PlarailController:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cureflash.plarailcontroller
        PRODUCT_NAME: PlarailController
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Plarail Controller"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "プラレール車両とのBluetooth通信に使用します。"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme: {}
