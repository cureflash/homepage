<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1eb" />
  <title>舞 3Dポーズビューア</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.3/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button id="builtinMai" type="button">内蔵モデル</button>
      <button id="openVrmButton" class="fileButton" type="button">Mai.vrmを開く</button>
      <input id="vrmFile" type="file" accept="application/octet-stream,model/gltf-binary,.vrm" hidden />
      <button id="resetView" type="button">表示を戻す</button>
      <span id="status" class="status">VRMを開くと自動で舞化します</span>
    </header>

    <main class="workspace">
      <section id="viewer" class="viewer" aria-label="3Dビュー">
        <div id="emptyState" class="emptyState">
          <div class="emptyTitle">Mai.vrmを選択してください</div>
          <div class="emptySub">「Mai.vrmを開く」を押して、ファイルからMai.vrmを選択してください</div>
        </div>
      </section>

      <aside class="panel">
        <section class="panelSection">
          <h2>視点</h2>
          <div class="buttonGrid three">
            <button type="button" data-view="front">正面</button>
            <button type="button" data-view="side">側面</button>
            <button type="button" data-view="back">背面</button>
          </div>
        </section>

        <section class="panelSection">
          <h2>ポーズ</h2>
          <div class="buttonGrid two">
            <button id="poseReset" type="button">リセット</button>
            <button type="button" data-pose="armsSide">腕を横</button>
            <button type="button" data-pose="armsUp">腕を上げる</button>
            <button type="button" data-pose="staff">杖構え</button>
          </div>
        </section>

        <section class="panelSection">
          <h2>関節</h2>
          <label class="fieldLabel" for="boneSelect">骨</label>
          <select id="boneSelect"></select>

          <div class="sliderRow">
            <label for="rotX">X</label>
            <input id="rotX" type="range" min="-140" max="140" value="0" step="1" />
            <output id="rotXValue">0°</output>
          </div>
          <div class="sliderRow">
            <label for="rotY">Y</label>
            <input id="rotY" type="range" min="-140" max="140" value="0" step="1" />
            <output id="rotYValue">0°</output>
          </div>
          <div class="sliderRow">
            <label for="rotZ">Z</label>
            <input id="rotZ" type="range" min="-140" max="140" value="0" step="1" />
            <output id="rotZValue">0°</output>
          </div>
        </section>

        <section class="panelSection compact">
          <label class="checkRow">
            <input id="showBones" type="checkbox" />
            骨ガイドを表示
          </label>
          <label class="checkRow">
            <input id="showGrid" type="checkbox" checked />
            床グリッドを表示
          </label>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const openVrmButton = document.getElementById('openVrmButton');
    const vrmFile = document.getElementById('vrmFile');
    openVrmButton.addEventListener('click', () => {
      vrmFile.value = '';
      vrmFile.click();
    });
  </script>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
