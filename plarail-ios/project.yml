name: PlarailController
options:
  bundleIdPrefix: com.cureflash
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO

targets:
  PlarailController:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - Package.swift
          - Resources
          - project.yml
          - Info.plist
          - build
          - Payload
    resources:
      - path: Resources/shinkansen
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlarailController
        NSBluetoothAlwaysUsageDescription: "プラレール車両との接続にBluetoothを使用します。"
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cureflash.plarailcontroller
        PRODUCT_NAME: PlarailController
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets: []
